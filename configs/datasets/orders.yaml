# configs/datasets/orders.yaml — the second real, non-illustrative dataset
# config in this repository (08-CONTEXT.md D-13..D-17). Proves `orders` runs
# through the SAME config-driven Source -> Stage -> Publisher pipeline
# `customers.yaml` already uses, no new capability invented (08-05-PLAN.md
# objective).
#
# Merged OVER configs/defaults.yaml, then validated against
# dataplat.config.model.DatasetConfig (dataplat.config.loader.load_config).
# dataplat.config.registry.ConfigRegistry.sync() hashes the merged, validated
# document (dataplat.config.hashing.hash_config) and versions it into
# meta.config_versions the moment it syncs, exactly as customers.yaml does.
#
# Shape mirrors customers.yaml's own (source:/deduplication:/load:/
# batching:/columns: blocks), adapted to normalized.orders's four business
# columns (order_id, customer_id, order_date, amount).
#
# quality: is 08-08's own addition -- D-16's orphan-order handling
# (ReferentialIntegrityBarrier, error_type=REFERENTIAL_ORPHAN,
# strategy=QUARANTINE_RECORD). Unlike customers.yaml's quality: block
# (completeness/uniqueness/validity-range/pattern), orders' only rule is
# REFERENTIAL -- the two datasets' quality: blocks are deliberately not
# identical shapes (08-PATTERNS.md line 548).
#
# No filename:/normalization: blocks either -- customers.yaml's own
# precedent (no filename-mask delivery shape, no numeric/currency locale
# needs) still holds here: `amount`'s decimal type parses correctly under
# NumericNormalizer's own defaults (decimal_separator=".", no thousands
# separator) for a plain "123.45"-shaped value, which is exactly what this
# plan's synthetic fixture uses -- StagingLoader falls back to those same
# defaults whenever DatasetConfig.normalization is None
# (dataplat.load.staging, decimal_separator=... if normalization is not
# None else ".").

dataset: orders
config_schema_version: 1
source:
  type: csv
  bucket: raw
  path: orders/
  change_semantics: snapshot
  duplicate_policy: skip
load:
  # NOTE the deliberate divergence from customers.yaml's `strategy: merge`:
  # `merge_orders` is a DIFFERENT registry key resolving to a DIFFERENT
  # Publisher (OrdersMergePublisher, load/publish/merge_orders.py) -- this
  # phase's registry split is per-dataset (each Publisher is single-dataset,
  # hardcoded against its own target table's real schema), so `orders` needs
  # its own strategy key even though the config SHAPE around it is otherwise
  # identical to customers.yaml's (D-17).
  strategy: merge_orders
  target: normalized.orders
batching:
  max_units_per_run: 100

# reconciliation: is D-25's dataset-conditional reconciliation sum-check
# (VALID-05) -- orders has a natural numeric column (amount) to sum and
# compare source-vs-target on; customers.yaml declares no reconciliation:
# block since it has no natural numeric column (event_ts/birth_date are
# dates, not summable amounts).
reconciliation:
  sum_columns: [amount]

quality:
  rules:
    - rule_id: orders_customer_id_referential
      rule_type: REFERENTIAL
      strategy: QUARANTINE_RECORD
      column: customer_id
      # target_table (08-11-PLAN.md): the REFERENTIAL BarrierStage this
      # rule dispatches to (dataplat.validate.referential.
      # ReferentialIntegrityBarrier, wired into run_ingest by plan 08-11)
      # requires an explicit params.target_table -- there is no implicit
      # default, so this must be declared here for orders' real
      # orders.customer_id -> normalized.customers.customer_id
      # relationship (this platform's one real referential relationship).
      params:
        target_table: normalized.customers

# retention: is D-36/D-37/D-38/D-39's per-dataset retention-window
# declaration (Phase 11, 11-CONTEXT.md) -- same tiered defaults and same
# deliberate raw_days omission as customers.yaml's own retention: block;
# see that file's comment for the full D-37 tiering rationale.
retention:
  processed_days: 60
  quarantine_days: 180
  validation_reports_days: 730
  ingestion_metadata_days: 730
  logs_days: 30
  enforce: false

# columns: is D-17's minimal orders schema -- order_id/customer_id/
# order_date/amount, mirroring customers.yaml's own columns: shape and
# strptime-format discipline (STACK.md §F: dates are never parsed by
# inference).
columns:
  - name: order_id
    type: string
    nullable: false
    required: true
    business_key: true
    description: "Natural business key for an order record"
  - name: customer_id
    type: string
    nullable: false
    required: true
    description: >-
      References customers.customer_id -- checked by
      ReferentialIntegrityBarrier (a later plan, 08-08); this plan proves
      orders can publish rows without that barrier existing yet.
  - name: order_date
    type: date
    nullable: true
    required: true
    format: "%Y-%m-%d"
  - name: amount
    type: decimal
    nullable: true
    required: true
