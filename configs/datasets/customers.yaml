# configs/datasets/customers.yaml — COMMITTED. The first real, non-illustrative
# dataset config in this repository (CONTEXT.md D-02).
#
# Merged OVER configs/defaults.yaml, then validated against
# dataplat.config.model.DatasetConfig (dataplat.config.loader.load_config).
# dataplat.config.registry.ConfigRegistry.sync() hashes the merged, validated
# document (dataplat.config.hashing.hash_config) and versions it into
# meta.config_versions the moment it syncs.
#
# Shape follows ARCHITECTURE.md's worked `transactions.yaml` example (Q4.4,
# lines 526-541), adapted to normalized.customers's columns (CONTEXT.md D-02:
# customer_id, name, country, birth_date, event_ts).
#
# 04-03-PLAN.md Task 1 adds two fields dataplat.discovery.discover_files
# depends on: source.duplicate_policy (D-13, a locked decision -- a
# re-uploaded file whose content hash is already known for this dataset is
# recorded but never assigned a run) and batching.max_units_per_run
# (ORCH-03 -- the hard cap on how many units one discovery run hands to
# Dynamic Task Mapping; 100 is comfortably below Airflow's platform-level
# max_map_length default of 1024 and far above this phase's actual test
# file counts).

dataset: customers
config_schema_version: 1
source:
  type: csv
  bucket: raw
  path: customers/
  change_semantics: snapshot
  duplicate_policy: skip
load:
  strategy: scd
  target: normalized.customers
batching:
  max_units_per_run: 100

# freshness: is D-08's opt-in data-freshness expectation (OBS-01/OBS-09),
# flowing through ConfigRegistry.sync() into meta.datasets' three new
# nullable interval columns (migration 0010). A reasonable illustrative
# value for a daily customer feed: expect a new file at least once per day,
# WARN 2 hours past that, FAIL 6 hours past that.
freshness:
  expected_frequency: "1 day"
  warn_after: "2 hours"
  fail_after: "6 hours"

# quality: is D-09's real (not fixture-only) quality block -- this is the
# ONE real cycling dataset that proves the full VALID-01/02/03/04 chain
# live (08-11-PLAN.md). Every rule below uses REJECT_RECORD -- deliberately
# NOT FAIL_FILE/QUARANTINE_FILE (T-08-26, 08-10's threat model): those two
# strategies stay proven only by test_strategy_dispatch.py's unit coverage,
# never exercised against this real cycling dataset in this phase.
#   - completeness on `name` (every real corpus row has one; a violation
#     here is a genuine synthetic-generator bug, not expected traffic)
#   - pattern on `country`, matching the corpus generator's own 2-letter
#     ISO-3166-1-alpha-2 pick list (tests/fixtures/slice-corpus.yaml's
#     `country:` block: "PL", "US", "GB", ... -- verified against the
#     fixture before locking this pattern)
# rejection_rate_threshold is deliberately permissive (0.5): this is the
# platform's one real cycling dataset, and a low threshold would make
# ordinary demo/E2E traffic noise trip the circuit breaker, which is not
# this plan's intent -- the breaker exists to catch a genuinely broken
# run, not to police this corpus's own synthetic imperfection rate.
#
# 10-07-PLAN.md Task 1 (Rule 1 fix): removed the pre-existing
# `customers_customer_id_uniqueness` QUALITY_UNIQUENESS rule. It predates
# Phase 10's SCD strategy and encoded a MergePublisher-era assumption --
# "two rows sharing a customer_id within one file is always a data error"
# -- that is now WRONG under `load.strategy: scd`. D-11's late-correction
# fixture (tools/corpus/dated_series.py's `late_correction_arrival_day_
# index`/`late_correction_member_index`, plan 10-06) deliberately appends
# a SECOND, backdated row for an already-present roster member to prove
# SCD-07 (a correction repositions chronologically, not merely appends) --
# a legitimate, intentional multi-observation-per-file shape, not
# corruption. `UniquenessRule` is a REJECT_RECORD, within-chunk,
# first-occurrence-wins rule (packages/dataplat/src/dataplat/validate/
# uniqueness.py); left in place, it would have silently dropped the
# LATER-occurring correction row before it ever reached `staging.
# customers`, making SCD-07's live proof structurally impossible and
# silently discarding genuine correction data outside a live test too --
# a real, general correctness bug for this dataset's ongoing operation,
# not merely a test-fixture inconvenience. `normalized.customers`'s own
# correctness under `scd` no longer depends on pre-publish key uniqueness
# at all: `SCDPublisher`'s `recompute_version_chain` (plan 10-02)
# deterministically folds EVERY bronze row for a key -- including
# legitimate same-file duplicates -- into the correct version chain by
# `(event_ts, source_row_number)` order. `customers_name_completeness`/
# `customers_country_pattern` are unaffected and still apply.
quality:
  rules:
    - rule_id: customers_name_completeness
      rule_type: QUALITY_COMPLETENESS
      strategy: REJECT_RECORD
      column: name
    - rule_id: customers_country_pattern
      rule_type: QUALITY_PATTERN
      strategy: REJECT_RECORD
      column: country
      params:
        pattern: "^[A-Z]{2}$"
  rejection_rate_threshold: 0.5

# scd: is D-05/D-06's SCD2 DELETE-semantics and mass-delete circuit-breaker
# declaration (Phase 10, 10-CONTEXT.md). delete_semantics: invalidate means
# a customer_id present historically but absent from this pass's snapshot
# has its current version closed out, with no new version opened.
# mass_delete_threshold: 0.10 reuses Phase 8's 10% starting reference value
# as a first-pass, tunable circuit-breaker threshold.
scd:
  delete_semantics: invalidate
  mass_delete_threshold: 0.10

# retention: is D-36/D-37/D-38/D-39's per-dataset retention-window
# declaration (Phase 11, 11-CONTEXT.md). raw_days is deliberately OMITTED
# (not merely left at its default): rebuild-from-raw (INCR-07) needs the
# FULL raw history to work, so raw's indefinite default is a deliberate
# choice, not an oversight -- the comment IS the record of that choice.
# processed/quarantine/validation_reports/ingestion_metadata/logs use
# concrete numeric defaults within D-37's locked tiers: processed (cheaply
# re-derivable from raw) short, quarantine (unresolved work needing human
# attention) longer, validation reports + ingestion metadata (the audit/
# lineage trail the Core Value statement promises) long, logs (standard
# operational hygiene) short. enforce: false matches D-38's dry-run-by-
# default safety guarantee -- RetentionConfig.enforce already defaults to
# False at the Pydantic model level, so this line is explicit-not-implicit
# documentation of that guarantee, not what makes it true.
retention:
  processed_days: 60
  quarantine_days: 180
  validation_reports_days: 730
  ingestion_metadata_days: 730
  logs_days: 30
  enforce: false

# columns: is D-18's source of truth for per-column type/nullable/required/
# business_key/semantics, cross-validated against deduplication.keys above
# (customer_id here is business_key: true, matching keys: [customer_id]).
# Column order matches normalized.customers's real column order and the
# strptime formats verified against tests/fixtures/slice-corpus.yaml's
# generator manifest (birth_date renders as "1950-03-14"; event_ts renders
# as "2026-01-05T08:15:00Z" -- %z accepts a literal "Z" as UTC since
# Python 3.7). The opt-in filename-mask and normalization/locale blocks are
# deliberately absent from this file: customers has no filename-mask
# delivery shape (D-10) and no numeric/currency columns needing a locale
# profile (D-12's consequence) -- not an oversight.
#
# signup_country (D-13) is a new Type-0 dimension column: accepted from the
# first bronze row seen for a customer_id and ignored on every later row --
# required: false since files delivered before this column existed never
# carried it, and D-13's own semantics is "accept on first insert, ignore
# later," not "reject files missing it."
columns:
  - name: customer_id
    type: string
    nullable: false
    required: true
    business_key: true
    description: "Natural business key for a customer record"
  - name: name
    type: string
    nullable: false
    required: true
    scd_type: type_2
  - name: country
    type: string
    nullable: false
    required: true
    scd_type: type_2
  - name: birth_date
    type: date
    nullable: true
    required: true
    format: "%Y-%m-%d"
    scd_type: type_1
  - name: event_ts
    type: timestamp
    nullable: false
    required: true
    format: "%Y-%m-%dT%H:%M:%S%z"
  - name: signup_country
    type: string
    nullable: true
    required: false
    scd_type: type_0
    description: "Country the customer originally signed up from (SCD Type 0, D-13)"
