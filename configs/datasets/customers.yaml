# configs/datasets/customers.yaml — COMMITTED. The first real, non-illustrative
# dataset config in this repository (CONTEXT.md D-02).
#
# Merged OVER configs/defaults.yaml, then validated against
# dataplat.config.model.DatasetConfig (dataplat.config.loader.load_config).
# dataplat.config.registry.ConfigRegistry.sync() hashes the merged, validated
# document (dataplat.config.hashing.hash_config) and versions it into
# meta.config_versions the moment it syncs.
#
# Shape follows ARCHITECTURE.md's worked `transactions.yaml` example (Q4.4,
# lines 526-541), adapted to normalized.customers's columns (CONTEXT.md D-02:
# customer_id, name, country, birth_date, event_ts).
#
# 04-03-PLAN.md Task 1 adds two fields dataplat.discovery.discover_files
# depends on: source.duplicate_policy (D-13, a locked decision -- a
# re-uploaded file whose content hash is already known for this dataset is
# recorded but never assigned a run) and batching.max_units_per_run
# (ORCH-03 -- the hard cap on how many units one discovery run hands to
# Dynamic Task Mapping; 100 is comfortably below Airflow's platform-level
# max_map_length default of 1024 and far above this phase's actual test
# file counts).

dataset: customers
config_schema_version: 1
source:
  type: csv
  bucket: raw
  path: customers/
  change_semantics: snapshot
  duplicate_policy: skip
deduplication:
  strategy: business_key_latest
  keys: [customer_id]
  order_by: [event_ts desc]
load:
  strategy: merge
  target: normalized.customers
batching:
  max_units_per_run: 100

# freshness: is D-08's opt-in data-freshness expectation (OBS-01/OBS-09),
# flowing through ConfigRegistry.sync() into meta.datasets' three new
# nullable interval columns (migration 0010). A reasonable illustrative
# value for a daily customer feed: expect a new file at least once per day,
# WARN 2 hours past that, FAIL 6 hours past that.
freshness:
  expected_frequency: "1 day"
  warn_after: "2 hours"
  fail_after: "6 hours"

# columns: is D-18's source of truth for per-column type/nullable/required/
# business_key/semantics, cross-validated against deduplication.keys above
# (customer_id here is business_key: true, matching keys: [customer_id]).
# Column order matches normalized.customers's real column order and the
# strptime formats verified against tests/fixtures/slice-corpus.yaml's
# generator manifest (birth_date renders as "1950-03-14"; event_ts renders
# as "2026-01-05T08:15:00Z" -- %z accepts a literal "Z" as UTC since
# Python 3.7). The opt-in filename-mask and normalization/locale blocks are
# deliberately absent from this file: customers has no filename-mask
# delivery shape (D-10) and no numeric/currency columns needing a locale
# profile (D-12's consequence) -- not an oversight.
columns:
  - name: customer_id
    type: string
    nullable: false
    required: true
    business_key: true
    description: "Natural business key for a customer record"
  - name: name
    type: string
    nullable: false
    required: true
  - name: country
    type: string
    nullable: false
    required: true
  - name: birth_date
    type: date
    nullable: true
    required: true
    format: "%Y-%m-%d"
  - name: event_ts
    type: timestamp
    nullable: false
    required: true
    format: "%Y-%m-%dT%H:%M:%S%z"
