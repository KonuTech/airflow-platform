# Secret-scanner configuration (SEC-02, SEC-10, SEC-11).
#
# Read this before widening anything below.
#
# The synthetic CSV corpus is high-entropy by construction: account numbers,
# IBANs, long identifiers and token-shaped strings. gitleaks' generic
# high-entropy rules fire on them. The obvious "fix" is a repository-wide
# pattern allowlist, and six months later a real key ships past a control that
# everyone believes is on. Every allowlist here is therefore scoped by path AND
# by the synthetic-value prefix at the same time, so the prefix buys silence
# only inside the fixture tree. `tools/security/gitleaks_selftest.py` asserts
# exactly that: a SYNTH_-prefixed value under packages/ is still reported.
#
# Consumed by `make gitleaks` (full history + working tree) and by the
# `Secret scan (full history)` CI job. Every invocation carries --redact, so a
# finding never reaches a log with its value intact (SEC-10).

title = "airflow-platform"

[extend]
# Inherit the full upstream ruleset. This project adds no rules of its own:
# a hand-maintained subset of gitleaks' detections is a control that silently
# rots as the upstream ruleset grows.
useDefault = true

[[allowlists]]
description = """
Generated synthetic CSV corpus (tests/fixtures/). Every credential-shaped value
in the corpus carries the SYNTH_ prefix by construction — the generator emits
it, it is not a naming convention anyone has to remember.

condition = "AND" is load-bearing: it requires BOTH the path and the regex to
match. With gitleaks' default OR, this single entry would allowlist the SYNTH_
prefix across the entire repository, which is the global-pattern failure this
config exists to avoid. Do not remove the condition, and do not add a path
outside the fixture tree. A real secret dropped into this tree is still
reported, because it will not carry the prefix.
"""
paths = ['''^tests/fixtures/.*''']
regexTarget = "line"
regexes = ['''SYNTH_[A-Za-z0-9]{8,}''']
condition = "AND"

[[allowlists]]
description = """
The committed corpus manifest. tests/fixtures/csv/ is generated and gitignored,
so it is seen only by the working-tree scan; corpus.yaml is tracked and
therefore also seen by the full-history scan, carrying the same SYNTH_-prefixed
literals as its declared expectations. Same conjunction, same reasoning: the
path alone silences nothing and the prefix alone silences nothing.
"""
paths = ['''^tests/fixtures/corpus\.yaml$''']
regexTarget = "line"
regexes = ['''SYNTH_[A-Za-z0-9]{8,}''']
condition = "AND"

[[allowlists]]
description = """
build/manifests/ (plan 02-07, CICD-07) — `helm template` output, gitignored,
seen only by the working-tree scan. Path-only, unlike the two allowlists
above, because the directory itself cannot hold a real secret: it is rendered
from committed helm/values/*.yaml files, and D-08/D-14/D-15 already establish
that those files reference every credential by Kubernetes Secret NAME, never
by value — MinIO/CNPG/Airflow credentials are generated at `cluster-up` time
and live only in the cluster. tests/policy/test_workflow_secrets.py polices
helm/, kubernetes/, kind/ and scripts/ for exactly that property, so this
directory's only possible contents are (a) Helm's own `checksum/*-secret`
annotations — sha256 digests of a chart's default (often empty) Secret
content, matched by gitleaks' generic-api-key rule purely because a 64-hex-
character string looks key-shaped — and (b) chart-default placeholder values
neither this repository nor its values files ever supplied. Re-verified by
inspection this session: every one of 42 findings here was one of those two
shapes, none traceable to any committed configuration.
"""
paths = ['''^build/manifests/''']

[[allowlists]]
description = """
Phase 11 planning prose (11-12-PLAN.md) referencing the `ALEMBIC_DSN=...` shell-
recipe naming convention used by `migrate-analytics` and `rebuild-from-raw` — an
environment-variable NAME followed by a literal three-dot placeholder, never a
value. `generic-api-key` fires on the backtick-quoted `NAME=...` shape itself.
Scoped to this one file and this one literal placeholder string, not to
`.planning/` generally: a real value pasted into this file under a different
variable name is still reported.
"""
paths = ['''^\.planning/phases/11-ci-cd-completion-operations/11-12-PLAN\.md$''']
regexTarget = "line"
regexes = ['''ALEMBIC_DSN=\.\.\.''']
condition = "AND"

[[allowlists]]
description = """
Phase 11's deferred-items.md (plan 11-09's live bug writeup) cites a real
DagRun's `idempotency_key` — a SHA-256 hex digest, not a credential — as part
of reproducing a live-diagnosed data-loss bug for a future fix session.
`generic-api-key` fires on the 64-hex-character value next to the word `key`.
Regex requires the exact `idempotency_key=` label AND a 64-lowercase-hex-digit
value, so a real secret assigned to any other name in this file is still
reported.
"""
paths = ['''^\.planning/phases/11-ci-cd-completion-operations/deferred-items\.md$''']
regexTarget = "line"
regexes = ['''idempotency_key=`[0-9a-f]{64}`''']
condition = "AND"

[[allowlists]]
description = """
Three test files whose `key=`/`key_suffix=` values are S3 object-store keys
(filenames like `scenario1_a.csv`) or a plain scenario label
(`reconciliation_scd2`), not API keys — `generic-api-key` fires on the
identifier `key` regardless of what it actually names in this codebase's
domain (object storage). Value charset is restricted to
`[A-Za-z0-9_.]+` (letters, digits, underscore, dot): real secrets typically
carry `-`, `+`, `/` or mixed-case entropy outside that set, and even a
same-charset value must still land on one of these three exact paths under
the literal `key`/`key_suffix` identifier to be silenced.
"""
paths = [
  '''^tests/integration/test_reconciliation\.py$''',
  '''^tests/integration/test_schema_resolution\.py$''',
  '''^tests/unit/test_csv_source_inspect\.py$''',
]
regexTarget = "line"
regexes = ['''key(_suffix)?\s*=\s*"[A-Za-z0-9_.]+"''']
condition = "AND"
