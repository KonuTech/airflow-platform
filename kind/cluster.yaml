# The ENTIRE creation-time-only surface for this platform lives here and
# nowhere else (Pattern 1, 02-RESEARCH.md): node count/roles, node labels,
# host port mappings, host bind mounts, kubeadm config patches, and the
# containerd registry-mirror config below. Every one of these fields is
# accepted only at `kind create cluster` time; changing any of them later
# requires `kind delete cluster` (INFRA-09).
#
# Checkpoint decision (plan 02-01, human-confirmed): kubelet reservations sized
# by the "fair-share" option — NOT the PITFALLS-proposed 500m/1Gi (measured in
# 02-RESEARCH.md Pitfall 2 to remove only 3% of a node's advertised
# allocatable, which would let three nodes collectively lie about having far
# more CPU/memory than the host actually has and hand arbitration to the host
# OOM killer instead of Kubernetes eviction).
#
# Rescaled post-checkpoint (same session, plan 02-01) for actual
# execution-host capacity: STACK.md/RESEARCH assumed a 32-CPU/47-GiB
# workstation: the original fair-share numbers (systemReserved cpu=11/mem=8Gi
# + kubeReserved cpu=10/mem=7Gi = 21 cores/15Gi reserved) made kubelet refuse
# to start outright on this developer's actual laptop (12 CPU / 32 GiB total,
# WSL2 capped to 15.44Gi by default) — "invalid Node Allocatable
# configuration: capacity of 12 but reservation of 21". The user develops
# across two machines (a 12-CPU/32Gi laptop and a 64Gi PC) and confirmed:
# raise the WSL2 memory cap to 24Gi (.wslconfig `[wsl2] memory=24GB`).
#
# [Rule 1 fix, plan 02-02] The FIRST rescale (systemReserved cpu=2/mem=3Gi +
# kubeReserved cpu=2/mem=2Gi, ~8 CPU/~19Gi allocatable per node) fixed the
# boot failure but reintroduced exactly the bug 02-RESEARCH.md Pitfall 2
# exists to prevent: it applied fair-share arithmetic for the WRONG host
# (deriving from "won't boot" pressure, not from `(host / node_count)`). Three
# nodes at ~8 CPU/~19Gi each sum to ~24 CPU/~57Gi advertised allocatable — on
# a host that only has 12 CPU/~23.5Gi (per `status.capacity`, which every kind
# node reports as the FULL host, since containers on one host are not
# statically partitioned). `tests/e2e/cluster/test_node_capacity.py` (plan
# 02-02) asserts exactly this cluster-wide, live-node invariant and would
# fail red against that first rescale. Recomputed correctly this time,
# following the fair-share formula verbatim: allocatable_target ≈ (C/N) −
# headroom = (12/3) − 1 ≈ 3 CPU/node, memory ≈ (23.5Gi/3) − ~1.8Gi ≈ 6Gi/node.
# reserved_total = C − allocatable_target ⇒ systemReserved cpu=5/mem=9Gi +
# kubeReserved cpu=4/mem=8Gi, leaving ~3 CPU/~6Gi allocatable per node — sum
# across 3 nodes ≈ 9 CPU/~18Gi, safely under the host's real 12 CPU/~23.5Gi
# (≈25% headroom on both axes). Still comfortably above kubelet's own
# capacity>=reservation boot requirement (12 ≥ 9). Revisit if profiling later
# phases (Postgres×2 + MinIO + Airflow) shows 3 CPU/6Gi per node too tight —
# the fix then is raising the host floor in docs/wsl/wslconfig.example, not
# quietly reintroducing this over-commit bug.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: airflow-platform
nodes:
  - role: control-plane
    image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
    kubeadmConfigPatches:
      # v1beta3 MAP form — correct for Kubernetes 1.23-1.35 (kind translates
      # map->list automatically were the target ever v1beta4 / 1.36+; the list
      # form some docs show is the v1beta4 shape and is wrong here).
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
      - |
        kind: KubeletConfiguration
        systemReserved:
          cpu: "5"
          memory: "9Gi"
        kubeReserved:
          cpu: "4"
          memory: "8Gi"
        evictionHard:
          memory.available: "500Mi"
          nodefs.available: "10%"
          nodefs.inodesFree: "5%"
        maxPods: 60
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
    extraMounts:
      # D-02: the DAG directory is declared on every node now, wired (mounted
      # into the scheduler/dag-processor pods) in Phase 4. WSL ext4 only —
      # never /mnt/c; the DAG processor's periodic re-stat loop over a 9p
      # mount would be pathological.
      - hostPath: /home/konutec/projects/airflow-platform/airflow/dags
        containerPath: /mnt/dags
        readOnly: true
      # D-01: persistence is declared but deliberately left UNBOUND. The
      # local-path-provisioner's default path is /var/local-path-provisioner
      # (verified via the live `local-path-config` ConfigMap in
      # 02-RESEARCH.md Pattern 2) — mounting at a DIFFERENT container path
      # means this host directory exists at cluster-creation time but nothing
      # reads from it. Adopting persistence later is a values/ConfigMap patch
      # (`local-path-config`'s `paths` key), not a cluster rebuild. Mounting
      # directly at /var/local-path-provisioner would make persistence active
      # immediately, the opposite of D-01's intent.
      - hostPath: /home/konutec/.local/share/airflow-platform/pv
        containerPath: /mnt/persist
  - role: worker
    image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
    kubeadmConfigPatches:
      # [Rule 1 fix, found independently by plans 02-03 and 02-04] Worker
      # nodes join the cluster via `kubeadm join`, never `kubeadm init` —
      # `InitConfiguration` is a no-op for `nodeRegistration.kubeletExtraArgs`
      # on a worker; only the control-plane node consumes it.
      # `JoinConfiguration` is the patch kind actually delivers to a worker's
      # kubeadm-flags.env. Verified against a live cluster booted from the
      # (wrong) InitConfiguration form: `docker exec <worker> cat
      # /var/lib/kubelet/kubeadm-flags.env` showed `--node-labels=` empty on
      # both workers while the control-plane's own `ingress-ready=true`
      # (correctly under InitConfiguration there) was present — D-03's
      # placement silently never took effect since this file was first
      # committed in plan 02-01.
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "airflow-platform/role=storage"
      - |
        kind: KubeletConfiguration
        systemReserved:
          cpu: "5"
          memory: "9Gi"
        kubeReserved:
          cpu: "4"
          memory: "8Gi"
        evictionHard:
          memory.available: "500Mi"
          nodefs.available: "10%"
          nodefs.inodesFree: "5%"
        maxPods: 60
    extraMounts:
      - hostPath: /home/konutec/projects/airflow-platform/airflow/dags
        containerPath: /mnt/dags
        readOnly: true
      - hostPath: /home/konutec/.local/share/airflow-platform/pv
        containerPath: /mnt/persist
  - role: worker
    image: kindest/node:v1.35.5@sha256:ce977ae6d65918d0b58a5f8b5e940429c2ce42fa3a5619ec2bbc60b949c0ac95
    kubeadmConfigPatches:
      # [Rule 1 fix, found independently by plans 02-03 and 02-04] See the
      # sibling worker's comment above — same JoinConfiguration correction,
      # same reason.
      - |
        kind: JoinConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "airflow-platform/role=analytics"
      - |
        kind: KubeletConfiguration
        systemReserved:
          cpu: "5"
          memory: "9Gi"
        kubeReserved:
          cpu: "4"
          memory: "8Gi"
        evictionHard:
          memory.available: "500Mi"
          nodefs.available: "10%"
          nodefs.inodesFree: "5%"
        maxPods: 60
    extraMounts:
      - hostPath: /home/konutec/projects/airflow-platform/airflow/dags
        containerPath: /mnt/dags
        readOnly: true
      - hostPath: /home/konutec/.local/share/airflow-platform/pv
        containerPath: /mnt/persist
containerdConfigPatches:
  # Points every node's containerd at a per-registry hosts.toml directory, so
  # the local registry stage (scripts/stages/10-registry.sh) can write
  # localhost:5001/hosts.toml without any further node-level config (Pattern 5).
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
