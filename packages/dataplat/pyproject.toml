[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataplat"
version = "0.1.0"
description = "Source-agnostic ETL platform core"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PyYAML>=6",
  "psycopg[binary,pool]>=3.3.4,<4",
  "boto3>=1.43.68,<2",
  "pydantic>=2.13,<3",
  "structlog>=26,<27",
  "click>=8.4,<9",
  "hvac>=2.4,<3",
]

# NOTE: no dependency on csv-processor, in either direction of this file.
# The absence here is the packaging half of the guarantee; the import-linter
# contract in setup.cfg is the other half.

[project.scripts]
# The pod entrypoint (plan 03-07): docker/csv-processor/Dockerfile's
# `ENTRYPOINT ["dataplat"]` invokes exactly this console script.
dataplat = "dataplat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dataplat"]
