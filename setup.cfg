# import-linter's native config home. Nothing else lives in this file.
#
# Contract 2 of 01-RESEARCH.md ("nothing may import the DAG folder") is now
# present: this commit adds the first real DAG files
# (airflow/dags/csv_ingest_customers.py, airflow/dags/smoke_kubernetes_pod.py),
# so the deferral 01-01-PLAN.md's Task 1 recorded ("a forbidden contract over
# an empty package proves nothing") is resolved.
[importlinter]
root_packages =
    dataplat
    csv_processor
# Contract 2's `forbidden_modules = dags` names a module that is deliberately
# NOT a root_package (dags is Airflow's DAG folder, not a package this repo
# owns the internals of -- see contract 2's own comment). import-linter
# requires this flag whenever a forbidden contract's target is such an
# "external" (non-root-package) module, or it refuses to check that contract
# at all ("must have include_external_packages=True when there are external
# forbidden modules") -- discovered by running the tool, not documented in
# 01-RESEARCH.md's own verified config.
include_external_packages = True

[importlinter:contract:1]
name = dataplat core must not depend on the CSV plugin
type = forbidden
source_modules =
    dataplat
forbidden_modules =
    csv_processor

[importlinter:contract:2]
name = nothing may import the DAG folder
type = forbidden
source_modules =
    dataplat
    csv_processor
forbidden_modules =
    dags
