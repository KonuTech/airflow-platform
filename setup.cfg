# import-linter's native config home. Nothing else lives in this file.
#
# Contract 2 of 01-RESEARCH.md ("nothing may import the DAG folder") is
# deliberately NOT here. `airflow/dags/` is empty until Phase 4, and a forbidden
# contract over an empty package proves nothing — it would pass for the wrong
# reason and read as coverage it does not have. Phase 4 adds it in the same
# commit as the first DAG.
[importlinter]
root_packages =
    dataplat
    csv_processor

[importlinter:contract:1]
name = dataplat core must not depend on the CSV plugin
type = forbidden
source_modules =
    dataplat
forbidden_modules =
    csv_processor
