[project]
name = "airflow-platform"
version = "0.0.0"
description = "Airflow ETL Platform — workspace root (not a distribution)"
requires-python = ">=3.12,<3.13"
dependencies = []

[tool.uv]
package = false                        # virtual root: never built or installed

[tool.uv.workspace]
# Explicit, never a glob: a future member (e.g. an Airflow DAG package) must not
# be able to join the workspace by accident and drag Airflow's ~600 constraint
# pins into this lockfile. See 01-RESEARCH.md Pitfall 9.
members = ["packages/dataplat", "packages/csv-processor"]

[tool.uv.sources]
dataplat = { workspace = true }
csv-processor = { workspace = true }

[dependency-groups]
# Both workspace members are listed here on purpose. On a virtual workspace root
# a bare `uv sync` installs no member unless something in the root depends on
# one, and ROADMAP success criterion 4 is worded `uv sync && make check`. Listing
# them in the default group makes the bare command sufficient; `make install`
# runs the same bare sync so the two cannot diverge.
dev = [
  "dataplat",
  "csv-processor",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "pytest-xdist>=3.8,<4",
  "hypothesis>=6.165,<7",
  "ruff==0.16.2",                      # pinned exactly: this is a gate
  "mypy==2.3.0",                       # pinned exactly: this is a gate
  "import-linter>=2.13,<3",
  "pre-commit>=4.6,<5",
  "PyYAML>=6",
  "alembic>=1.19.1,<2",                # migrations/ (plan 03-02) — hand-written revisions only
  "sqlalchemy>=2.0.51,<3",             # Alembic's engine only; never for row loading (STACK.md)
  "boto3-stubs[s3]>=1.43,<2",          # mypy stubs for dataplat.storage.objectstore's boto3 use
  # plan 04-07: DAG-authoring/testing only. NEVER installed into the
  # csv-processor runtime image (its Dockerfile passes `--no-dev` to every
  # `uv sync` call, so this group never reaches that image regardless — see
  # docker/csv-processor/Dockerfile) and NEVER a `[tool.uv.workspace]` member
  # (that stays exactly `dataplat`/`csv-processor`, per this file's own
  # comment on why) — so ADR-0004's "two images, two dependency sets" holds:
  # this only makes `airflow` importable inside the shared *dev/test tooling*
  # venv, for `DagBag`-based structural tests (STACK.md "Testing Airflow 3
  # DAGs"), the same venv the `dev` group already builds for ruff/mypy/pytest.
  # Airflow itself is deployed via the pinned upstream Helm chart against the
  # official `apache/airflow:3.3.0-python3.12` image (STACK.md); this repo
  # never builds a custom Airflow image, so no runtime image is affected by
  # this addition either way. Versions match STACK.md's pinned matrix exactly.
  "apache-airflow==3.3.0",
  "apache-airflow-providers-cncf-kubernetes==10.19.0",
  "apache-airflow-providers-amazon",   # S3KeySensor -- unpinned like STACK.md's own
                                        # providers-postgres/-standard entries; the
                                        # resolver picks the version compatible with
                                        # apache-airflow==3.3.0's own constraints.
]
# UPDATED (plan 03-02): this group's original justification — "keeps boto3/
# psycopg out of the environment `make check`'s offline gate builds" — is no
# longer true and has not been since plan 03-01: `packages/dataplat/pyproject.
# toml` lists `psycopg[binary,pool]` and `boto3` as real `[project.
# dependencies]`, and `dev` already installs `dataplat` as a workspace member.
# boto3/psycopg are therefore importable inside `make check`'s own environment
# today, and that is expected, not a regression — the offline claim that
# actually matters is narrower: no `tests/unit/` test may *open a live
# connection*. `make check` stays network/service-free because nothing under
# `tests/unit`, `tests/regression` or `tests/policy` instantiates a real
# boto3 client or psycopg connection; only `tests/integration/` (gated by
# `make test-integration`, D-04) does that.
#
# This group's surviving, real purpose is narrower and different:
# `testcontainers[postgres,minio]` — a Docker-orchestrating dependency `make
# check` must still never need, regardless of whether boto3/psycopg
# themselves are importable — is deliberately NOT in `dev` and NOT in
# `[tool.uv] default-groups` (this repo sets none, so the default set is
# `dev` alone). Every invocation that needs it must name this group
# explicitly with `--group cluster` (never `--only-group`, which would also
# drop pytest out of the resulting environment). `boto3`/`psycopg[binary]`
# stay listed here too (rather than being removed now that `dataplat` also
# depends on them) because `tests/e2e/cluster/` (D-16, plan 02-04) imports
# them directly at its own conftest module level, independent of whichever
# `dataplat` version resolved them — removing them here would couple that
# test tier's install requirement to `dataplat`'s dependency list by
# accident. `make install-cluster` (plan 02-01 Task 2) is the install path;
# `RUN_CLUSTER` is the Makefile invocation path.
cluster = [
  "boto3>=1.43,<2",
  "psycopg[binary]>=3.3,<4",
  "testcontainers[postgres,minio]>=4.15,<5",
  # plan 05-01: scripts/vault-unseal.py, scripts/vault-bootstrap.py, and
  # tests/e2e/vault/conftest.py all import hvac directly at module level,
  # before packages/dataplat/pyproject.toml (plan 05-02) also depends on it
  # — same reasoning as boto3/psycopg above (tests/e2e/*/conftest.py's own
  # import must not couple to whichever dataplat version resolves it later).
  "hvac>=2.4,<3",
  # plan 07-07: tests/e2e/observability/conftest.py's `grafana_api` fixture
  # imports requests directly to call Grafana's own REST API (kubectl
  # port-forward + HTTP basic auth, no SDK exists for this). Already an
  # indirect dependency of hvac (>=2.27.1,<3.0.0) -- pinned explicitly here
  # for the same reason boto3/psycopg/hvac are: a test tier's own direct
  # import must not silently couple to whichever transitive version a
  # DIFFERENT package happens to resolve.
  "requests>=2.32,<3",
  # plan 08.1-08: tests/integration/test_dbt_*.py shell out to a real `dbt
  # build` (subprocess.run) against the same testcontainers PostgreSQL
  # `migrated_dsn` already provides -- same reasoning as boto3/psycopg/hvac
  # above (a test tier's own direct dependency must not couple to whichever
  # version something else happens to resolve later), and same versions
  # `docker/dbt/Dockerfile` pins for the real dbt image, so `dbt build`'s
  # behavior in this dev/test venv matches the deployed image exactly.
  "dbt-core==1.12.2",
  "dbt-postgres==1.11.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["packages/dataplat/src", "packages/csv-processor/src", "tools", "tests", "airflow/dags"]
# Deliberately-broken sample files for the meta-tests (plan 01-05) must never be
# linted: their whole purpose is to fail a gate on demand.
#
# `*.md` is excluded because ruff 0.16 formats Python code blocks inside Markdown.
# README.md is this project's 3,386-line specification and .planning/ holds GSD
# artifacts; neither is source, and a formatter rewriting a spec's illustrative
# snippets would corrupt the document the whole project is measured against.
extend-exclude = ["tests/policy/badsamples", "*.md", ".planning"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "D203", "D213",      # mutually exclusive with D211/D212 — pick one side
  "COM812", "ISC001",  # conflict with `ruff format`
  "ANN401",            # Any in **kwargs is sometimes correct
  "FIX", "TD",         # TODO comments are allowed
  "CPY001",            # fires on EVERY file under select=ALL (01-RESEARCH.md Pitfall 2)
]
# T20 must never appear above. OBS-03 is the print() ban; it is relaxed only by
# path, below, and never globally.

# D417 (undocumented parameter) is already on under `convention = "google"` —
# verified by probe. It is restated here so that changing the convention cannot
# silently drop QUAL-02's parameter half without touching this line.
# Known limit: D417 fires only when an `Args:` section exists and omits a
# parameter. A docstring with no `Args:` section at all is not flagged, so
# "documents every parameter" stays partly a review-time rule.
extend-select = ["D417"]

[tool.ruff.lint.per-file-ignores]
"tests/**"        = ["S101", "PLR2004", "ANN", "D"]   # asserts + magic numbers are fine
"airflow/dags/**" = ["INP001"]                        # DAG folder is not a package
"scripts/**"      = ["T20", "INP001"]                 # OBS-03 carve-out — scripts only
"tools/corpus/__main__.py" = ["T20"]                  # CLI entry point may print
# migrations/ is Alembic's own module-loading mechanism (env.py execs each
# versions/*.py by file path, never `import migrations.versions...`) — never a
# real Python package, same reasoning as airflow/dags/**. Revision filenames
# are Alembic's own `<rev>_<slug>.py` convention (leading digits); ruff's N999
# does not fire on non-package modules, so no separate carve-out is needed for it.
"migrations/**"   = ["INP001"]
# docker/dbt/resolve_secrets.py is a standalone entrypoint script copied
# directly into the dbt image (docker/dbt/Dockerfile), never imported as
# part of any package -- same reasoning as airflow/dags/**/scripts/**/
# migrations/** above.
"docker/dbt/resolve_secrets.py" = ["INP001"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-doc-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_explicit = false          # Decimal / CSV boundaries need some Any
mypy_path = ["packages/dataplat/src", "packages/csv-processor/src"]
exclude = ["tests/policy/badsamples/"]

# `strict = false` in a per-module override is SILENTLY IGNORED by mypy 2.3.0 —
# it is accepted without warning and the module stays fully strict
# (01-RESEARCH.md Pitfall 1). The individual flags must be enumerated.
[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["clevercsv.*", "hvac.*", "chardet.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "slow: generates or reads a large fixture",
  "regression: permanent test for a specific fixed bug (QUAL-07)",
  "cluster: requires a live kind cluster",
  "multi_node: requires the live cluster's real 3-node topology (node count, primary-pod node placement, node-name list, full Deployment set); auto-skipped when the live cluster reports fewer than 3 nodes (CI's single-node profile)",
  "manifests: requires rendered manifests under build/ and the pinned helm and kubeconform binaries; excluded from the offline gate",
  "integration: needs a local Docker daemon (testcontainers PostgreSQL/MinIO); excluded from the offline gate (06-17-PLAN.md)",
  "dagtest: needs a local Docker daemon (testcontainers PostgreSQL for Airflow metadata); excluded from the offline gate",
  "dbt: shells out to a real dbt build against testcontainers PostgreSQL; excluded from the offline gate",
  "chaos: deliberately breaks a live component to prove recovery; excluded from the offline gate and from make cluster-verify, run via a dedicated CI job",
]

[tool.coverage.run]
branch = true
source = ["dataplat", "csv_processor"]

[tool.coverage.report]
show_missing = true
# No fail_under: CICD-05 lands in Phase 11, and a threshold over a tree that is
# mostly configuration is a number people game.
