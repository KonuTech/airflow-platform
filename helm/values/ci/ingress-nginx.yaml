# D-06: the local and CI profiles diverge on EXACTLY three axes — replica
# counts, resource sizing, and monitoring. Any fourth divergence axis needs an
# argument in review. This file and helm/values/local/ingress-nginx.yaml must
# otherwise be identical in shape.
#
# D-12: CI's rendered manifests are summed by
# tests/policy/test_manifest_resources.py against the GitHub-hosted runner's
# 4 CPU / 16 GB budget, so the sizes below are load-bearing, not decorative.
#
# No credential literal of any kind appears in this file.

controller:
  replicaCount: 1

  hostPort:
    enabled: true
    ports:
      http: 80
      https: 443

  service:
    type: ClusterIP

  nodeSelector:
    ingress-ready: "true"

  tolerations:
    - key: node-role.kubernetes.io/control-plane
      operator: Exists
      effect: NoSchedule

  watchIngressWithoutClass: true

  ingressClassResource:
    name: nginx
    enabled: true
    default: true

  # Smaller than local: this profile shares a 4 CPU / 16 GB runner with every
  # other pod the CI job renders.
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

  # Monitoring disabled in CI — the third D-06 axis. kube-prometheus-stack
  # itself is Phase 7 and is never deployed in this phase's CI job anyway;
  # this also keeps the metrics Service off the rendered manifest set.
  metrics:
    enabled: false

  admissionWebhooks:
    createSecretJob:
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          cpu: 50m
          memory: 64Mi
    patchWebhookJob:
      resources:
        requests:
          cpu: 10m
          memory: 20Mi
        limits:
          cpu: 50m
          memory: 64Mi
