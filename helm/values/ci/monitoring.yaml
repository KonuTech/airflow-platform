# D-16: this file and helm/values/local/monitoring.yaml diverge on the
# already-permitted "resource sizing" and "monitoring enablement" axes
# (test_values_profiles.py) -- the CI profile is deliberately smaller
# because it shares a 4 CPU / 16 GB GitHub-hosted runner with every other
# pod the CI job renders. Every other key below is IDENTICAL in shape to
# the local profile -- see helm/values/local/monitoring.yaml's header
# comments for the full argument behind each structural choice.
#
# Quick task 260824-ayw: this chart IS now installed live in CI, but only
# for the staggered tests/e2e/observability window via
# `make observability-verify-ci` (which calls scripts/monitoring-install.sh
# then scripts/monitoring-teardown.sh), not for the whole CI job. `make
# manifests` still separately renders/lints this same file offline as
# before, unrelated to the live install path.

alertmanager:
  enabled: false

grafana:
  envFromSecret: grafana-alert-webhook

  initChownData:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi

  downloadDashboards:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi

  # See helm/values/local/monitoring.yaml's own header comments (DISCOVERED
  # LIVE this session) for the full argument: `sidecar.datasources.enabled`
  # MUST stay at the chart default (true) for additionalDataSources below to
  # load at all -- only `defaultDatasourceEnabled`/`alertmanager.enabled`
  # are disabled, in the single `sidecar:` block below.
  additionalDataSources:
    - name: analytics-postgres
      uid: analytics-postgres
      type: postgres
      access: proxy
      url: analytics-db-rw.data.svc.cluster.local:5432
      user: grafana_reader
      jsonData:
        database: analytics
        sslmode: disable
        postgresVersion: 1800
      secureJsonData:
        password: $GRAFANA_DB_PASSWORD
    - name: prometheus
      uid: prometheus
      type: prometheus
      access: proxy
      url: http://monitoring-kube-prometheus-prometheus.monitoring.svc.cluster.local:9090
    - name: tempo
      uid: tempo
      type: tempo
      access: proxy
      url: http://tempo.monitoring.svc.cluster.local:3200

  persistence:
    enabled: true
    size: 500Mi # smaller than local -- same reasoning as vault.yaml's own ci profile

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  sidecar:
    # `datasources.enabled` deliberately NOT set (chart default: true) --
    # same reasoning as helm/values/local/monitoring.yaml's own header
    # comment. Only the chart's own default Prometheus/Alertmanager entries
    # are suppressed, so exactly the three additionalDataSources above are
    # the ones that load.
    datasources:
      defaultDatasourceEnabled: false
      alertmanager:
        enabled: false
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 50m
        memory: 32Mi

  # Task 2: one dashboard covering all 8 named metrics + the 3 D-03 live
  # gauges. The chart's own `dashboardProviders`/`dashboards` values-key
  # mechanism (a `type: file` provider whose JSON is baked into a
  # `grafana_dashboard`-labelled ConfigMap the chart's own already-enabled
  # dashboards sidecar picks up -- verified via `helm template` this
  # session) -- NOT a hand-authored standalone ConfigMap.
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: platform
          orgId: 1
          folder: 'Platform'
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/platform
  dashboards:
    platform:
      platform-observability:
        json: |
          {
            "id": null,
            "uid": "platform-observability",
            "title": "Platform Observability",
            "tags": [
              "platform",
              "phase-07"
            ],
            "timezone": "utc",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "30s",
            "time": {
              "from": "now-24h",
              "to": "now"
            },
            "panels": [
              {
                "id": 1,
                "type": "stat",
                "title": "files_processed",
                "gridPos": {
                  "x": 0,
                  "y": 0,
                  "w": 6,
                  "h": 6
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT COUNT(*) AS files_processed FROM meta.ingestion_runs WHERE file_id IS NOT NULL AND status = 'SUCCEEDED'"
                  }
                ]
              },
              {
                "id": 2,
                "type": "stat",
                "title": "files_failed",
                "gridPos": {
                  "x": 6,
                  "y": 0,
                  "w": 6,
                  "h": 6
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT COUNT(*) AS files_failed FROM meta.ingestion_runs WHERE file_id IS NOT NULL AND status = 'FAILED'"
                  }
                ]
              },
              {
                "id": 3,
                "type": "stat",
                "title": "rows_processed",
                "gridPos": {
                  "x": 12,
                  "y": 0,
                  "w": 6,
                  "h": 6
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT COALESCE(SUM(rows_loaded), 0) AS rows_processed FROM meta.ingestion_runs"
                  }
                ]
              },
              {
                "id": 4,
                "type": "stat",
                "title": "rows_invalid",
                "gridPos": {
                  "x": 18,
                  "y": 0,
                  "w": 6,
                  "h": 6
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT COALESCE(SUM(rows_invalid), 0) AS rows_invalid FROM meta.ingestion_runs"
                  }
                ]
              },
              {
                "id": 5,
                "type": "stat",
                "title": "rows_deduplicated",
                "gridPos": {
                  "x": 0,
                  "y": 6,
                  "w": 6,
                  "h": 6
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT COALESCE(SUM(rows_deduplicated), 0) AS rows_deduplicated FROM meta.ingestion_runs"
                  }
                ]
              },
              {
                "id": 6,
                "type": "stat",
                "title": "processing_duration",
                "gridPos": {
                  "x": 6,
                  "y": 6,
                  "w": 6,
                  "h": 6
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "ms"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT COALESCE(AVG(duration_ms), 0) AS processing_duration FROM meta.ingestion_runs WHERE duration_ms IS NOT NULL"
                  }
                ]
              },
              {
                "id": 7,
                "type": "stat",
                "title": "validation_failures",
                "gridPos": {
                  "x": 12,
                  "y": 6,
                  "w": 6,
                  "h": 6
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "description": "Same signal as rows_invalid until Phase 8's meta.validation_results exists -- no finer-grained validation-failure table exists yet.",
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT COALESCE(SUM(rows_invalid), 0) AS validation_failures FROM meta.ingestion_runs"
                  }
                ]
              },
              {
                "id": 8,
                "type": "table",
                "title": "data_freshness",
                "gridPos": {
                  "x": 0,
                  "y": 12,
                  "w": 24,
                  "h": 8
                },
                "datasource": {
                  "type": "postgres",
                  "uid": "analytics-postgres"
                },
                "targets": [
                  {
                    "refId": "A",
                    "format": "table",
                    "rawSql": "SELECT d.dataset_id, d.dataset_name, d.expected_frequency, d.freshness_warn_after, d.freshness_fail_after, COALESCE(MAX(f.discovered_at), d.created_at) AS last_received_at, CASE WHEN d.freshness_fail_after IS NOT NULL AND now() - COALESCE(MAX(f.discovered_at), d.created_at) > d.expected_frequency + d.freshness_fail_after THEN 'fail' WHEN now() - COALESCE(MAX(f.discovered_at), d.created_at) > d.expected_frequency + COALESCE(d.freshness_warn_after, interval '0') THEN 'warn' ELSE 'ok' END AS freshness_status FROM meta.datasets d LEFT JOIN meta.files f ON f.dataset_id = d.dataset_id WHERE d.expected_frequency IS NOT NULL GROUP BY d.dataset_id, d.dataset_name, d.expected_frequency, d.freshness_warn_after, d.freshness_fail_after, d.created_at"
                  }
                ]
              },
              {
                "id": 9,
                "type": "stat",
                "title": "In-flight runs (live gauge)",
                "gridPos": {
                  "x": 0,
                  "y": 20,
                  "w": 8,
                  "h": 6
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "targets": [
                  {
                    "refId": "A",
                    "instant": true,
                    "range": false,
                    "expr": "sum(runs_started) - sum(runs_finished)"
                  }
                ]
              },
              {
                "id": 10,
                "type": "stat",
                "title": "Recent failure rate (live gauge)",
                "gridPos": {
                  "x": 8,
                  "y": 20,
                  "w": 8,
                  "h": 6
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "instant": true,
                    "range": false,
                    "expr": "sum(rate(runs_finished{status=\"failed\"}[5m])) / sum(rate(runs_finished[5m]))"
                  }
                ]
              },
              {
                "id": 11,
                "type": "stat",
                "title": "Row-level reject rate (live gauge)",
                "gridPos": {
                  "x": 16,
                  "y": 20,
                  "w": 8,
                  "h": 6
                },
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "fieldConfig": {
                  "defaults": {
                    "unit": "percentunit"
                  },
                  "overrides": []
                },
                "targets": [
                  {
                    "refId": "A",
                    "instant": true,
                    "range": false,
                    "expr": "sum(rate(rows_rejected[5m])) / (sum(rate(rows_rejected[5m])) + sum(rate(rows_kept[5m])))"
                  }
                ]
              }
            ]
          }

  # Task 2: Grafana native unified alerting-as-code (RESEARCH.md Pattern 4 --
  # the `alerting: {}` values key, never the sidecar ConfigMap-watcher).
  # D-07: the ONLY alerting engine this project uses.
  alerting:
    contactpoints.yaml:
      apiVersion: 1
      contactPoints:
        - orgId: 1
          name: platform-webhook
          receivers:
            - uid: platform-webhook-1
              type: webhook
              settings:
                # Single-`$` form only (RESEARCH.md Pitfall 5 -- `${VAR}`
                # double-expands `$`). Resolves from the grafana-alert-webhook
                # Secret's GRAFANA_ALERT_WEBHOOK_URL key (envFromSecret above,
                # plan 07-06's Vault-bootstrapped value) -- never a literal.
                url: $GRAFANA_ALERT_WEBHOOK_URL
    policies.yaml:
      apiVersion: 1
      policies:
        - orgId: 1
          receiver: platform-webhook
    # Byte-identical WARN-tier SQL to tests/integration/test_freshness_query.py's
    # own FRESHNESS_BREACH_QUERY constant (verified this session via a direct
    # Python diff) -- Plan 07-01's own already-tested query, never re-derived.
    rules.yaml:
      apiVersion: 1
      groups:
        - orgId: 1
          name: platform
          folder: Platform
          interval: 5m
          rules:
            - uid: freshness-warn
              title: "Data freshness: WARN threshold breached"
              condition: C
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: analytics-postgres
                  model:
                    refId: A
                    format: table
                    rawSql: |
                      SELECT
                          d.dataset_id,
                          d.dataset_name,
                          d.expected_frequency,
                          d.freshness_warn_after,
                          d.freshness_fail_after,
                          COALESCE(MAX(f.discovered_at), d.created_at)                        AS last_received_at,
                          MAX(r.finished_at) FILTER (WHERE r.status = 'SUCCEEDED')            AS last_success_at,
                          now() - COALESCE(MAX(f.discovered_at), d.created_at)                AS processing_delay
                      FROM meta.datasets d
                      LEFT JOIN meta.files f          ON f.dataset_id = d.dataset_id
                      LEFT JOIN meta.ingestion_runs r ON r.dataset_id = d.dataset_id
                      WHERE d.expected_frequency IS NOT NULL   -- OBS-09: NULL here means "stays quiet", structurally
                      GROUP BY d.dataset_id, d.dataset_name, d.expected_frequency,
                               d.freshness_warn_after, d.freshness_fail_after, d.created_at
                      HAVING now() - COALESCE(MAX(f.discovered_at), d.created_at)
                             > d.expected_frequency + COALESCE(d.freshness_warn_after, interval '0');
                - refId: B
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: reduce
                    expression: A
                    reducer: count
                - refId: C
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [0] }
              noDataState: NoData
              execErrState: Error
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "One or more datasets have exceeded their expected_frequency + freshness_warn_after grace period."
            - uid: freshness-fail
              title: "Data freshness: FAIL threshold breached"
              condition: C
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: analytics-postgres
                  model:
                    refId: A
                    format: table
                    rawSql: |
                      SELECT d.dataset_id, d.dataset_name, d.expected_frequency, d.freshness_warn_after,
                             d.freshness_fail_after
                        FROM meta.datasets d
                        LEFT JOIN meta.files f ON f.dataset_id = d.dataset_id
                        LEFT JOIN meta.ingestion_runs r ON r.dataset_id = d.dataset_id
                       WHERE d.expected_frequency IS NOT NULL AND d.freshness_fail_after IS NOT NULL
                       GROUP BY d.dataset_id, d.dataset_name, d.expected_frequency, d.freshness_warn_after,
                                d.freshness_fail_after, d.created_at
                      HAVING now() - COALESCE(MAX(f.discovered_at), d.created_at)
                             > d.expected_frequency + d.freshness_fail_after;
                - refId: B
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: reduce
                    expression: A
                    reducer: count
                - refId: C
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [0] }
              noDataState: NoData
              execErrState: Error
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "One or more datasets (with a configured freshness_fail_after) have exceeded their FAIL-tier grace period."
            # (3)-(5): one rule per D-03 live gauge, against the `prometheus`
            # datasource -- illustrative thresholds for a synthetic-fixture-scale
            # local platform, documented inline, not a tuned production SLO.
            - uid: gauge-runs-inflight
              title: "Live gauge: too many runs in-flight"
              condition: B
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                    refId: A
                    instant: true
                    range: false
                    # A single-dataset local pipeline should rarely have more than
                    # ~10 concurrent runs; a sustained value above that suggests a
                    # stuck/leaked run never reaching a terminal state.
                    expr: "sum(runs_started) - sum(runs_finished)"
                - refId: B
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: gt, params: [10] }
              noDataState: NoData
              execErrState: Error
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "sum(runs_started) - sum(runs_finished) exceeded 10 for 5m."
            - uid: gauge-failure-rate
              title: "Live gauge: elevated run failure rate"
              condition: B
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                    refId: A
                    instant: true
                    range: false
                    # 0.5 (50%) is a reasonable illustrative default for this
                    # project's own local, synthetic-fixture-scale platform -- not
                    # a tuned production SLO.
                    expr: "sum(rate(runs_finished{status=\"failed\"}[5m])) / sum(rate(runs_finished[5m]))"
                - refId: B
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: gt, params: [0.5] }
              noDataState: NoData
              execErrState: Error
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Recent run failure rate exceeded 50% for 5m."
            - uid: gauge-reject-rate
              title: "Live gauge: elevated row-level reject rate"
              condition: B
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: prometheus
                  model:
                    refId: A
                    instant: true
                    range: false
                    # 0.1 (10%) is a reasonable illustrative default -- not a
                    # tuned production SLO.
                    expr: "sum(rate(rows_rejected[5m])) / (sum(rate(rows_rejected[5m])) + sum(rate(rows_kept[5m])))"
                - refId: B
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: threshold
                    expression: A
                    conditions:
                      - evaluator: { type: gt, params: [0.1] }
              noDataState: NoData
              execErrState: Error
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "Row-level reject rate exceeded 10% for 5m."
            # D-19: the ONE alerting engine this project uses (Phase 7 D-07) --
            # a genuinely stuck run/stage pages through the existing Grafana
            # webhook, no second alerting mechanism. Same A (SQL, analytics-
            # postgres, format: table) -> B (reduce/count) -> C (threshold)
            # shape as freshness-warn/freshness-fail above, since this is also
            # SQL-backed (meta.v_run_recovery, plan 09-06), not the simpler
            # Prometheus-only gauge-* shape above.
            - uid: alert-run-recovery-exhausted
              title: "A run/stage has exhausted retries and needs manual retry"
              condition: C
              data:
                - refId: A
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: analytics-postgres
                  model:
                    refId: A
                    format: table
                    rawSql: |
                      SELECT * FROM meta.v_run_recovery
                       WHERE next_action LIKE 'retry stage%' AND run_status != 'SUCCEEDED';
                - refId: B
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: B
                    type: reduce
                    expression: A
                    reducer: count
                - refId: C
                  relativeTimeRange: { from: 600, to: 0 }
                  datasourceUid: __expr__
                  model:
                    refId: C
                    type: threshold
                    expression: B
                    conditions:
                      - evaluator: { type: gt, params: [0] }
              noDataState: NoData
              execErrState: Error
              # Pitfall 6: a FAILED row does not by itself mean retries are
              # exhausted -- gate on 5m persistence, not raw status.
              for: 5m
              labels:
                severity: warning
              annotations:
                summary: "meta.v_run_recovery reports a stage stuck in retry-needed state for 5m+."

# Quick task 260824-ayw: kube-prometheus-stack's own top-level subchart
# enable/disable toggles (distinct from the per-subchart `kube-state-metrics:`
# / `prometheus-node-exporter:` resources keys these replace -- those become
# dead configuration once the subcharts below are disabled). Verified this
# session that no file under tests/e2e/observability/ references
# kube-state-metrics or node-exporter metrics/targets (only
# analytics-postgres, prometheus, tempo datasources are exercised) --
# disabling both is a free CPU/pod-count saving with zero test-coverage
# loss, now that this stack is genuinely installed live in CI for the
# staggered tests/e2e/observability window (see observability-verify-ci /
# scripts/monitoring-install.sh).
kubeStateMetrics:
  enabled: false

nodeExporter:
  enabled: false

prometheusOperator:
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
        limits:
          cpu: 50m
          memory: 32Mi

prometheus:
  prometheusSpec:
    # D-18: IDENTICAL to local -- retention policy is not a resource-sizing
    # concern (see local profile's own comment on this same key).
    retention: 15d

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 1Gi # smaller than local -- never actually used live, per D-16

    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # `additionalServiceMonitors` lives directly under `prometheus:`, a
  # SIBLING of `prometheusSpec:` above -- see helm/values/local/
  # monitoring.yaml's own header comment on this same key for the full,
  # live-discovered argument. IDENTICAL structural shape to local -- this
  # chart IS now installed live in CI (quick task 260824-ayw), but only for
  # the staggered `tests/e2e/observability` window via `make
  # observability-verify-ci` (see this file's own top-of-file header
  # comment), not for the whole CI job the way the local profile's
  # persistent-cluster install is.
  additionalServiceMonitors:
    - name: otel-collector
      selector:
        matchLabels:
          app.kubernetes.io/name: opentelemetry-collector
      namespaceSelector:
        matchNames: [monitoring]
      endpoints:
        - port: prometheus
          path: /metrics
