# D-06: the local and CI profiles diverge on EXACTLY three axes — replica
# counts, resource sizing, and monitoring. This file and
# helm/values/local/airflow.yaml must otherwise be identical in shape.
#
# FOURTH DIVERGENCE AXIS, ARGUED: the EXECUTOR also differs here —
# LocalExecutor in CI, KubernetesExecutor locally — see
# helm/values/local/airflow.yaml's header comment for the full argument.
# D-08's profile-divergence test (plan 02-08) must allowlist `executor` by
# name, deliberately, rather than by accident.
#
# D-12: CI's rendered manifests are summed by
# tests/policy/test_manifest_resources.py against the GitHub-hosted runner's
# 4 CPU / 16 GB budget, so the sizes below are load-bearing, not decorative.
#
# postgresql.enabled MUST stay false — see helm/values/local/airflow.yaml.
# No credential literal of any kind appears in this file.
#
# DAG-mount wiring and the Airflow-side MinIO connection are identical in
# both profiles because the underlying hostPath and Secret name are
# identical in both — this is infrastructure wiring, not sizing, and belongs
# with the other non-diverging keys (plan 04-02).

# plan 07-04: repointed to the same custom image helm/values/local/
# airflow.yaml now uses -- see that file's header comment for the full
# rationale (stock image verified live to contain zero opentelemetry
# packages). CI does NOT enable config.traces.otel_on (no OTel Collector
# deployed here, D-16) -- this image is referenced for consistency (one
# image to maintain, not two) even though CI's own `manifests` job only
# templates/lints this chart and never actually pulls or runs the image.
airflowVersion: "3.3.0"
defaultAirflowRepository: localhost:5001/airflow
defaultAirflowTag: "9fa4531"

# LocalExecutor in CI — see helm/values/local/airflow.yaml's header comment
# for the argument (image-pull + disk, not CPU, is the binding constraint on
# a 4 CPU / 16 GB runner).
executor: LocalExecutor

postgresql:
  enabled: false

# SEC-05: Airflow's native VaultBackend serves the minio_default connection
# through Vault alone -- not a Kubernetes Secret, not an AIRFLOW_CONN_* env
# var (plan 05-03). `variables_path: null` is load-bearing, not decorative:
# airflow/dags/_common/kpo.py's common_kpo_kwargs() calls
# Variable.get("csv_processor_image") at DAG-PARSE time (inside the
# @dag-decorated function body), and routing Variable lookups through Vault
# would put a network call on the DAG processor's parse-time critical path
# for a value this phase never intends to move. `kubernetes_role: "airflow"`
# and every other key here are verified against the ACTUAL installed
# apache-airflow-providers-hashicorp==4.7.1 `vault_client.py` source (read
# live inside the running scheduler pod, this plan) -- not the docs page,
# which omits `auth_type: kubernetes` entirely. The default
# `kubernetes_jwt_path` (`/var/run/secrets/kubernetes.io/serviceaccount/
# token`) needs no extra volume mount -- every pod already has it.
#
# backend_kwargs is a SINGLE-LINE scalar, deliberately not a multi-line
# folded block (>-): the chart embeds this string directly into the
# airflow.cfg ConfigMap's INI-rendered [secrets] section
# (`backend_kwargs = {{ $value }}`), with no re-indentation of embedded
# newlines. A multi-line YAML block scalar whose continuation lines are
# indented past the block's own base indentation is NOT folded (YAML
# "more-indented lines are literal" rule) -- verified live, this plan,
# `helm template` failing with "did not find expected key" because the
# resulting dedented continuation lines broke the ConfigMap's own YAML
# structure. Same JSON content either way; only the YAML source shape
# differs.
config:
  secrets:
    backend: airflow.providers.hashicorp.secrets.vault.VaultBackend
    backend_kwargs: '{"url": "http://vault.vault.svc.cluster.local:8200", "auth_type": "kubernetes", "kubernetes_role": "airflow", "mount_point": "airflow", "connections_path": "connections", "variables_path": null, "config_path": null, "kv_engine_version": 2}'
  # Debug session ci-pipeline-ingestion-timeout (2026-08-24): raised
  # identically in helm/values/local/airflow.yaml too -- this is behavioral
  # config, not a permitted resource-sizing divergence axis under
  # tests/policy/test_values_profiles.py's D-06 axis table, so it stays
  # non-divergent by that same policy's own rule.
  #
  # scheduler_health_check_threshold (default 30s): the actual mechanism
  # behind the live-observed "Startup probe failed: No alive jobs found."
  # crash-loop -- `airflow jobs check --job-type SchedulerJob --local` (the
  # chart's own probe command) reports the scheduler dead once its DB
  # heartbeat is older than this, independent of and much tighter than
  # scheduler.livenessProbe/startupProbe.timeoutSeconds above (which only
  # bounds how long kubelet waits for the probe COMMAND to execute). Raised
  # 3x so a genuinely CPU-contended-but-alive scheduler is not killed for a
  # heartbeat gap this node's real contention can produce.
  #
  # dag_file_processor_timeout (default 50s, Airflow-3-renamed
  # [dag_processor] section, was [core] in Airflow 2): kills an individual
  # DAG file's own parse subprocess if it runs long -- this project's DAG
  # files import kubernetes.client/hvac, and under real CPU contention a
  # parse can plausibly exceed 50s. Matches the community-documented
  # mitigation for this exact "DAGs appear and disappear" failure class
  # (apache/airflow#44652).
  scheduler:
    scheduler_health_check_threshold: "90"
  dag_processor:
    dag_file_processor_timeout: "120"
  # Debug session ci-pipeline-ingestion-timeout, ROUND 2 (2026-08-24): raised
  # identically in helm/values/local/airflow.yaml too -- same D-06 rule as
  # scheduler/dag_processor above (behavioral config, not a permitted
  # resource-sizing divergence axis).
  #
  # core.parallelism (chart/Airflow default 32, never previously overridden
  # -- confirmed via `airflow config get-value` inside the live scheduler
  # pod): under LocalExecutor specifically, this is not just a scheduling
  # throttle -- LocalExecutor.start() forks exactly `parallelism` worker
  # processes UP FRONT on every scheduler startup ("This creates the maximum
  # number of worker processes (parallelism) at once to minimize gc
  # freeze/unfreeze cycles", read directly from the installed
  # airflow.executors.local_executor source, this round), each one
  # independently importing the full Airflow module tree. This is the exact
  # mechanism documented in the currently-open apache/airflow#56641 ("each
  # worker imports modules independently, ~1GB of total memory allocation
  # across all workers" at the stock default of 32) that this round's live
  # cp-monitor.csv evidence (scheduler OOMKilled 7 times in one
  # cluster-slice-verify run, peak ~910MiB/1Gi) converged on as the leading
  # mechanism. This project's own two production DAGs (csv_ingest_customers.py,
  # csv_ingest_orders.py) cap concurrency far below 32 by construction:
  # integrity_gate.override(max_active_tis_per_dag=3) is the single highest
  # fan-out point in either DAG, stage/dbt_build/publish are each
  # max_active_tis_per_dag=1 GLOBALLY (shared across every concurrent DagRun
  # of that dag_id, backfill or scheduled alike -- confirmed via
  # tests/e2e/slice/test_backfill_2year_sweep.py's own module docstring).
  # Worst realistic simultaneous peak across both DAGs plus slice-verify's
  # own sensor/gate tasks is a low double digit at most, never remotely 32.
  # Trimmed to 16 -- roughly 2x the estimated real peak (generous headroom
  # against a hand-counted estimate, not a live-measured one) while halving
  # the eagerly-forked worker population and its associated per-worker
  # import overhead. This is the PRIMARY fix for ROUND 2: it reduces the
  # SOURCE of the memory pressure (excess pre-forked workers this workload
  # never uses) rather than only tolerating it with a bigger ceiling.
  # Does NOT by itself claim to eliminate apache/airflow#56641's own
  # documented SUSTAINED per-task-churn growth (still open upstream, no
  # released fix) -- paired with a modest scheduler memory headroom increase
  # below for that residual risk.
  core:
    parallelism: "16"

data:
  metadataSecretName: airflow-metadata

fernetKeySecretName: airflow-fernet-key

# See helm/values/local/airflow.yaml — apiSecretKeySecretName is the correct
# Airflow 3+ key, not the deprecated webserverSecretKeySecretName.
apiSecretKeySecretName: airflow-api-secret-key

# kind/cluster.yaml already bind-mounts airflow/dags/ (WSL ext4 host path) to
# /mnt/dags on every node, read-only — this section is what actually wires
# that hostPath into each Airflow component's pods (Pattern 3, 04-RESEARCH.md).
# persistence/gitSync are the chart's OWN two DAG-delivery mechanisms; both
# are explicitly turned off (persistence.enabled already defaults to false in
# chart 1.22.0, confirmed by reading the pulled chart — stated here anyway so
# a future chart upgrade changing that default cannot silently switch DAG
# delivery mechanisms underneath this repository's hostPath convention).
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# Phase 7 (plan 07-04) now enables this in BOTH profiles per D-02 -- see
# helm/values/local/airflow.yaml's matching comment for the full rationale.
# This chart-bundled statsd-exporter Deployment runs here too even though no
# Prometheus scrapes it in CI (D-16: the monitoring stack itself is not
# deployed live in CI, template/lint-only) -- StatsD packets it never
# receives are simply not sent to anything; harmless, and keeps this the
# same non-divergence D-02 establishes for the local profile. `resources` is
# set explicitly for the same BestEffort-QoS reason as local (D-12,
# tests/policy/test_manifest_resources.py), sized smaller to match this
# file's own CI-runner-budget convention.
statsd:
  enabled: true
  resources:
    requests:
      cpu: 20m
      memory: 64Mi
    limits:
      cpu: 100m
      memory: 128Mi

triggerer:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # D-01: the deferred S3KeySensor's poke runs on the triggerer, not the
  # scheduler. SEC-05 (plan 05-03): the triggerer resolves minio_default
  # through the `airflow` Vault role's `airflow-triggerer` binding above
  # (config.secrets.backend) -- live-observed as the identity Airflow's
  # deferred-trigger resume path actually uses; no secretKeyRef env var
  # here anymore, and airflow-minio-connection no longer exists.

ingress:
  apiServer:
    enabled: true
    ingressClassName: nginx
    hosts:
      - name: airflow.localtest.me

# Smaller than local: this profile shares a 4 CPU / 16 GB runner with every
# other pod the CI job renders. See helm/values/local/airflow.yaml for the
# key-set rationale (02-RESEARCH.md Pitfall 5) — unchanged here.
apiServer:
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # Low-cost inclusion per 04-RESEARCH.md Assumption A4: Airflow 3's UI reads
  # serialized DAG structure from the metadata DB, not files directly, so the
  # API server likely does not strictly need this — mounting it anyway costs
  # nothing and removes the ambiguity.
  extraVolumes:
    - name: dags
      hostPath:
        path: /mnt/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true

scheduler:
  resources:
    requests:
      cpu: 400m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1536Mi
  # Debug session ci-pipeline-ingestion-timeout, ROUND 2 (2026-08-24): memory
  # LIMIT raised again, 1Gi->1536Mi (request left at 512Mi -- unaffected by
  # tests/policy/test_manifest_resources.py's CI budget, which sums only
  # `requests`, never `limits`). A live cp-monitor.csv time series across a
  # full cluster-slice-verify run (~62min) showed scheduler restarting 7
  # times with `Reason: OOMKilled`/`Exit Code: 137` -- a genuine cgroup
  # memory-ceiling breach, not the CPU/heartbeat-probe signature fixed
  # earlier this session -- peak recorded sample 954MiB/1Gi (89%, on a 15s
  # poll interval that necessarily undersamples the true pre-kill peak).
  # There is NO larger LOCAL value to match here (unlike the fixes below):
  # LOCAL's own scheduler never OOMs, because KubernetesExecutor never
  # pre-forks LocalExecutor workers in-process at all -- this mechanism is
  # CI-LocalExecutor-specific, so this round's headroom is justified
  # independently (roughly 1.5x the highest recorded sample, not a round
  # local-matching number). PRIMARY fix for this round is `config.core.
  # parallelism` below (32->16, trims the actual eagerly-forked-worker
  # population that apache/airflow#56641 identifies as the growth source) --
  # this limit raise is a SECONDARY safety margin, not the primary fix,
  # because the restart-interval pattern (first cycle 31m52s, every
  # subsequent cycle 5-7min) is more consistent with genuine DB-persisted
  # state accumulation across restarts (a scheduler OOM-kill always starts a
  # genuinely fresh OS process -- container restart, not process reuse -- so
  # pure in-process CoW/allocator retention cannot itself explain a pattern
  # that compounds ACROSS restarts) than with a flat, ceiling-alone-fixable
  # leak. Read directly from the installed airflow.jobs.scheduler_job_runner
  # source this round: `adopt_or_reset_orphaned_tasks()` does run on every
  # scheduler startup (self-heals orphaned TASK INSTANCES), but
  # `_mark_backfills_complete()` only clears a Backfill once none of its
  # DagRuns are RUNNING/QUEUED -- a DagRun whose task keeps getting
  # interrupted mid-execution by a shorter-than-task-runtime OOM cycle never
  # reaches that state, which is why `AlreadyRunningBackfill` was observed
  # cascading for the rest of an affected run (see Evidence). A bigger
  # ceiling alone raises the bar this livelock has to clear but does not by
  # itself remove the livelock; the parallelism trim addresses the
  # oversized-worker-pool root cause instead. See `config.core.parallelism`'s
  # own comment below for the full reasoning, including why `[scheduler]
  # num_runs` (considered, per apache/airflow#1389 and #56641/#58143) was
  # deliberately NOT adopted this round.
  #
  # Debug session ci-pipeline-ingestion-timeout, continuation session 2, ROUND
  # 2 (2026-08-24): memory raised 256Mi/512Mi->512Mi/1Gi -- a THIRD, newly-
  # exposed bottleneck, found via the SAME live-verify round that confirmed
  # dagProcessor's own memory fix (below) worked perfectly (dag-processor:
  # Restart Count 0 across the whole ~15min run, direct `kubectl describe
  # pod` confirmation). That same describe-pod output showed
  # airflow-scheduler-0 with Last State: Terminated / Reason: OOMKilled /
  # Exit Code: 137, Restart Count: 2 -- scheduler's own memory was NEVER
  # touched by any fix this session (only its CPU was raised, round 1).
  # Mechanism: with dag-processor no longer crash-looping, DAGs now actually
  # register and DagRuns actually trigger -- exposing, for the first time,
  # the scheduler's REAL in-process LocalExecutor task-execution memory
  # footprint (unlike CPU contention, this was invisible before because no
  # task had ever gotten far enough to actually run). Matches local's
  # already-proven-stable scheduler sizing exactly (512Mi/1Gi -- identical
  # pattern to local's dagProcessor sizing above), the same "match the one
  # proven-stable reference point" fix rationale already used for
  # dagProcessor. NOT yet live-verified -- requires one more live-CI round.
  #
  # Post-merge fix (CICD-09 follow-up): live-diagnosed this session against a
  # genuinely fresh single-node CI cluster under real contention --
  # scheduler-0's own startup/liveness probe (`airflow jobs check
  # --job-type SchedulerJob --local`) was timing out at the chart's default
  # 20s ceiling purely because the probe SUBPROCESS itself couldn't spawn/
  # execute fast enough under CPU contention, not because the scheduler was
  # actually unhealthy -- this produced a CrashLoopBackOff that starved every
  # queued task of a live scheduler to dispatch it. Raised well past the
  # 4 CPU/16GB runner's worst observed contention; a genuinely hung
  # scheduler still gets caught by failureThreshold, just with more slack
  # per attempt.
  #
  # Debug session ci-pipeline-ingestion-timeout (2026-08-24): the
  # timeoutSeconds:60 raise above did NOT fully solve this -- live-captured
  # (via e2e-smoke.yml's own DEBUG diagnostic step, run 32675592471, which
  # already included this exact probe-timeout fix) airflow-scheduler-0 still
  # restarting with event "Startup probe failed: No alive jobs found.",
  # which is `airflow jobs check`'s OWN message for a stale SchedulerJob DB
  # heartbeat (governed by `[scheduler] scheduler_health_check_threshold`,
  # default 30s, set below in `config:` -- a DIFFERENT mechanism than this
  # `timeoutSeconds`, which only bounds how long kubelet waits for the probe
  # COMMAND to execute, not whether the heartbeat itself is fresh). The node
  # was also observed at 82% of its ~3000m real allocatable CPU committed to
  # steady-state REQUESTS alone (kind/cluster-ci.yaml's own reservation
  # math), before any ETL task pod exists -- CPU requests/limits raised here
  # so this pod (which under LocalExecutor runs ALL task-instance code
  # in-process, unlike KubernetesExecutor's dispatch-only scheduler) has
  # real headroom to keep heartbeating under contention, not just more
  # patience for a probe command that was never the actual bottleneck.
  livenessProbe:
    timeoutSeconds: 60
  startupProbe:
    timeoutSeconds: 60
  logGroomerSidecar:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # The scheduler decides task readiness from serialized DAG state, but under
  # KubernetesExecutor it is also the process that parses DAG files to build
  # that state in the first place — needs the same hostPath mount as the
  # DAG processor.
  extraVolumes:
    - name: dags
      hostPath:
        path: /mnt/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true
  # D-01: resolve_config/discover_files run here (LocalExecutor task code is
  # in-process in CI, and the scheduler process itself needs the connection
  # available regardless of executor for consistency). SEC-05 (plan 05-03):
  # resolved through Vault's `airflow-scheduler` role binding above -- this
  # IS the profile where the scheduler executes task code directly (D-01),
  # so this binding is architecturally load-bearing here, not incidental.
  # No secretKeyRef env var here anymore.

dagProcessor:
  resources:
    requests:
      cpu: 300m
      memory: 512Mi
    limits:
      cpu: 1200m
      memory: 1Gi
  # Same live-diagnosed contention race as scheduler.livenessProbe above --
  # dag-processor's own liveness check timed out at the chart's 20s default.
  #
  # Debug session ci-pipeline-ingestion-timeout (2026-08-24): same
  # incomplete-fix finding as scheduler above -- live-captured 5 restarts on
  # this pod in under 9 minutes even with timeoutSeconds:60 already applied
  # (run 32675592471). CPU raised for the same real-headroom reason
  # (parsing DAG files with heavy imports -- kubernetes.client, hvac -- under
  # genuine node contention), paired with `[dag_processor]
  # dag_file_processor_timeout` raised below in `config:` (default 50s,
  # governs how long a single DAG file's own parse subprocess may run before
  # being killed as hung -- independent of this timeoutSeconds, which only
  # bounds the K8s probe command itself).
  #
  # Debug session ci-pipeline-ingestion-timeout, continuation session 2
  # (2026-08-24): the CPU+threshold fix above measurably helped scheduler but
  # had ZERO effect on dag-processor's own restart cadence (still 5 restarts
  # in ~9min, live-verified via throwaway PR #13, job 97405917287) -- because
  # dag-processor's actual bottleneck is a DIFFERENT resource this fix never
  # touched: MEMORY. Its --previous container log shows an abrupt, silent
  # death ~5-15s into container life (right after dispatching 2 forked parser
  # subprocesses for the 11-file DAG bundle) -- too fast to be the
  # livenessProbe (initialDelaySeconds:10/failureThreshold:5/periodSeconds:60
  # requires >=250s of consecutive failure), consistent instead with an OOM
  # kill. Live cgroup measurement on the LOCAL cluster (same image, same DAG
  # files, cold-started to mirror this exact scenario) showed a real parse-
  # cycle memory burst reaching >=372MiB against the OLD 512Mi limit here --
  # only ~140MiB of margin. Raised to match LOCAL's already-proven-stable
  # dagProcessor sizing (512Mi request / 1Gi limit, 19+ hours with zero OOM
  # kills on the identical codebase) rather than an arbitrary new number --
  # the smallest change with real precedent. Memory has enormous slack under
  # this project's own EFFECTIVE_CI_MEMORY_BUDGET=13107Mi policy gate
  # (baseline measured total was 5176Mi requests before this change), unlike
  # CPU which is already tight -- so this fix does not touch CPU further,
  # since raising CPU alone already proved to have no effect on this
  # component's restart rate.
  livenessProbe:
    timeoutSeconds: 60
  logGroomerSidecar:
    resources:
      requests:
        cpu: 20m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  # The component that actually parses+serializes DAG files — the mount that
  # matters most for `airflow dags list` to ever see csv_ingest_customers.
  extraVolumes:
    - name: dags
      hostPath:
        path: /mnt/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true

migrateDatabaseJob:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

createUserJob:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

workers:
  kubernetes:
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    # This is the key that determines the serviceAccountName: airflow-worker
    # pod template's volumes (confirmed by reading the live airflow-config
    # ConfigMap's rendered pod_template_file.yaml) — the one KubernetesExecutor
    # task-instance pod that MUST import the DAG's Python module to locate the
    # task's callable, so it matters most of the four extraVolumes insertion
    # points in this file.
    extraVolumes:
      - name: dags
        hostPath:
          path: /mnt/dags
          type: Directory
    extraVolumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags
        readOnly: true
    # Task-instance pods need the MinIO connection too -- confirmed live,
    # not just "for consistency": S3KeySensor.execute() (deferrable=True)
    # calls self.poke() synchronously BEFORE ever deferring
    # (apache-airflow-providers-amazon source, read live this plan), so the
    # KubernetesExecutor task-instance pod (ServiceAccount airflow-worker)
    # resolves minio_default itself on every run's first poke. SEC-05
    # (plan 05-03): resolved through Vault's `airflow-worker` role binding
    # above -- no secretKeyRef env var here anymore.
