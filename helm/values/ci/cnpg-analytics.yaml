# D-06: the local and CI profiles diverge on EXACTLY three axes — replica
# counts, resource sizing, and monitoring. Any fourth divergence axis needs an
# argument in review. This file and helm/values/local/cnpg-analytics.yaml
# must otherwise be identical in shape.
#
# Namespace `data` — same as cnpg-airflow.yaml (D-13).
#
# D-12: CI's rendered manifests are summed by
# tests/policy/test_manifest_resources.py against the GitHub-hosted runner's
# 4 CPU / 16 GB budget, so the sizes below are load-bearing, not decorative.
#
# No credential literal of any kind appears in this file.

type: postgresql
mode: standalone
fullnameOverride: analytics-db

version:
  postgresql: "18"

cluster:
  instances: 1
  enablePDB: false

  storage:
    size: 5Gi

  # Smaller than local: this profile shares a 4 CPU / 16 GB runner with every
  # other pod the CI job renders, including the metadata cluster and MinIO.
  # CPU request 200m->100m (debug/ci-pipeline-ingestion-timeout ROUND 10,
  # root cause 14): steady-state platform requests totalled 2780m of the
  # node's 3000m allocatable, leaving ~220m free -- below even a 200m-request
  # stage pod. This instance idles at a tiny fraction of 100m between e2e
  # bursts; the untouched 1-CPU limit still covers real load. Part of the
  # ~200m trim (with minio/vault) that lets stage+discover co-schedule.
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

  # No affinity.nodeSelector here (unlike helm/values/local/cnpg-analytics.yaml's
  # `airflow-platform/role: analytics`): kind/cluster-ci.yaml is genuinely
  # single-node (post-merge fix, deferred-items.md "Plan 11-04" CRITICAL
  # finding) — every pod lands on the only node regardless, so a
  # nodeSelector against a role label that node was never given would leave
  # this Cluster's instance permanently Pending instead of merely being
  # redundant.

  postgresql:
    # See helm/values/local/cnpg-analytics.yaml — NOT optional, prevents
    # `spec.postgresql: null` (02-RESEARCH.md Pitfall 3).
    parameters:
      max_wal_size: "2GB"
      work_mem: "32MB"

  initdb:
    database: analytics
    owner: analytics_owner
    postInitApplicationSQL:
      - CREATE ROLE etl_app LOGIN;

  # Monitoring disabled in CI — the third D-06 axis.
  monitoring:
    enabled: false

backups:
  enabled: false
