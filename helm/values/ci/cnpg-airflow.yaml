# D-06: the local and CI profiles diverge on EXACTLY three axes — replica
# counts, resource sizing, and monitoring. Any fourth divergence axis needs an
# argument in review. This file and helm/values/local/cnpg-airflow.yaml must
# otherwise be identical in shape.
#
# D-13 CORRECTION: this Cluster CR lives in namespace `data`, not `airflow` —
# see helm/values/local/cnpg-airflow.yaml for the full explanation.
#
# D-12: CI's rendered manifests are summed by
# tests/policy/test_manifest_resources.py against the GitHub-hosted runner's
# 4 CPU / 16 GB budget, so the sizes below are load-bearing, not decorative.
#
# No credential literal of any kind appears in this file.

type: postgresql
mode: standalone
fullnameOverride: airflow-db

version:
  postgresql: "17"

cluster:
  instances: 1
  enablePDB: false

  storage:
    size: 5Gi

  # Smaller than local: this profile shares a 4 CPU / 16 GB runner with every
  # other pod the CI job renders, including the analytical cluster and MinIO.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

  # No affinity.nodeSelector here (unlike helm/values/local/cnpg-airflow.yaml's
  # `airflow-platform/role: storage`): kind/cluster-ci.yaml is genuinely
  # single-node (post-merge fix, deferred-items.md "Plan 11-04" CRITICAL
  # finding) — every pod lands on the only node regardless, so a
  # nodeSelector against a role label that node was never given would leave
  # this Cluster's instance permanently Pending instead of merely being
  # redundant.

  postgresql:
    # See helm/values/local/cnpg-airflow.yaml — NOT optional, prevents
    # `spec.postgresql: null` (02-RESEARCH.md Pitfall 3).
    parameters:
      max_connections: "100"

  initdb:
    database: airflow
    owner: airflow_owner

  # Monitoring disabled in CI — the third D-06 axis.
  monitoring:
    enabled: false

backups:
  enabled: false
