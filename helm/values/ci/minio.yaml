# D-06: the local and CI profiles diverge on EXACTLY three axes — replica
# counts, resource sizing, and monitoring. This file and
# helm/values/local/minio.yaml must otherwise be identical in shape. MinIO's
# `metrics.serviceMonitor.enabled` chart default is already `false` (no
# kube-prometheus-stack exists until Phase 7), so the monitoring axis needs no
# override in either profile here.
#
# D-12: CI's rendered manifests are summed by the manifest-resources policy
# test against the GitHub-hosted runner's 4 CPU / 16 GB budget, so the sizes
# below are load-bearing, not decorative.
#
# INFRA-05 / D-08 / D-14: five buckets (`raw` versioned, the rest not), a
# single IAM policy allowing the pipeline's reads/writes on its working
# buckets while denying it any delete against `raw`, and every credential
# referenced by Secret NAME only. No credential literal of any kind appears
# in this file. D-08's WORM-vs-IAM question was revisited in Phase 11:
# ADR-0011 confirms the `objectlocking: false` / IAM-deny-delete shape below
# as the resolution, not object-lock/WORM -- see
# helm/values/local/minio.yaml's fuller comment on this same rationale.

mode: standalone
replicas: 1

image:
  repository: pgsty/minio
  # Must match MINIO_IMAGE_TAG in helm/versions.env.
  tag: "RELEASE.2026-08-04T00-00-00Z"

existingSecret: minio-root

# No nodeSelector here (unlike helm/values/local/minio.yaml's
# `airflow-platform/role: storage`): kind/cluster-ci.yaml is genuinely
# single-node (post-merge fix, deferred-items.md "Plan 11-04" CRITICAL
# finding) — every pod lands on the only node regardless, so a nodeSelector
# against a role label that node was never given would leave this Deployment
# permanently Pending instead of merely being redundant.

# Smaller than local: this profile shares a 4 CPU / 16 GB runner with every
# other pod the CI job renders.
# CPU request 100m->50m (debug/ci-pipeline-ingestion-timeout ROUND 10, root
# cause 14): part of the ~200m idle-platform-request trim (with
# analytics-db/vault) freeing headroom so stage/publish pods can schedule at
# all on the single CI node; MinIO idles well under 50m between e2e bursts
# and the untouched 500m limit still covers real I/O load.
resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

buckets:
  - name: raw
    policy: none
    purge: false
    versioning: true
    objectlocking: false
  - name: validated
    policy: none
    purge: false
    versioning: false
    objectlocking: false
  - name: processed
    policy: none
    purge: false
    versioning: false
    objectlocking: false
  - name: quarantine
    policy: none
    purge: false
    versioning: false
    objectlocking: false
  - name: metadata
    policy: none
    purge: false
    versioning: false
    objectlocking: false

policies:
  - name: etl-app
    statements:
      - effect: Allow
        resources: ["arn:aws:s3:::raw", "arn:aws:s3:::validated"]
        actions: ["s3:ListBucket"]
      # metadata/*: discover_files PutObjects AssignmentDocuments here,
      # csv_processor.cli.ingest GetObjects them back (plan 04-03/04-05) —
      # see helm/values/local/minio.yaml's fuller comment on this same line.
      - effect: Allow
        resources: ["arn:aws:s3:::raw/*", "arn:aws:s3:::validated/*", "arn:aws:s3:::metadata/*"]
        actions: ["s3:GetObject", "s3:PutObject"]
      - effect: Deny
        resources: ["arn:aws:s3:::raw/*"]
        actions: ["s3:DeleteObject", "s3:DeleteObjectVersion"]

users:
  - accessKey: etl-app
    existingSecret: minio-app
    existingSecretKey: secretKey
    policy: etl-app

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
  hosts:
    - minio.localtest.me

makeBucketJob:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi

makePolicyJob:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi

makeUserJob:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
    limits:
      cpu: 50m
      memory: 128Mi
