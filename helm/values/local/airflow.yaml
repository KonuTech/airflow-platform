# D-06: the local and CI profiles diverge on EXACTLY three axes — replica
# counts, resource sizing, and monitoring. This file and
# helm/values/ci/airflow.yaml must otherwise be identical in shape.
#
# FOURTH DIVERGENCE AXIS, ARGUED (not smuggled): the EXECUTOR also differs
# between the two profiles, and D-06 requires any additional axis to carry an
# argument. Local uses KubernetesExecutor: one worker pod per task plus the
# task's own KPO pod, zero idle cost, full isolation, and it exercises the
# exact RBAC a production Kubernetes Airflow needs. CI uses LocalExecutor: on
# a 4 CPU / 16 GB GitHub-hosted runner the binding constraint is image pull
# and disk, not CPU — two pods per task each pulling a multi-gigabyte image
# does not fit. Plan 02-08's profile-divergence test must allowlist `executor`
# by name, deliberately, rather than by accident. Every OTHER difference
# between these two files stays inside replica counts, resource sizing and
# monitoring.
#
# Chart declares appVersion 3.2.2; airflowVersion/defaultAirflowTag below
# override it to 3.3.0 — verified end to end in 02-RESEARCH.md (migration job
# completed, all four workloads Ready, `airflow version` reported 3.3.0
# inside the running api-server).
#
# postgresql.enabled MUST stay false: the chart's bundled subchart points at
# a bitnamilegacy image that receives no updates and would create a second
# metadata database, violating §4. The real metadata cluster is
# helm/values/local/cnpg-airflow.yaml (plan 02-03), joined here only through
# the three named Secrets below.
#
# No credential literal of any kind appears in this file. All three Secrets
# (data.metadataSecretName, fernetKeySecretName, apiSecretKeySecretName) are
# derived/generated by scripts/airflow-metadata-secret.sh (Task 1) — the
# chart references them by NAME only.
#
# DAG-mount wiring and the Airflow-side MinIO connection are identical in
# both profiles because the underlying hostPath and Secret name are
# identical in both — this is infrastructure wiring, not sizing, and belongs
# with the other non-diverging keys (plan 04-02).

# plan 07-04: repointed from the stock apache/airflow image to the locally-
# built, locally-pushed image docker/airflow/Dockerfile produces (`make
# image-airflow`) -- the stock image was verified live (07-RESEARCH.md) to
# contain zero opentelemetry packages, so `config.traces.otel_on` below would
# otherwise either raise ModuleNotFoundError or silently emit zero traces.
# `defaultAirflowTag` is the git SHA of the commit that introduced
# docker/airflow/Dockerfile (plan 07-04 Task 1) -- kept in agreement with
# helm/versions.env's AIRFLOW_IMAGE_TAG and helm/values/ci/airflow.yaml's own
# defaultAirflowTag by tests/policy/test_supply_chain_guards.py's
# test_every_image_tag_agrees_with_versions_env. `airflowVersion` stays
# "3.3.0" unchanged: it is still real apache-airflow==3.3.0 underneath, only
# with the [otel] extra layered on top -- this key gates the chart's own
# apiSecretKeySecretName-vs-webserverSecretKeySecretName template branch
# (see the comment on that key below), not which image is pulled.
airflowVersion: "3.3.0"
defaultAirflowRepository: localhost:5001/airflow
defaultAirflowTag: "8b01cc1"

# KubernetesExecutor locally — see the header comment for the argument.
executor: KubernetesExecutor

postgresql:
  enabled: false

# SEC-05: Airflow's native VaultBackend serves the minio_default connection
# through Vault alone -- not a Kubernetes Secret, not an AIRFLOW_CONN_* env
# var (plan 05-03). `variables_path: null` is load-bearing, not decorative:
# airflow/dags/_common/kpo.py's common_kpo_kwargs() calls
# Variable.get("csv_processor_image") at DAG-PARSE time (inside the
# @dag-decorated function body), and routing Variable lookups through Vault
# would put a network call on the DAG processor's parse-time critical path
# for a value this phase never intends to move. `kubernetes_role: "airflow"`
# and every other key here are verified against the ACTUAL installed
# apache-airflow-providers-hashicorp==4.7.1 `vault_client.py` source (read
# live inside the running scheduler pod, this plan) -- not the docs page,
# which omits `auth_type: kubernetes` entirely. The default
# `kubernetes_jwt_path` (`/var/run/secrets/kubernetes.io/serviceaccount/
# token`) needs no extra volume mount -- every pod already has it.
#
# backend_kwargs is a SINGLE-LINE scalar, deliberately not a multi-line
# folded block (>-): the chart embeds this string directly into the
# airflow.cfg ConfigMap's INI-rendered [secrets] section
# (`backend_kwargs = {{ $value }}`), with no re-indentation of embedded
# newlines. A multi-line YAML block scalar whose continuation lines are
# indented past the block's own base indentation is NOT folded (YAML
# "more-indented lines are literal" rule) -- verified live, this plan,
# `helm template` failing with "did not find expected key" because the
# resulting dedented continuation lines broke the ConfigMap's own YAML
# structure. Same JSON content either way; only the YAML source shape
# differs.
config:
  secrets:
    backend: airflow.providers.hashicorp.secrets.vault.VaultBackend
    backend_kwargs: '{"url": "http://vault.vault.svc.cluster.local:8200", "auth_type": "kubernetes", "kubernetes_role": "airflow", "mount_point": "airflow", "connections_path": "connections", "variables_path": null, "config_path": null, "kv_engine_version": 2}'
  # OBS-10, local profile ONLY: CI has no OTel Collector deployed (D-16), so
  # tracing stays off there -- this whole `traces:` block, and the
  # OTEL_EXPORTER_OTLP_ENDPOINT env var below, are a legitimate local/ci
  # divergence under the already-permitted "monitoring enablement" axis, not
  # a fourth undocumented one. `otel_application` names this specific service
  # in every exported span's resource attributes (CLAUDE.md §H's own
  # `[traces] otel_on = True`, `otel_application = airflow` example) -- so
  # Tempo/Grafana can distinguish Airflow's own spans from `dataplat`'s.
  traces:
    otel_on: "True"
    otel_application: "airflow"

# OBS-10, local profile ONLY (see the `traces:` comment above for why this
# does not also appear in helm/values/ci/airflow.yaml): the chart's top-level
# `env` key merges into every Airflow component's pod spec, including the
# workers.kubernetes pod template KubernetesExecutor launches per task
# instance -- the one process that actually creates the "Airflow-managed
# task span" TracingKubernetesPodOperator.build_pod_request_obj() (plan
# 07-04 Task 3) reads via opentelemetry.propagate.inject(). Deliberately the
# standard OTEL_EXPORTER_OTLP_* env var, not the deprecated otel_host/
# otel_port config keys (CLAUDE.md §H). Endpoint verified live in
# 07-03-SUMMARY.md's own Key Decisions: the standalone OTel Collector chart's
# real Service DNS is `otel-collector-opentelemetry-collector` (the chart's
# `<release-name>-<chart-name>` fullname convention), NOT the shorter
# `otel-collector` name this key's own placeholder text in 07-04-PLAN.md
# guessed -- do not guess without checking, per that plan's own instruction.
env:
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://otel-collector-opentelemetry-collector.monitoring.svc.cluster.local:4318"

data:
  # scripts/airflow-metadata-secret.sh (Task 1) derives this Secret's sole
  # key, `connection`, from the CNPG-generated `airflow-db-app` Secret in
  # namespace `data` (D-13's cross-namespace correction) — never a literal
  # connection string here.
  metadataSecretName: airflow-metadata

# fernet-key: generated once by scripts/airflow-metadata-secret.sh and left
# alone on every later `ensure` — an unmanaged key regenerates on every
# `helm upgrade` and orphans everything previously encrypted with the old
# value (02-RESEARCH.md PITFALLS B8).
fernetKeySecretName: airflow-fernet-key

# api-secret-key: the Airflow 3+ contract. `apiSecretKeySecretName` is what
# the pinned chart's own templates/_helpers.yaml actually consumes for
# `airflowVersion >= 3.0.0` (`AIRFLOW__API__SECRET_KEY`, key `api-secret-key`)
# — the older `webserverSecretKeySecretName` only takes effect below chart
# semver 3.0.0 and would be silently inert here. Read from the pinned chart's
# helpers, not from documentation, per this plan's own read_first instruction.
apiSecretKeySecretName: airflow-api-secret-key

# kind/cluster.yaml already bind-mounts airflow/dags/ (WSL ext4 host path) to
# /mnt/dags on every node, read-only — this section is what actually wires
# that hostPath into each Airflow component's pods (Pattern 3, 04-RESEARCH.md).
# persistence/gitSync are the chart's OWN two DAG-delivery mechanisms; both
# are explicitly turned off (persistence.enabled already defaults to false in
# chart 1.22.0, confirmed by reading the pulled chart — stated here anyway so
# a future chart upgrade changing that default cannot silently switch DAG
# delivery mechanisms underneath this repository's hostPath convention).
dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

# Phase 7 (plan 07-04) now enables this, in BOTH profiles, per D-02: Airflow's
# OWN internal metrics (scheduler heartbeat, DAG parse time, etc.) stay on
# StatsD -> statsd-exporter -> Prometheus, never OTel -- two independent
# pipelines converge on the same Prometheus rather than one unified OTel
# pipeline (mature path, existing community Grafana dashboards). Only TRACING
# uses OTel here (config.traces above, local profile only, per D-16) --
# `otelCollector.metricsEnabled` must stay false/unset everywhere, the
# chart's own StatsD-XOR-OTel mutual exclusion (.claude/CLAUDE.md §H). This
# stays the third D-06 axis (monitoring), now enabled rather than disabled.
# `resources` is set explicitly (02-RESEARCH.md Pitfall 5 / D-12,
# tests/policy/test_manifest_resources.py's `test_every_container_is_sized`):
# the chart deploys statsd-exporter as its own Deployment when enabled, and
# an unsized container is QoS BestEffort, evicted first.
statsd:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

triggerer:
  enabled: true
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # D-01: the deferred S3KeySensor's poke runs on the triggerer, not the
  # scheduler. SEC-05 (plan 05-03): the triggerer resolves minio_default
  # through the `airflow` Vault role's `airflow-triggerer` binding above
  # (config.secrets.backend) -- live-observed as the identity Airflow's
  # deferred-trigger resume path actually uses; no secretKeyRef env var
  # here anymore, and airflow-minio-connection no longer exists.

# ADR-0006 also names ingress-nginx (archived read-only 2026-03-24; chart
# 4.15.1 / controller 1.15.1 is the final release). No nginx-specific
# annotation is used anywhere in this repository, so a future migration off
# the archived controller is an ingressClassName change, not a rewrite.
ingress:
  apiServer:
    enabled: true
    ingressClassName: nginx
    hosts:
      - name: airflow.localtest.me

# 02-RESEARCH.md Pitfall 5: every one of the chart's 30 `resources` keys
# defaults to `{}` — an unrequested/unlimited container is QoS BestEffort and
# is evicted first, exactly when its data is needed to explain the incident.
# This is the enumerated minimum key set for KubernetesExecutor with
# statsd/celery/flower/pgbouncer/redis off. The `wait-for-airflow-migrations`
# initContainer has NO key of its own — it inherits its parent component's
# (scheduler-deployment.yaml:152 reads `.Values.scheduler.resources`
# verbatim), so setting the component key covers both; do not go looking for
# a separate initContainer key.
apiServer:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # Low-cost inclusion per 04-RESEARCH.md Assumption A4: Airflow 3's UI reads
  # serialized DAG structure from the metadata DB, not files directly, so the
  # API server likely does not strictly need this — mounting it anyway costs
  # nothing and removes the ambiguity.
  extraVolumes:
    - name: dags
      hostPath:
        path: /mnt/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true

scheduler:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # The scheduler decides task readiness from serialized DAG state, but under
  # KubernetesExecutor it is also the process that parses DAG files to build
  # that state in the first place — needs the same hostPath mount as the
  # DAG processor.
  extraVolumes:
    - name: dags
      hostPath:
        path: /mnt/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true
  # D-01: resolve_config/discover_files run here (LocalExecutor task code is
  # in-process in CI, and the scheduler process itself needs the connection
  # available regardless of executor for consistency). SEC-05 (plan 05-03):
  # resolved through Vault's `airflow-scheduler` role binding above -- not
  # live-exercised under this profile's KubernetesExecutor (the scheduler
  # never runs task code here), but required for CI's LocalExecutor profile,
  # which does. No secretKeyRef env var here anymore.

dagProcessor:
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  logGroomerSidecar:
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
  # The component that actually parses+serializes DAG files — the mount that
  # matters most for `airflow dags list` to ever see csv_ingest_customers.
  extraVolumes:
    - name: dags
      hostPath:
        path: /mnt/dags
        type: Directory
  extraVolumeMounts:
    - name: dags
      mountPath: /opt/airflow/dags
      readOnly: true

migrateDatabaseJob:
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

createUserJob:
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

workers:
  kubernetes:
    # Per-task-pod sizing for KubernetesExecutor — Phase 4's DAGs are the
    # first thing to actually schedule one of these; sized here so a future
    # plan does not discover a BestEffort task pod as its first surprise.
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1Gi
    # This is the key that determines the serviceAccountName: airflow-worker
    # pod template's volumes (confirmed by reading the live airflow-config
    # ConfigMap's rendered pod_template_file.yaml) — the one KubernetesExecutor
    # task-instance pod that MUST import the DAG's Python module to locate the
    # task's callable, so it matters most of the four extraVolumes insertion
    # points in this file.
    extraVolumes:
      - name: dags
        hostPath:
          path: /mnt/dags
          type: Directory
    extraVolumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags
        readOnly: true
    # Task-instance pods need the MinIO connection too -- confirmed live,
    # not just "for consistency": S3KeySensor.execute() (deferrable=True)
    # calls self.poke() synchronously BEFORE ever deferring
    # (apache-airflow-providers-amazon source, read live this plan), so the
    # KubernetesExecutor task-instance pod (ServiceAccount airflow-worker)
    # resolves minio_default itself on every run's first poke. SEC-05
    # (plan 05-03): resolved through Vault's `airflow-worker` role binding
    # above -- no secretKeyRef env var here anymore.
