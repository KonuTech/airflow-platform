# tests/fixtures/slice-corpus.yaml — COMMITTED. A SEPARATE manifest from
# tests/fixtures/corpus.yaml, deliberately.
#
# corpus.yaml is the EDGE-CASE corpus: it specifies pathological, byte-level
# constructions (bad encodings, mixed terminators, malformed quoting) that
# the universal CSV engine (Phase 6+) must survive or diagnose. This file is
# the opposite: realistic, UNIFORM, well-formed data for the vertical slice's
# E2E suite (04-08-PLAN.md), which proves unattended delivery, idempotency,
# crash-recovery and publish atomicity against the REAL deployed platform —
# none of which has anything to do with CSV edge cases. Mixing the two
# manifests would make "which corpus does fixture N belong to" a judgement
# call instead of a fact, and would couple this phase's E2E fixtures to
# Phase 1's byte-level regression suite for no reason.
#
# `master_seed` is DELIBERATELY DIFFERENT from corpus.yaml's
# "airflow-platform/corpus/v1": per-fixture random streams are derived from
# `sha256(master_seed | fixture_name)` (tools/corpus/generators.py R1) — a
# shared seed string would not corrupt anything numerically (fixture names
# still differ), but it WOULD couple this corpus's random stream namespace to
# the edge-case corpus's for no reason, and a future rename collision between
# the two files becomes thinkable instead of structurally impossible.
#
# Both fixtures use the EXISTING `zero_padded_int`/`pick` ColumnSpec kinds —
# no new generator kind, no change to tools/corpus/manifest.py or
# generators.py. `pick` over a deterministic, pre-written list of realistic
# full names / ISO 3166-1 alpha-2 country codes / birth dates / event
# timestamps is Faker-*style* (varied, realistic-looking data) while staying
#100% within R1-R10's determinism rules (STACK.md's own verdict: "no new
# ColumnSpec kind is needed for customer_id/name/country/birth_date/
# event_ts"). Generate via the already-generic CLI:
#   python -m tools.corpus generate --manifest tests/fixtures/slice-corpus.yaml --out <dir>
# tools/corpus/__main__.py's --manifest/--out flags already accept any
# manifest path; no code change was needed there either.
#
# Column shape matches normalized.customers (migrations 0005/0006) and
# MergePublisher's hardcoded target-column list (packages/dataplat/src/
# dataplat/load/publish/merge.py): customer_id::int, name, country,
# birth_date::date, event_ts::timestamptz. Header order MUST match
# dataplat.pipeline.run._CUSTOMERS_TARGET_COLUMNS exactly — this phase's
# CsvSource has no header-to-column name mapping, only positional
# correspondence (04-04-SUMMARY.md's own documented pattern).

