# tests/fixtures/corpus.yaml — COMMITTED. The only specification of the corpus.
#
# The corpus itself is generated, never committed (QUAL-08, ROADMAP criterion 2).
# Two files are tracked: this manifest, which states what every fixture *means*,
# and CORPUS.sha256, which is the oracle proving the bytes have not drifted.
#
# `make fixtures` materialises the corpus and rewrites the oracle.
# `make fixtures-verify` regenerates into a temporary directory and only reads
# the oracle. That asymmetry is what makes a generator change a reviewable diff.
#
# Pathological byte sequences live IN this file as escaped literals, so 100% of
# tests/fixtures/csv/ stays generated. Splitting the corpus into committed and
# generated halves would make the byte-identity claim only partly true, which is
# the same as not making it.
#
# The `expect:` block is the important half: it is what makes "the corpus is the
# specification" true rather than aspirational. Phase 6's detector tests are a
# parametrised loop over these declarations, so a disagreement between a
# fixture's declared meaning and the detector's behaviour is a test failure
# rather than a judgement call.
#
# Plan 01-03 seeded five fixtures here — one per generator kind, plus the large
# profile — so the framework was proven before the rest were authored. Plan
# 01-06 adds the sixteen whose construction is byte-level hard: encodings,
# marks, control bytes, terminator mixes, field sizes and split delivery. Those
# are the ones a naive generator cannot be retrofitted to produce, so every
# distinct capability they need exists now rather than being discovered in
# Phase 6 — where adding it would mean re-baselining every digest.
#
# Plan 01-07 adds the thirty-one structural cases: dialect and quoting traps,
# header/metadata/footer layouts, and row-shape anomalies. They are declarations
# only — not one byte of `tools/corpus/` changed to admit them, which is the
# prediction 01-06 made and this plan is the test of.
#
# CONVENTION for the literal fixtures added by 01-07: their `content:` is a
# SINGLE-quoted YAML scalar, whereas 32 and 39 above use the double-quoted form.
# Both end at the same bytes; what differs is which layer resolves the escape.
# A single-quoted scalar gets no YAML escape processing at all, so `\n` reaches
# the manifest loader as the two characters backslash-n and the loader's own
# resolution (`_decode_content`) turns it into a newline — and, decisively, a
# `"` is just a `"`. CSV content is mostly quotes; spelling every one of them
# as `\"` inside a double-quoted scalar is how a fixture acquires a quote
# nobody meant to write. A literal backslash is still written `\\`, because the
# loader's escape resolution runs either way.
#
# Declaration order is append-friendly on purpose. Existing entries are never
# moved: a fixture inserted between two others adds one line to CORPUS.sha256,
# whereas reordering them rewrites the oracle and makes review impossible.

version: 1
master_seed: "airflow-platform/corpus/v1"

fixtures:
  # --- tabular -------------------------------------------------------------
  - name: "01_simple.csv"
    covers: [CSV-04, CSV-07]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ","
    quotechar: '"'
    line_terminator: "\n"
    header: [id, name, amount]
    rows: 20
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
      amount: { kind: decimal, min: "100.00", max: "99999.99", scale: 2 }
    expect:
      detected_encoding: utf-8
      detected_delimiter: ","
      header_row_index: 0
      data_rows: 20
      rejected_rows: 0

  # --- encoding and Unicode -------------------------------------------------
  # A mark is deterministic evidence, so the confidence floor is 1.0 and no
  # probabilistic detector may override it (STACK.md §F). The other half of the
  # expectation is the one people forget: the mark is not data. A reader that
  # decodes with plain `utf-8` rather than `utf-8-sig` produces a first column
  # literally named "﻿id", and every contract lookup against it misses.
  - name: "05_utf8_bom.csv"
    covers: [CSV-02, CSV-03]
    generator: tabular
    encoding: utf-8
    bom: true
    delimiter: ","
    quotechar: '"'
    line_terminator: "\r\n"
    header: [id, name, amount]
    rows: 10
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
      amount: { kind: decimal, min: "100.00", max: "99999.99", scale: 2 }
    expect:
      detected_encoding: utf-8
      encoding_confidence_min: 1.0
      bom_byte_offset: 0
      bom_is_stripped_before_the_first_field: true
      detected_delimiter: ","
      detected_line_terminator: "\r\n"
      header_row_index: 0
      data_rows: 10
      rejected_rows: 0

  # No mark, single-byte encoding: detection is a probability, not a fact, which
  # is exactly the CSV-03 path. The Polish characters are the evidence — every
  # one of them is a byte above 0x7F that is *not* valid UTF-8, so a reader that
  # assumes UTF-8 fails loudly here instead of silently mangling a name.
  - name: "06_windows1250.csv"
    covers: [CSV-02, CSV-03]
    generator: tabular
    encoding: cp1250
    bom: false
    delimiter: ";"
    quotechar: '"'
    line_terminator: "\r\n"
    header: [id, miasto, kwota]
    rows: 10
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      miasto:
        {
          kind: pick,
          values: ["Łódź", "Gdańsk", "Żółkiewski", "Ćwikła", "Świętochłowice"],
        }
      kwota:
        {
          kind: decimal,
          min: "100.00",
          max: "99999.99",
          scale: 2,
          decimal_separator: ",",
        }
    expect:
      detected_encoding: cp1250
      encoding_confidence_max: 0.99
      decodes_as_strict_utf8: false
      detected_delimiter: ";"
      decimal_separator: ","
      data_rows: 10

  # Two-byte encoding WITH a mark — the certain case, and the counterpart to
  # 40_utf16_no_bom.csv, which is the same encoding without one.
  - name: "07_utf16.csv"
    covers: [CSV-02, CSV-03]
    generator: tabular
    encoding: utf-16-le
    bom: true
    delimiter: ","
    quotechar: '"'
    line_terminator: "\r\n"
    header: [id, name, amount]
    rows: 8
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
      amount: { kind: decimal, min: "100.00", max: "99999.99", scale: 2 }
    expect:
      detected_encoding: utf-16-le
      encoding_confidence_min: 1.0
      bom_byte_offset: 0
      byte_length_is_not_character_length: true
      data_rows: 8

  # Multiple scripts plus one non-BMP character, so "one character is one byte"
  # and "one character is one UTF-16 code unit" are both false in this file.
  - name: "26_unicode.csv"
    covers: [CSV-02, CSV-12]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ","
    quotechar: '"'
    line_terminator: "\n"
    header: [id, label, amount]
    rows: 12
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      label:
        {
          kind: pick,
          values: ["Ωμέγα", "Привет", "日本語", "\U0001F600 smile", "naïve"],
        }
      amount: { kind: decimal, min: "100.00", max: "99999.99", scale: 2 }
    expect:
      detected_encoding: utf-8
      contains_non_bmp_code_point: true
      byte_length_is_not_character_length: true
      data_rows: 12

  # The domain's own alphabet. Written as literal characters rather than
  # escapes because they are legible; the digest oracle is what protects them —
  # an editor that renormalised this file would change these bytes and
  # `make fixtures-verify` would say so on the next run.
  - name: "27_polish_characters.csv"
    covers: [CSV-02, CSV-12, DEDUP-01]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ";"
    quotechar: '"'
    line_terminator: "\r\n"
    header: [id, nazwisko, miasto]
    rows: 12
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      nazwisko:
        {
          kind: pick,
          values: ["Wiśniewski", "Żółkiewski", "Ćwikła", "Łukasiewicz", "Główczyński"],
        }
      miasto:
        { kind: pick, values: ["Łódź", "Gdańsk", "Poznań", "Kraków", "Wrocław"] }
    expect:
      detected_encoding: utf-8
      detected_delimiter: ";"
      diacritics_survive_round_trip: true
      data_rows: 12

  # --- field size, deliberately on the safe side of the limit ---------------
  # The twin of 67_row_exceeding_field_size_limit.csv. Both declare their width
  # as a parameter rather than arriving at it by accident, and this one sits
  # below the standard parser's 131 072-byte default so it exercises bounded
  # memory on wide values without tripping the limit. A pair is the point: a
  # single oversized fixture cannot distinguish "the limit works" from "wide
  # fields are broken".
  - name: "28_large_fields.csv"
    covers: [CSV-06, LOAD-07]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ","
    quotechar: '"'
    line_terminator: "\n"
    header: [id, note]
    rows: 2
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      note: { kind: repeat, char: "x", length: 100000 }
    expect:
      data_rows: 2
      max_field_bytes: 100000
      stdlib_default_field_size_limit: 131072
      exceeds_stdlib_default_field_size_limit: false
      parses_without_raising: true
      rejected_rows: 0

  # --- tabular, large profile ----------------------------------------------
  # Generated on every gate run, never cached. A cache would be the only
  # artifact in this system whose staleness could invalidate the reproducibility
  # claim it exists to support, and it would save a few seconds.
  #
  # `rlimit_as_bytes` is the address-space ceiling the Phase 6 bounded-memory
  # test runs the streaming reader under: a streaming parse must pass and a
  # buffering parse must die. 128 MiB is the measured value that still leaves
  # the interpreter its own ~30-50 MB of footprint. The manifest validator
  # enforces `approx_bytes > 2 * rlimit_as_bytes`, because a file that merely
  # exceeds the limit makes the assertion marginal rather than decisive.
  - name: "29_large_file.csv"
    covers: [LOAD-07]
    generator: tabular
    encoding: utf-8
    delimiter: ","
    line_terminator: "\n"
    header: [id, name, amount]
    rows: 11000000
    profile: large
    row_spec:
      id: { kind: zero_padded_int, width: 8, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
      amount: { kind: decimal, min: "100.00", max: "99999.99", scale: 2 }
    expect:
      approx_bytes: 293000000
      rlimit_as_bytes: 134217728
      data_rows: 11000000

  # --- line terminators ------------------------------------------------------
  # Both forms in one file, alternating per record. This is what a file
  # assembled from two sources looks like, and it defeats the common shortcut
  # of sniffing the first line's terminator and applying it to the whole file.
  # The reader must open with newline="" and let the parser decide per record;
  # anything else either loses a row or gains a stray \r at the end of a field.
  - name: "30_crlf_lf_mixed.csv"
    covers: [CSV-06, CSV-13]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ","
    quotechar: '"'
    line_terminators: ["\r\n", "\n"]
    header: [id, name]
    rows: 5
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
    expect:
      data_rows: 5
      terminators_present: ["\r\n", "\n"]
      terminator_is_uniform: false
      detected_line_terminator: mixed
      rejected_rows: 0

  # A bare carriage return throughout — the classic early-Macintosh and
  # mainframe export. Read in text mode with universal newlines this parses
  # fine by accident; read as bytes and split on \n it is ONE row of 6 fields
  # * 5. There is no line feed anywhere in the file, which is the assertion.
  - name: "31_cr_only.csv"
    covers: [CSV-06, CSV-13]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ","
    quotechar: '"'
    line_terminator: "\r"
    header: [id, name]
    rows: 5
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
    expect:
      data_rows: 5
      detected_line_terminator: "\r"
      contains_line_feed: false
      splitting_on_line_feed_yields_one_row: true
      rejected_rows: 0

  # --- literal --------------------------------------------------------------
  # VERIFIED on CPython 3.12.3: the stdlib CSV reader parses an embedded NUL
  # without raising, and the byte survives inside the field. FEATURES.md §3.4
  # states the opposite and is wrong. This matters because it moves the failure
  # downstream: the NUL is not a parsing problem, it is a PostgreSQL problem —
  # `text`/`varchar` cannot store U+0000. So the expectation below is a
  # validation/quarantine outcome, not a parser exception. Planning for an
  # exception that never arrives would leave NUL bytes to surface as an opaque
  # psycopg error during COPY, attributable to no particular row.
  - name: "32_nul_bytes.csv"
    covers: [CSV-06, VALID-01]
    generator: literal
    encoding: utf-8
    content: "id,name\n1,ab\\x00cd\n2,ok\n"
    expect:
      data_rows: 2
      parser_raises: false
      contains_nul_in_column: name
      quarantine_reason: "nul-byte-in-text-field"

  # --- literal, with raw bytes spliced in -----------------------------------
  # Bytes that are NOT valid UTF-8, which is why they are spliced rather than
  # encoded: no encoder would ever produce them. They live here as escaped
  # literals so the generated tree stays 100% generated.
  #
  # Content is `id,name\n1,ok\n2,ok\n3,ok\n`, so the encoded offsets are:
  #   0..7   "id,name\n"   8..12  "1,ok\n"   13..17 "2,ok\n"   18..22 "3,ok\n"
  # Offset 12 therefore lands immediately after the `ok` of row 1 and before its
  # terminator — inside a text field, which is where a truncated multibyte
  # sequence actually turns up. The second splice uses record addressing so both
  # modes are exercised; it lands at the start of row 3.
  #
  # The expectation deliberately does NOT name one error policy. §9's reader
  # must *declare* `strict`, `replace` or `surrogateescape` in its contract;
  # what this fixture pins is that the default (strict) raises, so the choice
  # cannot be made by accident.
  - name: "39_utf8_invalid_sequences.csv"
    covers: [CSV-02, CSV-03, VALID-01, VALID-03]
    generator: literal
    encoding: utf-8
    content: "id,name\n1,ok\n2,ok\n3,ok\n"
    splices:
      - { bytes: "\\xc3\\x28", offset: 12 }
      - { bytes: "\\x80", after_record: 3 }
    expect:
      data_rows: 3
      decodes_as_strict_utf8: false
      error_policy_must_be_declared: true
      invalid_sequence_classes:
        ["truncated-two-byte-lead", "lone-continuation-byte"]
      affected_rows: [1, 3]
      quarantine_reason: "undecodable-bytes"

  # The same encoding as 07_utf16.csv with the mark removed: genuinely
  # ambiguous, and therefore the confidence-and-override path. The expectation
  # asserts that detection is NOT certain — a detector that returns 1.0 here is
  # claiming determinism it does not have, which CSV-03 forbids.
  - name: "40_utf16_no_bom.csv"
    covers: [CSV-02, CSV-03, CSV-05]
    generator: tabular
    encoding: utf-16-le
    bom: false
    delimiter: ","
    quotechar: '"'
    line_terminator: "\n"
    header: [id, name]
    rows: 6
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
    expect:
      declared_encoding: utf-16-le
      encoding_is_certain: false
      encoding_confidence_max: 0.99
      bom_present: false
      requires_contract_override: true
      data_rows: 6

  # What a concatenated export looks like: the mark appears part-way through,
  # after the first data record, not at offset zero. A reader that sniffs only
  # the first bytes will not see it, and a reader that treats any mark anywhere
  # as an encoding declaration will re-decode the whole file on the strength of
  # three bytes in the middle of it. Here the mark is data, and the row it is
  # attached to must still parse.
  - name: "41_bom_mid_file.csv"
    covers: [CSV-02, CSV-03, CSV-08]
    generator: tabular
    encoding: utf-8
    bom: true
    bom_after_record: 2
    delimiter: ","
    quotechar: '"'
    line_terminator: "\n"
    header: [id, name]
    rows: 4
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
    expect:
      detected_encoding: utf-8
      bom_at_offset_zero: false
      bom_after_record: 2
      mark_is_data_not_an_encoding_declaration: true
      data_rows: 4

  # Invisible in a diff, which is why the code points are named here and written
  # as escapes rather than pasted. U+200B and U+200E render as nothing at all,
  # so three keys that look identical to a human are three distinct strings to a
  # hash — and deduplication and SCD2 change detection both run on hashes.
  - name: "42_zero_width_and_bidi.csv"
    covers: [CSV-12, DEDUP-01, VALID-02]
    generator: literal_unicode
    encoding: utf-8
    delimiter: ","
    line_terminator: "\n"
    rows_spec:
      - id: "1"
        customer_key: "AB\u200BC12" # U+200B ZERO WIDTH SPACE
      - id: "2"
        customer_key: "AB\u200EC12" # U+200E LEFT-TO-RIGHT MARK
      - id: "3"
        customer_key: "ABC12" # the clean control
    expect:
      data_rows: 3
      code_points_present:
        ["U+200B ZERO WIDTH SPACE", "U+200E LEFT-TO-RIGHT MARK"]
      keys_look_identical_to_a_reader: true
      distinct_before_invisible_stripping: 3
      distinct_after_invisible_stripping: 1

  # U+00A0 as a thousands separator is ubiquitous in Polish and French exports
  # and is NOT the ASCII space, so a `strip()`-and-`replace(" ", "")` normaliser
  # leaves it in place and the value fails to parse as a number.
  - name: "43_nbsp_thousands_separator.csv"
    covers: [CSV-10, VALID-02]
    generator: literal_unicode
    encoding: utf-8
    delimiter: ";"
    line_terminator: "\r\n"
    rows_spec:
      - id: "1"
        kwota: "1\u00A0234,56" # U+00A0 NO-BREAK SPACE
      - id: "2"
        kwota: "12\u00A0345,00"
      - id: "3"
        kwota: "999,99"
    expect:
      data_rows: 3
      code_points_present: ["U+00A0 NO-BREAK SPACE"]
      thousands_separator: "U+00A0"
      decimal_separator: ","
      ascii_space_is_absent: true
      normalised_values: ["1234.56", "12345.00", "999.99"]

  # --- literal_unicode ------------------------------------------------------
  # The two names below are NOT pasted as visually identical strings: the
  # generator applies unicodedata.normalize explicitly (R9), because editors,
  # git filters and terminals silently collapse exactly the distinction this
  # fixture exists to test.
  - name: "44_unicode_nfc_vs_nfd.csv"
    covers: [CSV-12, DEDUP-01]
    generator: literal_unicode
    encoding: utf-8
    delimiter: ","
    line_terminator: "\n"
    rows_spec:
      - id: "1"
        name: { text: "Wiśniewski", form: NFC }
      - id: "1"
        name: { text: "Wiśniewski", form: NFD }
    expect:
      data_rows: 2
      distinct_after_nfc_normalization: 1
      distinct_before_normalization: 2

  # --- wrapper --------------------------------------------------------------
  # gzip_mtime and gzip_filename are non-negotiable (R5). gzip embeds the
  # current wall-clock time and the source filename in its header; without both
  # of these, two runs a second apart produce different bytes and this fixture
  # fails verification on every machine, forever, for no visible reason.
  - name: "61_gzipped.csv.gz"
    covers: [CSV-11]
    generator: wrapper
    wraps: "01_simple.csv"
    compression: gzip
    gzip_mtime: 0
    gzip_filename: ""
    expect:
      decompresses_to: "01_simple.csv"
      data_rows: 20

  # --- delivery shape: one logical dataset across several objects -----------
  # Spark-style output: `part-00000`, `part-00001`, header in the first part
  # only. The failure this fixture exists to catch is a reader that treats each
  # object as a file: part-00001's first row is DATA, and consuming it as a
  # header silently drops a record and renames every column to a customer's
  # name. Discovery (§40) must group the parts into one dataset before parsing.
  #
  # A part is a byte range and nothing else: no archive header, so unlike gzip
  # there is no timestamp and no embedded source filename that could differ
  # between two runs (R5's concern, satisfied by construction).
  - name: "62_multipart_split"
    covers: [CSV-11, LOAD-01]
    generator: multipart
    wraps: "01_simple.csv"
    encoding: utf-8
    line_terminator: "\n"
    parts: 2
    expect:
      parts: 2
      part_names: ["part-00000", "part-00001"]
      header_in_first_part_only: true
      one_logical_dataset: true
      data_rows: 20
      second_part_first_row_is_data: true

  # --- field size, deliberately past the limit -------------------------------
  # The twin of 28_large_fields.csv, on the other side of the line. The stdlib
  # parser raises `_csv.Error: field larger than field limit` and ABORTS the
  # whole iteration, so the naive reading is "this file is unparseable".
  #
  # That is not the outcome declared here. STACK.md §F requires the limit to be
  # an explicit contract parameter, and §51 requires a bad record to be
  # rejected with a reason rather than taking the file down with it. So the
  # expectation is a rejected record, and the reader owes a field-size guard
  # that produces one — the parser default is a trap, not a specification.
  - name: "67_row_exceeding_field_size_limit.csv"
    covers: [CSV-06, VALID-01, VALID-03]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ","
    quotechar: '"'
    line_terminator: "\n"
    header: [id, blob]
    rows: 2
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      blob: { kind: repeat, char: "y", length: 200000 }
    expect:
      data_rows: 2
      max_field_bytes: 200000
      stdlib_default_field_size_limit: 131072
      exceeds_stdlib_default_field_size_limit: true
      contract_parameter: "csv.max_field_bytes"
      outcome: rejected-record
      quarantine_reason: "field-exceeds-max-field-bytes"
      parser_aborts_whole_file: false

  # --- the most common real export shape in this project's domain -----------
  # A Polish Excel "Save as CSV" produces all three of these at once: a UTF-8
  # mark, a semicolon delimiter and comma decimal separators. Each is covered
  # individually above; this fixture exists because they interact — a detector
  # that sees `1234,56` and a `,` in its delimiter candidates can conclude the
  # delimiter is a comma and split every amount in half. Dialect detection runs
  # before numeric normalisation precisely so that cannot happen, and this is
  # the file that proves it.
  - name: "68_utf8_bom_semicolon_pl_excel.csv"
    covers: [CSV-02, CSV-04, CSV-05, CSV-10]
    generator: tabular
    encoding: utf-8
    bom: true
    delimiter: ";"
    quotechar: '"'
    line_terminator: "\r\n"
    header: [id, klient, kwota]
    rows: 10
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      klient:
        {
          kind: pick,
          values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik", "Kamiński"],
        }
      kwota:
        {
          kind: decimal,
          min: "100.00",
          max: "99999.99",
          scale: 2,
          decimal_separator: ",",
        }
    expect:
      detected_encoding: utf-8
      encoding_confidence_min: 1.0
      bom_byte_offset: 0
      detected_delimiter: ";"
      decimal_separator: ","
      comma_is_not_the_delimiter: true
      header_row_index: 0
      data_rows: 10
      rejected_rows: 0

  # ==========================================================================
  # PLAN 01-07 — the structural core of README §73 (dialect, header, row shape)
  # ==========================================================================

  # --- dialect: the delimiter is a parameter, never an assumption -----------
  # 02/03/04 are the plain cases. They look trivial and they are, which is the
  # point: CSV-04 names five dialects, and a corpus that only ever exercises the
  # comma lets a hard-coded `,` survive every test in the suite.
  - name: "02_semicolon.csv"
    covers: [CSV-04, CSV-05]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: ";"
    quotechar: '"'
    line_terminator: "\n"
    header: [id, name, amount]
    rows: 8
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
      amount: { kind: decimal, min: "100.00", max: "99999.99", scale: 2 }
    expect:
      detected_encoding: utf-8
      detected_delimiter: ";"
      contains_no_comma: true
      header_row_index: 0
      column_count: 3
      data_rows: 8
      rejected_rows: 0

  # The pipe is a regular-expression metacharacter. Any detector or splitter
  # that builds a pattern from the delimiter without escaping it turns `|` into
  # alternation and matches the empty string everywhere.
  - name: "03_pipe.csv"
    covers: [CSV-04, CSV-05]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: "|"
    quotechar: '"'
    line_terminator: "\n"
    header: [id, name, amount]
    rows: 8
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
      amount: { kind: decimal, min: "100.00", max: "99999.99", scale: 2 }
    expect:
      detected_encoding: utf-8
      detected_delimiter: "|"
      delimiter_is_a_regex_metacharacter: true
      delimiter_must_be_escaped_before_use_in_a_pattern: true
      contains_no_comma: true
      header_row_index: 0
      column_count: 3
      data_rows: 8
      rejected_rows: 0

  # Tab-separated is NOT whitespace-separated, and the `notatka` column exists
  # to make the difference observable: its values contain ASCII spaces, so a
  # reader that splits on generic whitespace produces extra fields on every row
  # while a reader that splits on `\t` does not.
  - name: "04_tab.csv"
    covers: [CSV-04, CSV-05]
    generator: tabular
    encoding: utf-8
    bom: false
    delimiter: "\t"
    quotechar: '"'
    line_terminator: "\n"
    header: [id, name, notatka]
    rows: 8
    row_spec:
      id: { kind: zero_padded_int, width: 6, start: 1 }
      name: { kind: pick, values: ["Kowalski", "Nowak", "Wiśniewski", "Wójcik"] }
      notatka:
        {
          kind: pick,
          values: ["do sprawdzenia", "ok", "brak danych", "zwrot do korekty"],
        }
    expect:
      detected_encoding: utf-8
      detected_delimiter: "\t"
      is_tab_separated_not_whitespace_separated: true
      values_contain_ascii_spaces: true
      splitting_on_generic_whitespace_would_split_values: true
      contains_no_comma: true
      header_row_index: 0
      column_count: 3
      data_rows: 8
      rejected_rows: 0

  # --- quoting --------------------------------------------------------------
  # Every field quoted, including the numeric ones. Quoting is a transport
  # convention, not a type declaration: `"1234.56"` is still a number and
  # `"000001"` is still an identifier whose leading zeros are data (SCHEMA-01).
  # The quotes themselves are never part of the value.
  - name: "08_quoted_fields.csv"
    covers: [CSV-06, SCHEMA-01]
    generator: literal
    encoding: utf-8
    content: '"id","name","amount"\n"000001","Kowalski","1234.56"\n"000002","Nowak","2345.67"\n"000003","Wiśniewski","3456.78"\n'
    expect:
      detected_delimiter: ","
      quotechar: '"'
      every_field_is_quoted: true
      quotes_are_not_part_of_the_value: true
      quoting_does_not_imply_string_type: true
      leading_zeros_are_preserved: "000001"
      value_row_1: ["000001", "Kowalski", "1234.56"]
      header_row_index: 0
      column_count: 3
      data_rows: 3
      rejected_rows: 0

  # The delimiter appears INSIDE quoted fields, which is the case a string
  # split cannot survive — CSV-06 forbids string splitting for exactly this
  # reason. `naive_split_field_counts` is the damage a `line.split(",")` does,
  # stated as a number so the difference is measurable rather than asserted.
  - name: "09_embedded_commas.csv"
    covers: [CSV-06, CSV-13]
    generator: literal
    encoding: utf-8
    content: 'id,name,address\n1,"Kowalski, Jan","ul. Główna 12, 00-001 Warszawa"\n2,"Nowak, Anna","ul. Kwiatowa 3, 30-002 Kraków"\n3,Prosty,"Bez przecinka"\n'
    expect:
      detected_delimiter: ","
      delimiter_occurs_inside_quoted_fields: true
      correct_field_count_per_record: 3
      naive_split_field_counts: [3, 5, 5, 3]
      value_row_1_name: "Kowalski, Jan"
      header_row_index: 0
      column_count: 3
      data_rows: 3
      rejected_rows: 0

  # A record is not a line. Two of the three records span several physical
  # lines, so line count (7) and record count (4) disagree — which is precisely
  # why CSV-13 requires chunking in *records* and never by lines or byte
  # offsets. A reader that chunks by line splits row 1 in half and reports two
  # malformed records that do not exist in the source.
  - name: "10_embedded_newlines.csv"
    covers: [CSV-06, CSV-13]
    generator: literal
    encoding: utf-8
    content: 'id,note\n1,"first line\nsecond line"\n2,ok\n3,"a\nb\nc"\n'
    expect:
      detected_delimiter: ","
      physical_line_count: 7
      record_count_including_header: 4
      line_count_is_not_record_count: true
      records_spanning_multiple_lines: [1, 3]
      value_row_1_note: "first line\nsecond line"
      chunking_by_line_fabricates_malformed_records: true
      header_row_index: 0
      column_count: 2
      data_rows: 3
      rejected_rows: 0

  # A quote character inside a field that was never quoted. `5" pipe` is an
  # inches mark, not a transport quote, and the stdlib parser preserves it —
  # VERIFIED on CPython 3.12.3. So the declared outcome is a parsed record with
  # the quote retained, NOT a rejection: treating a bare `"` as a parse error
  # would quarantine every measurement in an engineering feed.
  - name: "35_quote_in_unquoted_field.csv"
    covers: [CSV-06, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,code,note\n1,ab"cd,plain\n2,5" pipe,inches\n3,normal,plain\n'
    expect:
      detected_delimiter: ","
      quotechar_appears_inside_an_unquoted_field: true
      affected_row_indices: [1, 2]
      the_quote_is_data_because_the_field_is_not_quoted: true
      value_row_1_code: 'ab"cd'
      value_row_2_code: '5" pipe'
      outcome: parsed-with-the-quote-preserved
      parser_raises: false
      header_row_index: 0
      column_count: 3
      data_rows: 3
      rejected_rows: 0

  # Two escape conventions, one file. This fixture uses the RFC-4180 doubled
  # quote; the backslash is ordinary data everywhere it appears.
  #
  # Row 2 is the whole point. Under the doubled convention the `"` after the
  # backslash CLOSES the quoted field, so the value is `a\b"`. Under a
  # backslash convention the same eight bytes read as `a"b`. Neither reading
  # raises — the file parses either way — so choosing the wrong convention is a
  # DATA CORRUPTION that no exception announces. That is why the convention has
  # to be a declared contract parameter rather than a detector's guess.
  - name: "36_doubled_vs_backslash_escape.csv"
    covers: [CSV-06, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,value,convention\n1,"He said ""hello""",doubled-quote-escape\n2,"a\\"b",backslash-would-escape\n3,"path\\dir\\file",backslash-is-data\n'
    expect:
      detected_delimiter: ","
      escape_convention: doubled-quote
      backslash_is_data_never_an_escape_in_this_file: true
      value_row_1: 'He said "hello"'
      value_row_2_under_the_doubled_convention: 'a\b"'
      value_row_2_under_a_backslash_convention: 'a"b'
      value_row_3: 'path\dir\file'
      misreading_the_convention_is_corruption_not_a_parse_error: true
      convention_must_be_declared_in_the_contract: true
      contract_parameter: "csv.escapechar"
      parser_raises: false
      header_row_index: 0
      column_count: 3
      data_rows: 3
      rejected_rows: 0

  # The classic dialect-sniffer trap: the header row's delimiter frequencies
  # disagree with the body's. The header carries three commas and two
  # semicolons because one column name is itself a comma-separated list; every
  # body row carries zero commas and two semicolons.
  #
  # A frequency heuristic that reads the first line picks `,`. The correct
  # answer is `;`, and the evidence for it is in the BODY: with `;` every row
  # including the header has three fields, whereas with `,` the header has four
  # fields and each body row has one. Consistency across records is the signal;
  # first-line frequency is noise (STACK.md §F — this is why csv.Sniffer is
  # rejected and a consistency-measure detector is used instead).
  - name: "37_delimiter_frequency_differs_header_vs_body.csv"
    covers: [CSV-04, CSV-05]
    generator: literal
    encoding: utf-8
    content: 'id;first,middle,last,suffix;amount\n1;Kowalski;1234.56\n2;Nowak;2345.67\n3;Wiśniewski;3456.78\n4;Wójcik;4567.89\n5;Kamiński;5678.90\n'
    expect:
      correct_delimiter: ";"
      decision_must_come_from_the_body_not_the_first_line: true
      header_delimiter_counts: { ",": 3, ";": 2 }
      body_delimiter_counts_per_row: { ",": 0, ";": 2 }
      first_line_frequency_heuristic_picks: ","
      field_count_with_the_correct_delimiter: 3
      header_field_count_if_comma_is_chosen: 4
      body_field_count_if_comma_is_chosen: 1
      header_row_index: 0
      column_count: 3
      data_rows: 5
      rejected_rows: 0

  # Nothing to detect. There is no delimiter in this file, so the only correct
  # behaviour is to DECLINE — a guessed delimiter here splits a reference code
  # into pieces and every downstream key is wrong, silently.
  #
  # The stdlib sniffer does not decline: it raises `_csv.Error: Could not
  # determine delimiter` — VERIFIED on CPython 3.12.3. An exception is not the
  # same as a clean "single column, no delimiter" answer, and a reader that
  # catches it and falls back to `,` has turned a refusal into a guess.
  - name: "38_single_column_no_delimiter.csv"
    covers: [CSV-05, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'customer_reference\nCUST-000001\nCUST-000002\nCUST-000003\nCUST-000004\nCUST-000005\n'
    expect:
      detection_declines: true
      detected_delimiter: null
      a_guessed_delimiter_is_a_silent_corruption_source: true
      stdlib_sniffer_raises: true
      stdlib_sniffer_error: "Could not determine delimiter"
      candidate_delimiters_absent: [",", ";", "|", "\t"]
      resolution: "one column; the contract declares it, the detector never invents one"
      header_row_index: 0
      column_count: 1
      data_rows: 5
      rejected_rows: 0

  # All three hazards in ONE field: the delimiter, a newline and a doubled-quote
  # escape, simultaneously. Each is covered alone by 09, 10 and 36; a reader can
  # pass all three of those and still fail here, because handling them together
  # is a different problem from handling them in sequence.
  #
  # The exact parsed values are declared, so failure is visible rather than
  # approximate.
  - name: "66_triple_nasty.csv"
    covers: [CSV-06, CSV-13]
    generator: literal
    encoding: utf-8
    content: 'id,payload,note\n1,"a,b\nc""d",all three at once\n2,plain,control\n'
    expect:
      detected_delimiter: ","
      contains_delimiter_inside_a_quoted_field: true
      contains_newline_inside_a_quoted_field: true
      contains_a_doubled_quote_escape_in_the_same_field: true
      all_three_hazards_occur_in_one_field: true
      value_row_1: ["1", "a,b\nc\"d", "all three at once"]
      value_row_1_payload: "a,b\nc\"d"
      physical_line_count: 4
      record_count_including_header: 3
      a_reader_that_handles_each_hazard_alone_still_fails_here: true
      header_row_index: 0
      column_count: 3
      data_rows: 2
      rejected_rows: 0

  # --- header, metadata and footer layout (CSV-07, CSV-08) ------------------
  # Every fixture in this group declares a header row index, INCLUDING the
  # cases where there is none — `header_row_index: null` is a different
  # statement from `header_row_index: 0`, and a pipeline that cannot tell them
  # apart will name a column after a customer.
  #
  # Each also declares the contract parameter that overrides detection, because
  # CSV-07/CSV-08 say the answer is configurable *or* detected, and a detector
  # with no override is a detector you cannot correct at 03:00.

  # No header at all. Row 0 has the same shape and the same field types as every
  # row below it, which is the evidence — there is nothing about it that reads
  # as a name. Consuming it as a header silently drops a record and renames the
  # columns to one customer's data.
  - name: "11_no_header.csv"
    covers: [CSV-07, SCHEMA-02]
    generator: literal
    encoding: utf-8
    content: '000001,Kowalski,1234.56\n000002,Nowak,2345.67\n000003,Wiśniewski,3456.78\n000004,Wójcik,4567.89\n'
    expect:
      detected_delimiter: ","
      has_header: false
      header_row_index: null
      header_is_absent_not_at_row_zero: true
      first_row_is_data: true
      detection_evidence: "row 0 has the same field count and the same field types as every row below it"
      column_names_must_come_from_the_contract: true
      contract_parameter: "csv.header_row"
      column_count: 3
      data_rows: 4
      rejected_rows: 0

  # A report preamble: three comment lines, then a blank line, then the header
  # at row index 4. The preamble is also a dialect hazard — `# Generated:
  # 2026-01-15` contains a colon, and the colon is one of CSV-04's five
  # dialects. So the preamble must be excluded BEFORE delimiter detection runs,
  # not after; a detector sampling from byte zero lets three comment lines vote
  # on the dialect of a file they are not part of.
  - name: "12_metadata_before_header.csv"
    covers: [CSV-07, CSV-08]
    generator: literal
    encoding: utf-8
    content: '# Export from System X\n# Generated: 2026-01-15\n# Rows: 4\n\nid,name,amount\n000001,Kowalski,1234.56\n000002,Nowak,2345.67\n000003,Wiśniewski,3456.78\n000004,Wójcik,4567.89\n'
    expect:
      detected_delimiter: ","
      has_header: true
      header_row_index: 4
      preamble_row_count: 4
      preamble_row_indices: [0, 1, 2, 3]
      preamble_includes_a_blank_line: true
      preamble_contains_a_colon_which_is_itself_a_candidate_delimiter: true
      preamble_must_be_excluded_before_dialect_detection: true
      data_starts_at_row_index: 5
      detection_evidence: "the first row whose field count equals the modal field count of the rows below it"
      header_row_index_is_configurable_or_detected: true
      contract_parameter: "csv.header_row"
      column_count: 3
      data_rows: 4
      rejected_rows: 0

  # Trailing rows that are not records: a blank separator, a totals line and a
  # sign-off. None of them has the modal field count, and none may be loaded.
  # 64 is the harder sibling — there the footer is a single row that looks
  # almost like data.
  - name: "13_footer.csv"
    covers: [CSV-08, VALID-06]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n000001,Kowalski,1234.56\n000002,Nowak,2345.67\n000003,Wiśniewski,3456.78\n\nTotal: 7037.01\nEnd of report\n'
    expect:
      detected_delimiter: ","
      has_header: true
      header_row_index: 0
      modal_field_count: 3
      footer_row_count: 3
      footer_row_indices: [4, 5, 6]
      footer_field_counts: [0, 1, 1]
      footer_rows_must_not_be_loaded_as_records: true
      footer_carries_a_control_total: "7037.01"
      control_total_equals_the_sum_of_the_amount_column: true
      contract_parameter: "csv.skip_footer_rows"
      column_count: 3
      data_rows: 3
      rejected_rows: 0

  # Zero bytes. The twin of 19, and the pair is the point: an operator told
  # "0 rows loaded" cannot act, because the two causes need opposite responses.
  # Here NOTHING arrived — not the schema, not a record — so the file is
  # evidence of a broken export, not of a quiet day.
  - name: "18_empty.csv"
    covers: [CSV-07, VALID-01]
    generator: literal
    encoding: utf-8
    content: ''
    expect:
      byte_length: 0
      has_header: false
      header_row_index: null
      schema_is_unknown: true
      record_count_including_header: 0
      physical_line_count: 0
      data_rows: 0
      outcome: empty-file
      distinguishable_from_header_only: true
      must_not_be_reported_as_zero_rows_against_a_known_schema: true
      quarantine_reason: "empty-file"

  # A header and nothing else. The twin of 18: the schema DID arrive and it is
  # correct; there were simply no records. That is a legitimate quiet day for an
  # incremental feed and must not raise. The two fixtures differ in their
  # declared meaning, not merely in their size.
  - name: "19_only_header.csv"
    covers: [CSV-07, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n'
    expect:
      detected_delimiter: ","
      byte_length_is_nonzero: true
      has_header: true
      header_row_index: 0
      header: [id, name, amount]
      schema_is_known: true
      record_count_including_header: 1
      physical_line_count: 1
      data_rows: 0
      outcome: header-only-no-records
      distinguishable_from_empty: true
      is_a_valid_empty_increment_not_an_error: true
      column_count: 3

  # `Name` and `name` are not the same string, so an exact-duplicate check
  # passes and a case-insensitive one does not. That is the whole fixture: the
  # collision only exists once names are folded — which they must be, because
  # PostgreSQL folds unquoted identifiers to lower case and both columns would
  # land on one target column.
  #
  # The declared outcome is a REJECTION. A silent rename (`name_1`) invents a
  # column the contract never declared; a silent last-wins discards a column of
  # real data with nothing recording that it happened.
  - name: "48_duplicate_header_names_case_variant.csv"
    covers: [CSV-07, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,Name,name,amount\n1,Kowalski,Jan,1234.56\n2,Nowak,Anna,2345.67\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      raw_header: [id, Name, name, amount]
      colliding_names: [Name, name]
      collision_is_case_insensitive_only: true
      exact_duplicates_present: false
      the_two_columns_carry_different_values: true
      outcome: rejected-file
      must_not_silently_rename: true
      must_not_silently_last_wins: true
      quarantine_reason: "duplicate-header-names"
      contract_parameter: "csv.header_case_sensitive"
      column_count: 4
      data_rows: 2

  # Padded header names. Both the raw and the trimmed forms are declared, so a
  # reader that trims and one that preserves are distinguishable rather than
  # both "passing". `amount` is the clean control — without it a test could not
  # tell "trims every name" from "returns a fixed trimmed list".
  #
  # The stdlib's `skipinitialspace` strips LEADING whitespace only, so a reader
  # that leans on it still carries `customer_id ` with its trailing space and
  # every contract lookup misses.
  - name: "49_header_with_leading_trailing_spaces.csv"
    covers: [CSV-07, SCHEMA-02]
    generator: literal
    encoding: utf-8
    content: ' customer_id , Name ,amount\n1,Kowalski,1234.56\n2,Nowak,2345.67\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      raw_header: [" customer_id ", " Name ", "amount"]
      trimmed_header: ["customer_id", "Name", "amount"]
      clean_control_column: "amount"
      trimming_is_a_declared_normalisation_not_a_parser_default: true
      stdlib_skipinitialspace_strips_leading_only: true
      contract_lookup_against_the_raw_names_misses: true
      contract_parameter: "csv.header_trim"
      column_count: 3
      data_rows: 2
      rejected_rows: 0

  # A concatenated export: two files joined, so the header line reappears at row
  # index 3. Loaded as a record it becomes a row whose `amount` is the literal
  # string "amount" — a type error if you are lucky and a NULL if you are not.
  # The declared record count EXCLUDES the repeat, and the repeat's row index is
  # named so the finding is locatable rather than a count discrepancy.
  - name: "63_repeated_header_mid_file.csv"
    covers: [CSV-08, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n000001,Kowalski,1234.56\n000002,Nowak,2345.67\nid,name,amount\n000003,Wiśniewski,3456.78\n000004,Wójcik,4567.89\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      repeated_header_row_indices: [3]
      repeated_header_occurrences: 1
      detection_evidence: "a row whose values are exactly the header row's values"
      data_rows: 4
      data_rows_if_the_repeat_is_loaded: 5
      the_repeat_must_not_be_loaded_as_a_record: true
      cause: "concatenated export"
      column_count: 3
      rejected_rows: 0

  # The footer that is hardest to spot: one trailing row, no blank line before
  # it, values that look like data. What identifies it is its COLUMN COUNT — two
  # fields against a modal three. A reader that pads it to the modal count
  # loads a customer called TOTAL whose amount is the sum of every other row,
  # and every aggregate downstream is exactly doubled.
  - name: "64_footer_totals_with_different_column_count.csv"
    covers: [CSV-08, VALID-06]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n000001,Kowalski,1234.56\n000002,Nowak,2345.67\n000003,Wiśniewski,3456.78\nTOTAL,7037.01\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      modal_field_count: 3
      footer_row_count: 1
      footer_row_indices: [4]
      footer_field_count: 2
      footer_is_identified_by_its_differing_column_count: true
      footer_must_not_be_padded_to_the_modal_count: true
      footer_control_total: "7037.01"
      control_total_equals_the_sum_of_the_amount_column: true
      padding_it_would_double_every_aggregate: true
      contract_parameter: "csv.skip_footer_rows"
      column_count: 3
      data_rows: 3
      rejected_rows: 0

  # --- row-shape anomalies (VALID-01, VALID-03) -----------------------------
  # The single rule this whole group encodes: NO ROW IS EVER REPAIRED. A short
  # row is not padded with NULLs, a long row is not truncated, a malformed row
  # is not coerced into shape. Every one of them becomes a rejected record
  # carrying its source row number and a reason (VALID-03), because a repaired
  # row is a row that loaded successfully and is wrong — the one outcome this
  # platform exists to prevent.
  #
  # Field counts below are 0-based physical row indices, header included at 0,
  # and every one was VERIFIED against the stdlib reader on CPython 3.12.3.

  # Exactly duplicated column names — the sibling of 48, where the collision
  # only appeared after case folding. Here `amount` appears twice verbatim and
  # the two columns carry DIFFERENT values, so a last-wins resolution silently
  # discards a whole column of real data.
  - name: "14_duplicate_columns.csv"
    covers: [CSV-07, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,amount,amount,name\n1,10.00,20.00,Kowalski\n2,30.00,40.00,Nowak\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      raw_header: [id, amount, amount, name]
      duplicated_name: amount
      duplicate_is_exact_not_a_case_variant: true
      duplicate_positions: [1, 2]
      the_two_columns_carry_different_values: true
      outcome: rejected-file
      must_not_silently_keep_the_last_occurrence: true
      quarantine_reason: "duplicate-header-names"
      column_count: 4
      data_rows: 2

  # Rows with FEWER fields than the header. The trailing columns are absent, not
  # empty — `city` was never written for rows 2 and 3, which is a different fact
  # from `city` being the empty string, and padding with NULL destroys the
  # distinction before anyone can act on it.
  - name: "15_missing_columns.csv"
    covers: [VALID-01, VALID-03]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount,city\n1,Kowalski,1234.56,Warszawa\n2,Nowak,2345.67\n3,Wiśniewski\n4,Wójcik,4567.89,Kraków\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      header_field_count: 4
      field_count_by_row_index: { 0: 4, 1: 4, 2: 3, 3: 2, 4: 4 }
      short_row_indices: [2, 3]
      rows_must_not_be_padded_with_null: true
      absent_is_not_the_same_fact_as_empty: true
      outcome: rejected-record
      quarantine_reason: "field-count-below-header"
      column_count: 4
      data_rows: 4
      rejected_rows: 2

  # Rows with MORE fields than the header. Truncating them discards data that
  # arrived; SCHEMA-05 says drift is reported, never silently adapted to, so the
  # extra fields are evidence of an upstream schema change and belong in the
  # rejection record rather than on the floor.
  - name: "16_extra_columns.csv"
    covers: [VALID-01, VALID-03, SCHEMA-05]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n1,Kowalski,1234.56\n2,Nowak,2345.67,extra\n3,Wiśniewski,3456.78,extra,more\n4,Wójcik,4567.89\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      header_field_count: 3
      field_count_by_row_index: { 0: 3, 1: 3, 2: 4, 3: 5, 4: 3 }
      long_row_indices: [2, 3]
      rows_must_not_be_truncated: true
      surplus_values_are_evidence_of_drift_not_noise: true
      outcome: rejected-record
      quarantine_reason: "field-count-above-header"
      column_count: 3
      data_rows: 4
      rejected_rows: 2

  # Three different malformations in one file, and one deliberate near-miss.
  # Row 2 carries a bare quote inside an unquoted field: it PARSES, it has the
  # right field count, and it is not a rejection (see 35). Rows 3 and 4 are the
  # real rejections. Without row 2 a reader could pass this fixture by
  # rejecting anything that looks unusual, which is the other way to lose data.
  - name: "17_malformed_rows.csv"
    covers: [VALID-01, VALID-03]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n1,Kowalski,1234.56\n2,Now"ak,2345.67\n3,Wiśniewski\n4,Wójcik,4567.89,extra\n5,Kamiński,5678.90\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      header_field_count: 3
      field_count_by_row_index: { 0: 3, 1: 3, 2: 3, 3: 2, 4: 4, 5: 3 }
      rows_that_parse_but_look_wrong: [2]
      rejected_row_indices: [3, 4]
      malformation_by_row_index:
        {
          2: "quote-in-unquoted-field (parsed, not rejected)",
          3: "field-count-below-header",
          4: "field-count-above-header",
        }
      no_row_is_repaired_padded_or_truncated: true
      every_rejected_row_carries_its_source_row_number: true
      parser_raises: false
      column_count: 3
      data_rows: 5
      accepted_rows: 3
      rejected_rows: 2

  # Byte-identical duplicate records inside one file. Both counts are declared
  # because the DIFFERENCE is what DEDUP-04 has to explain: three rows were
  # removed, and the audit trail must say which three and why. A `SELECT
  # DISTINCT` gives the right number and no explanation, which DEDUP-03
  # explicitly forbids.
  - name: "25_duplicate_rows.csv"
    covers: [DEDUP-01, DEDUP-04]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n000001,Kowalski,1234.56\n000002,Nowak,2345.67\n000001,Kowalski,1234.56\n000003,Wiśniewski,3456.78\n000002,Nowak,2345.67\n000001,Kowalski,1234.56\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      data_rows: 6
      distinct_rows: 3
      duplicate_rows_removed: 3
      duplicates_are_byte_identical: true
      occurrences_by_id: { "000001": 3, "000002": 2, "000003": 1 }
      first_occurrence_row_indices: [1, 2, 4]
      duplicate_row_indices: [3, 5, 6]
      deduplication_must_be_auditable: true
      removed_rows_are_recorded_not_discarded: true
      column_count: 3
      rejected_rows: 0

  # THE high-severity case: rows that are both too short AND too long in the
  # same file. Parsers commonly pad the short ones and truncate the long ones,
  # and both happen silently, so a file that is 66% damaged loads clean.
  #
  # The distinct field counts run 2 through 6 around a modal 4, with values on
  # both sides — a fixture that was only short, or only long, would let a reader
  # that repairs in one direction pass.
  - name: "33_ragged_rows.csv"
    covers: [VALID-01, VALID-03]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount,city\n1,Kowalski,1234.56,Warszawa\n2,Nowak,2345.67\n3,Wiśniewski,3456.78,Kraków,PL\n4,Wójcik\n5,Kamiński,5678.90,Gdańsk,PL,extra\n6,Zieliński,6789.01,Poznań\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      header_field_count: 4
      modal_field_count: 4
      field_count_by_row_index: { 0: 4, 1: 4, 2: 3, 3: 5, 4: 2, 5: 6, 6: 4 }
      distinct_field_counts: [2, 3, 4, 5, 6]
      short_row_indices: [2, 4]
      long_row_indices: [3, 5]
      raggedness_runs_in_both_directions_in_one_file: true
      short_rows_must_not_be_padded: true
      long_rows_must_not_be_truncated: true
      quarantine_reasons:
        ["field-count-below-header", "field-count-above-header"]
      severity: high
      column_count: 4
      data_rows: 6
      rejected_rows: 4

  # An opening quote at row 2 that is never closed, so it consumes every
  # remaining byte of the file into one field. The file has six physical lines
  # and parses to THREE records — that gap is the finding, and both numbers are
  # declared so a reader cannot report success on two rows and call it a day.
  #
  # The stdlib does NOT raise here (VERIFIED on CPython 3.12.3); it returns a
  # short, plausible-looking result. Silence is the failure mode.
  - name: "34_unclosed_quote_eof.csv"
    covers: [CSV-06, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n1,Kowalski,1234.56\n2,"Nowak,2345.67\n3,Wiśniewski,3456.78\n4,Wójcik,4567.89\n5,Kamiński,5678.90\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      physical_line_count: 6
      intended_data_rows: 5
      record_count_including_header: 3
      parsed_data_rows: 2
      rows_swallowed_by_the_open_quote: 4
      unclosed_quote_opens_at_row_index: 2
      record_count_is_far_below_line_count: true
      the_gap_between_the_two_counts_is_the_finding: true
      parser_raises: false
      outcome: rejected-file
      quarantine_reason: "unclosed-quote-at-eof"
      column_count: 3

  # Every row ends with the delimiter, so every row — the header included — has
  # a phantom fourth field that is always empty. It is not a first-row quirk:
  # dropping it must be a deliberate, declared decision, because the obvious
  # alternative is an off-by-one that also drops the last real column of the
  # next file.
  - name: "45_trailing_delimiter_every_row.csv"
    covers: [CSV-06, VALID-01]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount,\n1,Kowalski,1234.56,\n2,Nowak,2345.67,\n3,Wiśniewski,3456.78,\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      parsed_field_count: 4
      declared_columns: 3
      phantom_final_column_index: 3
      phantom_final_column_name: ""
      phantom_column_is_always_empty: true
      every_row_ends_with_the_delimiter: true
      affects_every_row_not_only_the_first: true
      field_count_by_row_index: { 0: 4, 1: 4, 2: 4, 3: 4 }
      resolution: "drop the phantom column deliberately, never by an off-by-one that also drops real data"
      data_rows: 3
      rejected_rows: 0

  # The last record has no terminator. It exists to prove the final record is
  # NOT dropped — the classic `for line in f: ...` loop keeps it, but a reader
  # that splits on the terminator and discards the last (empty) piece silently
  # loses one row per file, forever, in a way no count reconciles against
  # anything because the source count is wrong the same way.
  - name: "46_no_trailing_newline.csv"
    covers: [CSV-06, CSV-13]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n1,Kowalski,1234.56\n2,Nowak,2345.67\n3,Wiśniewski,3456.78'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      final_byte_is_a_line_terminator: false
      terminator_count: 3
      physical_line_count: 4
      record_count_including_header: 4
      final_record_must_not_be_dropped: true
      last_row_values: ["3", "Wiśniewski", "3456.78"]
      column_count: 3
      data_rows: 3
      rejected_rows: 0

  # Blank lines INSIDE the data, not only ahead of the header — the second case
  # is the one detectors miss, because a leading blank is part of the preamble
  # problem (12) and an interior blank is not. The stdlib yields an empty list
  # for each, which is neither a record nor an end-of-file, and row numbers must
  # still count physical lines so a rejection at row 5 can be found by a human
  # opening the file at line 5.
  - name: "47_blank_lines_interspersed.csv"
    covers: [CSV-08, CSV-13]
    generator: literal
    encoding: utf-8
    content: 'id,name,amount\n\n1,Kowalski,1234.56\n\n2,Nowak,2345.67\n3,Wiśniewski,3456.78\n\n4,Wójcik,4567.89\n'
    expect:
      detected_delimiter: ","
      header_row_index: 0
      physical_line_count: 8
      blank_line_indices: [1, 3, 6]
      blank_lines_appear_inside_the_data_not_only_before_the_header: true
      stdlib_yields_an_empty_list_for_a_blank_line: true
      blank_lines_must_not_be_loaded_as_empty_records: true
      blank_lines_must_not_terminate_the_file: true
      row_numbers_must_still_reference_physical_lines: true
      column_count: 3
      data_rows: 4
      rejected_rows: 0

  # Wider than a thousand columns, and only two rows deep so generation stays
  # cheap. The width is what is being tested: readers that build a per-column
  # structure per row, and databases with their own ceilings, both change
  # behaviour here. PostgreSQL's limit is 1 600 columns, so 1 024 is DELIBERATELY
  # under it — the database will accept this table, which means any failure
  # belongs to the reader and cannot be blamed on the target.
  #
  # Most fields are empty, because a wide export is mostly empty in practice and
  # because it keeps the declaration reviewable. The first and last value of
  # each row are named, so an off-by-one at either edge is visible.
  #
  # The content is written as a block scalar rather than the single-quoted form
  # used above: it is pure ASCII with no backslash and no quote, so there is
  # nothing for the loader's escape resolution to change, and each record gets
  # its own line instead of one 7 kB string.
