# The seven D-13/Phase-7 namespaces, owned by this manifest ALONE. No Helm
# release in this repository may pass --create-namespace: two releases must
# never manage the same Kubernetes object (a Phase 2 truth this plan's
# must_haves assert).
#
# cnpg-system    the CloudNativePG operator
# data           both CNPG Cluster CRs + MinIO
# airflow        the Airflow chart's components
# etl            task pods and KubernetesPodOperator pods (empty until Phase 4;
#                created now so the Phase 5 Vault role for
#                system:serviceaccount:etl:<name> is never widened after the
#                fact to cover a namespace invented later)
# ingress-nginx  the ingress controller
# vault          the Vault server, reached by every other namespace's
#                workloads over ClusterIP DNS
#                (vault.vault.svc.cluster.local:8200), never via ingress
# monitoring     the Observability tier — OTel Collector, Tempo,
#                kube-prometheus-stack (Grafana + Prometheus); infrastructure-
#                only, holds no data-correctness state (ROADMAP Phase 7
#                framing)
# kyverno        the cluster-wide admission controller (D-14/D-17, plan
#                11-03) enforcing kubernetes/kyverno-policy.yaml's cosign
#                signature policy on every pod, every namespace
apiVersion: v1
kind: Namespace
metadata:
  name: cnpg-system
---
apiVersion: v1
kind: Namespace
metadata:
  name: data
---
apiVersion: v1
kind: Namespace
metadata:
  name: airflow
---
apiVersion: v1
kind: Namespace
metadata:
  name: etl
---
apiVersion: v1
kind: Namespace
metadata:
  name: ingress-nginx
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
---
apiVersion: v1
kind: Namespace
metadata:
  name: kyverno
