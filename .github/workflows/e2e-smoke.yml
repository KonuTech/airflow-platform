# Phase 11 plan 11-04 (CICD-09, D-19/D-20): the PR-gating fast smoke subset.
# Spins up its own ephemeral kind cluster inside GitHub Actions on every pull
# request and runs the D-20 4-point proof (via `make smoke-verify`) against
# the PR's OWN just-published `pr-<number>` images — not main's last merge
# build (11-RESEARCH.md Pitfall 5). The full local E2E suite (`make
# cluster-verify`, covering the 2-year sweep and observability) stays
# reserved for `e2e-full.yml`, gated to merge only (plan 11-05).
name: E2E smoke (PR)

on:
  pull_request:

# Least privilege at the workflow level, matching ci.yml/publish.yml's own
# floor — this job never publishes anything and never needs to widen this.
# GHCR images `publish.yml` already produced are public, so no `packages:`
# permission is needed to pull them.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.3"

jobs:
  smoke:
    name: Ephemeral-kind fast smoke subset (D-20)
    runs-on: ubuntu-latest
    # Cluster boot + a handful of targeted checks (4 D-20 points), materially
    # faster than cluster-verify's full local suite — measured starting
    # ceiling, not a guess dressed as a fact (mirrors publish.yml's own
    # per-matrix-leg timeout comment).
    timeout-minutes: 30
    # A pull_request from a FORK never receives a published `pr-<number>`
    # image at all (publish.yml's own fork guard — GitHub never grants
    # `packages: write` on fork-originated pull_request runs). Guarding here
    # explicitly means a fork PR's smoke run is a clean, understood skip,
    # not a confusing cluster-up against an image that was never published.
    if: github.event.pull_request.head.repo.full_name == github.repository
    # Live-verified (plan 11-04 Task 3, bisected against 10 throwaway pushes):
    # referencing `secrets.*` directly inside a step's own `if:` conditional
    # makes GitHub's own workflow parser reject this file at PARSE time —
    # zero jobs, a generic "likely failed because of a workflow file issue"
    # push-triggered failure, and the workflow never registers for
    # `pull_request` at all. The safe pattern (also live-confirmed) is to
    # mirror the secret into a job-level `env:` var first, then gate the
    # step on `env.*` instead — `secrets.*` stays fine to reference directly
    # inside a step's `with:` block (also confirmed in the same bisection),
    # only the `if:` position is affected.
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      # `cluster`-group only (boto3/psycopg): this job never runs `make
      # check`'s offline gate, only cluster-dependent targets.
      - run: make install-cluster

      # D-21: raises the runner's Docker Hub pull-rate limit for the
      # upstream chart images `make cluster-up` pulls (Airflow, MinIO,
      # Vault, Kyverno, CNPG, ingress-nginx). Conditioned on the repo
      # secret being configured at all — never a hard requirement, and
      # never a failure when absent (this plan's own `user_setup` note).
      - name: Docker Hub login (optional, raises anonymous pull-rate limit)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # kind and helm are installed by `scripts/cluster-up.sh` itself (its
      # own first two lines, tools/k8s/install_{kind,helm}.sh) — no separate
      # install step here, matching D-09's single-entry-point convention
      # ("no manual kind surgery" outside cluster-up.sh). kubectl needs no
      # install at all: `actions/runner-images`' own Ubuntu 24.04 image ships
      # kubectl 1.36.3 pre-installed, within the one-minor version-skew
      # `scripts/doctor.sh` already requires against this project's pinned
      # Kubernetes 1.35.5 node image (the same skew this project's own local
      # host, kubectl 1.36.1, already runs under).
      - name: Point cluster-up at this PR's own GHCR Airflow image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "AIRFLOW_IMAGE_OVERRIDE_REPO=ghcr.io/${owner}/airflow" >> "$GITHUB_ENV"
          echo "AIRFLOW_IMAGE_OVERRIDE_TAG=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      # scripts/doctor.sh's own preflight floors (DOCTOR_MIN_CPUS=8,
      # DOCTOR_MIN_MEM_GB=20) are calibrated for the documented LOCAL WSL2
      # dev floor (docs/wsl/wslconfig.example), not this project's own
      # already-documented CI runner sizing (CLAUDE.md: "GitHub-hosted
      # runners are 4 CPU / 16 GB"). Live-measured on this exact runner
      # (plan 11-04 Task 3): 4 CPUs, ~15GiB. Both floors are explicitly
      # documented as overridable via env vars in scripts/doctor.sh's own
      # header comment ("lower DOCTOR_MIN_CPUS only if you accept a smaller
      # cluster") — set here, not edited in doctor.sh itself, since this is
      # this workflow's own CI-specific environment, not a change to the
      # local-dev default.
      - name: Bring up the ephemeral kind cluster (CI profile)
        env:
          DOCTOR_MIN_CPUS: "4"
          DOCTOR_MIN_MEM_GB: "14"
        run: PROFILE=ci make cluster-up

      - name: Point csv_processor_image/dbt_image at this PR's own GHCR images
        run: scripts/ci-set-workload-images.sh pr-${{ github.event.pull_request.number }}

      # Post-merge fix (CICD-09 follow-up): a fresh ephemeral cluster's
      # analytical DB has only CNPG's own `initdb.postInitApplicationSQL`
      # roles (etl_app) -- `dbt_app` (and every staging/silver GRANT) is
      # created by Alembic migrations (migrations/versions/0021_dbt_app_role_
      # staging_silver_grants.py onward), never run automatically by
      # `make cluster-up`. `make migrate-analytics` is this project's own
      # established runbook step for this (Makefile's own header comment).
      # Must run BEFORE vault-bootstrap below: vault-bootstrap.py's
      # `_ensure_dbt_secret` execs `ALTER ROLE dbt_app ...` against the live
      # DB the first time it provisions the `etl/dbt-db` KV secret, and
      # live-diagnosed (this session) failing with `role "dbt_app" does not
      # exist` when migrations have never run.
      - name: Run analytical DB migrations
        run: make migrate-analytics

      # Post-merge fix (CICD-09 follow-up): scripts/vault-bootstrap.py's
      # `_ensure_grafana_secrets` deliberately NEVER invents or guesses a
      # real alerting destination for `.secrets/grafana-webhook-url` (that
      # file is an operator-provided, gitignored local-dev convenience --
      # 07-06-PLAN.md's own `user_setup` step, consistent with CLAUDE.md's
      # "no credential may exist in Git ... runtime injection only"). A
      # genuinely fresh ephemeral CI checkout never has this file, and
      # live-diagnosed (this session) `make vault-bootstrap` hard-fails
      # without it. D-20's own 4-point smoke scope (Helm releases healthy,
      # one DAG run SUCCEEDED, Vault positive/negative, Kyverno
      # positive/negative) never exercises Grafana alerting at all, so a
      # synthetic, non-functional placeholder URL is sufficient here -- CI
      # never fires a real alert through it, matching this repository's own
      # synthetic-fixture convention (CLAUDE.md: "No secrets in fixtures").
      - name: Provide a placeholder Grafana alert webhook (CI has no real one)
        run: |
          mkdir -p .secrets
          echo "https://example.invalid/ci-placeholder-grafana-webhook" > .secrets/grafana-webhook-url

      # Post-merge fix (CICD-09 follow-up): `make cluster-up` deliberately
      # leaves Vault sealed and un-bootstrapped -- scripts/stages/80-vault.sh's
      # own header comment documents this as two separate, scripted steps a
      # developer runs by hand afterward (D-02, plan 05-01 Task 2). This was
      # never wired into e2e-smoke.yml at all, so `make smoke-verify`'s own
      # [1/4] "every Deployment/StatefulSet Ready" check was live-diagnosed
      # (this session) failing on vault/StatefulSet/vault (expected sealed,
      # not a real failure) AND monitoring/Deployment/monitoring-grafana
      # (blocked on the grafana-alert-webhook Secret that ONLY
      # `make vault-bootstrap` creates, per scripts/stages/85-monitoring.sh's
      # own header comment) -- neither is a resource-sizing or timing issue;
      # both are this project's own documented, intentional bootstrap-order
      # requirement that this workflow simply never satisfied.
      - name: Unseal and bootstrap Vault
        run: |
          make vault-unseal
          make vault-bootstrap
          . scripts/wait-for.sh
          KUBECTL_CONTEXT=kind-airflow-platform wait_for_statefulset_ready vault vault

      # Post-merge fix (CICD-09 follow-up, superseded): monitoring is no
      # longer installed live in CI at all (scripts/stages/85-monitoring.sh
      # now skips itself on PROFILE=ci -- see that file's own header comment
      # for the full CPU-starvation live diagnosis this session found). No
      # Grafana Deployment exists to restart, so the earlier "rollout
      # restart" step this comment used to describe is removed rather than
      # guarded -- there is nothing for it to do in CI anymore.

      # The D-20 4-point proof, composed as one Make target so a developer
      # and this workflow invoke the exact same gate (Makefile's own
      # `smoke-verify` docstring).
      - name: Run the D-20 fast smoke subset (make smoke-verify)
        run: make smoke-verify
