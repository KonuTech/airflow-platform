# The first real vertical slice of Phase 11's CI/CD track: one image
# (csv-processor), built, published to GHCR tagged by git SHA, SBOM/
# provenance-attested, cosign-signed and trivy-scanned, on every merge to
# main. Deliberately narrow (one image, one trigger) so the mechanism is
# proven end to end before plan 11-02 generalizes it to three images and a
# PR-tag variant (D-09).
name: Publish images

# D-02: this workflow triggers only on push to main, publishing an image
# tagged with the exact git SHA of the triggering commit — README §78's
# merge-build-tag-push flow. No `pull_request:` trigger here; PR
# build-verify-without-push is plan 11-02's D-09 work, not this plan's.
#
# D-06: a separate workflow file from ci.yml, with its own push trigger and
# no `needs:` on any ci.yml job — the build, publish and scan job runs
# independently and in parallel with ci.yml's check/manifests/integration/
# secrets jobs, never gated on `make check` passing first.
on:
  push:
    branches: [main]

# Least privilege at the workflow level, matching ci.yml's floor. The job
# below widens this, scoped to itself only (see its own `permissions:`).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  publish-csv-processor:
    name: Build, sign and scan csv-processor
    runs-on: ubuntu-latest
    # Build + SBOM + sign + scan is heavier than ci.yml's lint/typecheck
    # jobs; 20 minutes is a measured-once starting ceiling, not a guess
    # dressed as a fact.
    timeout-minutes: 20
    # T-11-03: the first job in this repository to widen permissions past
    # `contents: read` — `packages: write` to push to GHCR, `id-token:
    # write` for cosign's keyless GitHub-OIDC signing flow (D-13). Scoped to
    # this job only; the workflow-level floor above stays `contents: read`,
    # and the ephemeral GITHUB_TOKEN this grants is auto-revoked at job end.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      # Actions are pinned by commit SHA, not tag: a tag is mutable and can
      # be repointed at malicious code, a SHA cannot. Every SHA below was
      # resolved live via `git ls-remote --tags <repo> refs/tags/<version>`
      # at execution time, never hand-written from memory.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          # D-04: no new secret needed — GHCR authenticates against the
          # ephemeral, job-scoped GITHUB_TOKEN above, and the published
          # package inherits this public repository's visibility.

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/csv-processor/Dockerfile
          push: true
          # Tagged by the exact, full 40-character git SHA of the
          # triggering commit — never `:latest`, never the short-SHA form
          # `make image-csv-processor` uses for local dev (D-05: amd64-only,
          # no multi-platform/QEMU buildx configuration).
          tags: ghcr.io/${{ github.repository_owner }}/csv-processor:${{ github.sha }}
          # D-13: buildx-native SBOM (Syft-backed) and provenance
          # attestations, produced by the build itself — not a separate
          # manual step.
          provenance: true
          sbom: true
          # Same build-arg name the Makefile's image-csv-processor target
          # passes (docker/csv-processor/Dockerfile's `ARG GIT_SHA`), but
          # with the full SHA `github.sha` provides — the canonical form —
          # not the short form the Makefile target uses for local dev. The
          # image tag above and this build-arg must both use the same full
          # SHA for this workflow's own runs.
          build-args: GIT_SHA=${{ github.sha }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin cosign itself to >= 3.1.3 (fixes GHSA-fx35-mq7g-6g98, a
          # verification-bypass CVE in legacy bundle handling).
          cosign-release: "v3.1.3"

      # D-13: cosign keyless (GitHub OIDC) signing, no key management
      # required. Sign by DIGEST (the build step's own output), never by
      # tag, so the signature is bound to immutable content — a tag can be
      # repointed after signing, a digest cannot.
      #
      # No legacy "experimental keyless" opt-in env var is set anywhere in
      # this workflow: it has been vestigial since cosign v2, keyless is
      # already the default (11-RESEARCH.md Pitfall 10 — many tutorials
      # still show it). A policy test enforces this workflow never
      # reintroduces that variable by its literal name.
      - name: cosign sign the published digest
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/csv-processor@${{ steps.build.outputs.digest }}

      # D-07: if this step's first real run finds a pre-existing unfixed
      # HIGH/CRITICAL finding in a base image, add a dated, justified
      # .trivyignore entry AT THAT TIME — do not pre-seed .trivyignore
      # speculatively before a real finding exists.
      - uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/csv-processor:${{ github.sha }}
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true
