# The workflow name is load-bearing, not cosmetic: plan 01-09 selects this
# workflow by the exact string "CI" when it reads a run conclusion for the
# branch-protection rule. A workflow left unnamed is addressed by its file path
# instead, and that read would fail for a reason unrelated to the gate.
name: CI

# `pull_request`, never `pull_request_target`: the target variant runs in the
# context of the base repository and would expose repository secrets to a fork.
on:
  pull_request:
  push:
    branches: [main]

# Least privilege at the workflow level; no job widens it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.3"
  # Consumed by the `Secret scan (full history)` job below and read by
  # tools/security/install_gitleaks.sh, so the workflow and a developer machine
  # install the identical, checksum-verified binary.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  check:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Actions are pinned by commit SHA, not tag: a tag is mutable and can be
      # repointed at malicious code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: make install
      # The only substantive step. No linter, type checker, test runner or
      # import checker may be invoked directly from this file — the Makefile is
      # the single definition of the gate, and plan 01-05 adds the policy test
      # that enforces it.
      - run: make check
      # CICD-05/D-23: report coverage without gating on it. `make check`'s own
      # `test` target already ran pytest with `--cov` (pyproject.toml's
      # [tool.coverage.run] scopes to dataplat/csv_processor); this step only
      # reports the data that step already collected, via two different
      # surfaces — no coverage is re-measured here, and no percentage-based
      # exit-code gate is introduced (pyproject.toml's [tool.coverage.report]
      # deliberately declares no minimum: "a threshold over a tree that is
      # mostly configuration is a number people game").
      - name: Coverage report
        run: |
          uv run coverage html
          echo "## Coverage Report" >> "$GITHUB_STEP_SUMMARY"
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage HTML artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-html
          path: htmlcov/

  # CICD-07 / INFRA-10. Offline of any cluster (D-12): `helm template` both
  # values profiles for all five pinned charts, `kubeconform -strict` against
  # the pinned Kubernetes version, `helm lint` against every profile's values
  # file, then the non-vacuity proof that the gate actually discriminates
  # (tests/policy/test_manifest_validation_fails_closed.py). Needs the
  # network (pinned chart tarballs), which is why it is a separate job from
  # `check` rather than folded into it — `check` stays runnable on a clone
  # with no network reachable (ROADMAP criterion 4).
  # `make install` is needed because `manifest-policy`'s pytest step (plan
  # 02-07 Task 3) runs through `uv run --frozen`, same as `manifests` itself.
  # `manifest-policy`'s own `manifests` prerequisite covers everything Task 2
  # needed this job to do; `chain(manifest-policy)` in
  # tests/policy/test_ci_calls_make_ci.py covers both `manifests` and
  # `helm-lint`.
  manifests:
    name: Manifest validation (offline of any cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: make install
      - run: make manifest-policy

  # META-01 / META-02 (and, once later Phase-3 plans land, every other
  # phase requirement tests/integration/ proves). Runs `alembic upgrade
  # head` and the dataplat test suite against throwaway testcontainers
  # PostgreSQL/MinIO — no live Kubernetes cluster involved, unlike the
  # `manifests` job above or `cluster-verify` (which stays unreachable from
  # both `check` and `ci`, D-16). Docker is available by default on
  # ubuntu-latest runners, so no docker:dind service is needed. A separate
  # job from `check` for the same reason `manifest-policy` is: Docker/
  # testcontainers is a dependency `check` must never need (D-04), not a
  # gate this project exempts from CI.
  integration:
    name: Integration tests (testcontainers, offline of any cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: make install
      - run: make test-integration

  # CICD-05 (closing a pre-existing gap, not new scope): `tests/dagtest` has
  # existed since Phase 8 (dag.test() proof of DAG-level backfill mechanics
  # against a real, testcontainers-provided Airflow metadata DB) but was
  # never wired into continuous CI until now — every DAG-mechanics test in
  # this tier ran only when a developer happened to invoke it locally. This
  # phase's own new dagtest module (plan 11-08, platform_retention) makes
  # that gap concrete: without this job it would ship with zero continuous
  # coverage from day one, the same blind spot this job now closes for the
  # whole tier at once. Structurally identical to `integration` above
  # (offline of any live cluster, needs only a local Docker daemon for its
  # own throwaway testcontainers PostgreSQL).
  dagtest:
    name: dag.test() suite (testcontainers, offline of any cluster)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: make install
      - run: make test-dagtest

  # SEC-02 / SEC-11. This job holds the claim that no credential has ever been
  # committed to this repository, which is the claim that has to be true before
  # the repository becomes public: once it is, any credential in any reachable
  # commit is world-readable and rotation is the only remedy.
  #
  # SEC-10, stated honestly: the general form — "no CI job ever echoes a secret"
  # — is undecidable once a job interpolates one, because a `curl -v` with a
  # bearer header leaks through verbose output and matches no grep. What IS
  # decidable, and is what this phase claims, is the stronger structural fact
  # that this workflow references no repository secret at all. `grep -Ec
  # 'secrets\.' .github/workflows/ci.yml` is 0 and plan 01-05 keeps it there.
  # The first job to interpolate a secret (Phase 11, publishing images) owes a
  # re-audit of that claim — it cannot simply inherit this one.
  secrets:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    # Measured at ~150 ms over this repository's history. The generous ceiling
    # is for runner and download variance, not for the scan.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Load-bearing. actions/checkout defaults to depth 1, and
          # `gitleaks git --log-opts="--all"` over a depth-1 checkout examines a
          # single commit and reports "no leaks found" — a green build that
          # proves nothing. Verified by execution: a depth-1 checkout logs
          # "1 commits scanned". gitleaks prints that count on every run, so a
          # future regression here is visible in the job log, and plan 01-05's
          # test_supply_chain_guards.py fails the build if this line disappears.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # The self-test runs through `uv run --frozen`, so this job needs the
      # locked environment just as the quality gate does.
      - run: make install
      # Downloads the pinned binary and verifies its published SHA-256 before
      # extracting it, failing closed on mismatch (T-01-09). The binary lands in
      # the gitignored tools/bin/ and is never committed.
      - run: tools/security/install_gitleaks.sh
      # Both scans run through the Makefile — never a direct scanner invocation
      # — so the gate CI enforces and the gate a developer runs cannot drift.
      # --redact lives inside the target, so a finding never reaches this log
      # with its value intact.
      #
      # The full-history scan runs on every pull request. That is affordable on
      # a public repository with unmetered Actions minutes, and it degrades
      # gradually and visibly rather than suddenly. If this job ever exceeds
      # roughly a minute, the remedy is to scan only the pull-request diff range
      # on PRs and keep the all-refs scan on `main` plus a schedule. Do not
      # implement that split pre-emptively — the diff-range form cannot prove
      # criterion 5 on its own.
      - run: make gitleaks
      # SEC-11: proves the scanner is live rather than merely configured, by
      # watching it exit 1 on a disposable repository. Nothing is written to
      # this repository's history.
      - run: make gitleaks-selftest
