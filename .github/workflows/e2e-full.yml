# Phase 11 plan 11-05 (CICD-09, D-19/D-24/D-27/D-30): the merge-triggered full
# E2E suite. Runs the existing local cluster/slice(incl. 2-year sweep)/
# observability suite -- staggered since quick task 260824-ayw into
# `cluster-slice-verify` followed by `observability-verify-ci` (see those
# steps below for why) -- then `make rebuild-from-raw` as the very next step
# on the SAME already-populated cluster (D-30 — no data-seeding between
# them), reusing that suite's own multi-dataset history as
# rebuild-from-raw's pre-drop baseline. Runs entirely independently of
# `e2e-chaos.yml` (D-27 — two separate GitHub-hosted runners, no `needs:`
# coupling, both triggered by the identical push-to-main event).
name: E2E full (merge)

on:
  push:
    branches: [main]

# Least privilege at the workflow level; `issues: write` is granted only at
# the job level below, scoped to the D-22 failure-notification step.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  UV_VERSION: "0.12.3"

jobs:
  e2e-full:
    name: Full local E2E suite + rebuild-from-raw capstone
    runs-on: ubuntu-latest
    # 11-RESEARCH.md Pitfall 9: tests/e2e/observability alone measured ~8min
    # on an ALREADY-WARM cluster (STATE.md's own resolved-incident log). This
    # job additionally runs cluster+slice (incl. the 2-year sweep), kind
    # boot, 6+ Helm installs, AND a second full historical reprocessing pass
    # for rebuild-from-raw. 120 was the documented starting ceiling; raised
    # to 150 (debug/ci-pipeline-ingestion-timeout ROUND 14, user-chosen
    # Option C), then to 190 (ROUND 15, user-chosen Option B) from MEASURED
    # arithmetic, not a guess: ROUND 14's live run decomposed to a
    # green-suite projection of ~158-188min (setup 8 + cluster 0.5 + sweep
    # ~75-80 + 10 post-sweep singles ~45-60 + observability/capstone 25-40)
    # once finding (20)'s 9 stage-crash failures are fixed -- 150 did not
    # hold even green; 190 covers the projection's upper bound.
    timeout-minutes: 190
    permissions:
      contents: read
      issues: write
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - run: make install-cluster

      # D-21: raises the runner's Docker Hub pull-rate limit for the
      # upstream chart images `make cluster-up` pulls. Never a hard
      # requirement; never a failure when the secret is unconfigured.
      - name: Docker Hub login (optional, raises anonymous pull-rate limit)
        if: ${{ env.DOCKERHUB_USERNAME != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # publish.yml (triggered by the same push-to-main event) tags every
      # image with the full `github.sha` on `push` (confirmed by reading
      # publish.yml's own tag-selection step) — mirrors e2e-smoke.yml's
      # identical pr-<number> override, substituting the SHA tag scheme
      # `push` actually uses.
      - name: Point cluster-up at this commit's own GHCR Airflow image
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "AIRFLOW_IMAGE_OVERRIDE_REPO=ghcr.io/${owner}/airflow" >> "$GITHUB_ENV"
          echo "AIRFLOW_IMAGE_OVERRIDE_TAG=${{ github.sha }}" >> "$GITHUB_ENV"

      # scripts/doctor.sh's local-WSL2 floors (8 CPU/20GiB) need the same
      # CI-specific override e2e-smoke.yml already established (this
      # project's own documented CI runner sizing: 4 CPU/16GB).
      - name: Bring up the ephemeral kind cluster (CI profile)
        env:
          DOCTOR_MIN_CPUS: "4"
          DOCTOR_MIN_MEM_GB: "14"
        run: PROFILE=ci make cluster-up

      # THROWAWAY DIAGNOSTIC (debug session ci-pipeline-ingestion-timeout,
      # REOPENED ROUND 2 -- sustained multi-DAG load hypothesis). NEVER to be
      # merged as a permanent workflow change; reverted in a follow-up commit
      # once this round's live evidence is collected. This workflow has no
      # `pull_request` trigger (push-to-main only), so the "throwaway PR"
      # pattern already used twice this session for e2e-smoke.yml does not
      # apply here -- this mirrors the session's own established alternative
      # for push-only workflows instead: push a temporary evidence-gathering
      # commit directly to main. Polls BOTH control-plane pods' cgroup
      # memory.current/pids.current + K8s-reported restartCount/phase every
      # 15s, starting immediately after cluster-up (both production DAGs run
      # on a 1-minute schedule regardless of which pytest step is currently
      # executing, so real LocalExecutor task load begins the moment
      # cluster-up finishes -- not just once cluster-slice-verify starts) --
      # a full time-series growth curve, not a single end-of-run snapshot,
      # to directly test whether memory grows unboundedly under sustained
      # load (this round's leading hypothesis) versus some other mechanism.
      - name: "DEBUG: start background control-plane resource monitor"
        run: |
          cat > /tmp/cp-monitor.sh <<'MONITOR_EOF'
          #!/usr/bin/env bash
          set -u
          LOG=/tmp/cp-monitor.csv
          ALLPODS_LOG=/tmp/cp-monitor-allpods.log
          NS=airflow
          # ROUND 10 (debug/ci-pipeline-ingestion-timeout): etl-namespace pod/event capture --
          # root cause (14)'s HONEST GAP was that no FailedScheduling/Pending evidence was ever
          # captured directly (events had expired by the end-of-run dump; this monitor only ever
          # watched the airflow namespace). Periodic capture inside this same loop closes it:
          # Kubernetes events expire (~1h TTL), so only a rolling capture can produce a
          # trustworthy FailedScheduling census for the whole run.
          ETL_LOG=/tmp/etl-monitor.log
          echo "ts_utc,role,pod,phase,restarts,mem_current_bytes,pids_current" > "$LOG"
          : > "$ALLPODS_LOG"
          : > "$ETL_LOG"
          i=0
          while [ "$i" -lt 600 ]; do
            ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)
            # ROUND 5 (debug/ci-pipeline-ingestion-timeout): added triggerer -- never once
            # monitored in this entire debug session despite wait_for_files (S3KeySensor,
            # deferrable=True) depending on it being alive/responsive to ever wake a deferred
            # task. Cheap addition to the same existing loop; closes a real blind spot.
            for role in scheduler dag-processor triggerer; do
              pod=$(kubectl -n "$NS" get pods -l component="$role" -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
              if [ -z "$pod" ]; then
                echo "$ts,$role,NA,NoPodFound,NA,NA,NA" >> "$LOG"
                continue
              fi
              phase=$(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.status.phase}' 2>/dev/null)
              [ -z "$phase" ] && phase=NA
              restarts=$(kubectl -n "$NS" get pod "$pod" -o jsonpath="{.status.containerStatuses[?(@.name=='$role')].restartCount}" 2>/dev/null)
              [ -z "$restarts" ] && restarts=$(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.status.containerStatuses[0].restartCount}' 2>/dev/null)
              [ -z "$restarts" ] && restarts=NA
              container=$(kubectl -n "$NS" get pod "$pod" -o jsonpath="{.spec.containers[?(@.name=='$role')].name}" 2>/dev/null)
              [ -z "$container" ] && container=$(kubectl -n "$NS" get pod "$pod" -o jsonpath='{.spec.containers[0].name}' 2>/dev/null)
              mem=$(kubectl -n "$NS" exec "$pod" -c "$container" -- cat /sys/fs/cgroup/memory.current 2>/dev/null)
              [ -z "$mem" ] && mem=NA
              pids=$(kubectl -n "$NS" exec "$pod" -c "$container" -- cat /sys/fs/cgroup/pids.current 2>/dev/null)
              [ -z "$pids" ] && pids=NA
              echo "$ts,$role,$pod,$phase,$restarts,$mem,$pids" >> "$LOG"
            done
            {
              echo "== $ts =="
              kubectl -n "$NS" get pods -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[*].ready,RESTARTS:.status.containerStatuses[*].restartCount,STATUS:.status.phase --no-headers 2>/dev/null
            } >> "$ALLPODS_LOG"
            {
              echo "== $ts =="
              echo "-- etl pods --"
              kubectl -n etl get pods -o custom-columns=NAME:.metadata.name,STATUS:.status.phase,NODE:.spec.nodeName --no-headers 2>/dev/null
              echo "-- etl events (FailedScheduling / scheduling-related) --"
              kubectl -n etl get events --sort-by=.lastTimestamp --no-headers 2>/dev/null | grep -iE "FailedScheduling|Insufficient|Preempt|TriggeredScaleUp|FailedCreate" | tail -20
            } >> "$ETL_LOG"
            i=$((i+1))
            sleep 15
          done
          MONITOR_EOF
          chmod +x /tmp/cp-monitor.sh
          nohup /tmp/cp-monitor.sh > /tmp/cp-monitor-stdout.log 2>&1 < /dev/null &
          disown || true
          echo "Started control-plane monitor, PID $!"

      - name: Point csv_processor_image/dbt_image at this commit's own GHCR images
        run: scripts/ci-set-workload-images.sh ${{ github.sha }}

      # Same bootstrap-order requirement e2e-smoke.yml already established
      # live (plan 11-04's CI-portability follow-up): dbt_app (and every
      # staging/silver GRANT) only exists after Alembic migrations run, and
      # vault-bootstrap's `_ensure_dbt_secret` needs that role to already
      # exist.
      - name: Run analytical DB migrations
        run: make migrate-analytics

      # Same as e2e-smoke.yml: a genuinely fresh ephemeral checkout never
      # has the operator-provided, gitignored `.secrets/grafana-webhook-url`
      # local-dev convenience file. This suite's own D-19 scope does not
      # exercise Grafana alerting, so a synthetic placeholder is sufficient.
      - name: Provide a placeholder Grafana alert webhook (CI has no real one)
        run: |
          mkdir -p .secrets
          echo "https://example.invalid/ci-placeholder-grafana-webhook" > .secrets/grafana-webhook-url

      - name: Unseal and bootstrap Vault
        run: |
          make vault-unseal
          make vault-bootstrap
          . scripts/wait-for.sh
          KUBECTL_CONTEXT=kind-airflow-platform wait_for_statefulset_ready vault vault

      # Quick task 260824-ayw: the former single combined verify step is now
      # staggered into two steps, per CONTEXT.md's locked decision --
      # tests/e2e/cluster/tests/e2e/slice (unchanged D-19 local suite, minus
      # observability) run first, then monitoring is installed only for the
      # tests/e2e/observability window and torn down again before
      # rebuild-from-raw runs, to keep the trimmed monitoring stack's own
      # CPU footprint off the node for the rest of this ~120-minute job.
      # The shared `cluster-verify` Makefile target itself (used identically
      # by local devs) is untouched -- this staggering is CI-workflow-specific
      # orchestration only.
      - name: Run cluster + slice E2E suite (observability deferred, staggered below)
        run: make cluster-slice-verify

      # THROWAWAY DIAGNOSTIC, paired with the monitor-start step above --
      # same never-to-be-merged scope. `if: always()` so this survives
      # cluster-slice-verify's own failure/timeout (the actual scenario this
      # round needs data from). Dumps the full time series plus a final
      # snapshot using the SAME `kubectl describe pod -l component=X`
      # pattern already live-proven twice this session (throwaway PR #14).
      - name: "DEBUG: dump control-plane resource monitor + final diagnostics"
        if: always()
        run: |
          pkill -f cp-monitor.sh || true
          echo "===== cp-monitor.csv (full time series, ts_utc,role,pod,phase,restarts,mem_current_bytes,pids_current) ====="
          cat /tmp/cp-monitor.csv || echo "no monitor log found"
          echo "===== per-role peak memory / peak pids across the whole run ====="
          awk -F, 'NR>1 && $6!="NA" {if($6+0>max[$2]) max[$2]=$6+0} NR>1 && $7!="NA" {if($7+0>maxp[$2]) maxp[$2]=$7+0} END {for (r in max) printf "%s: peak_mem_bytes=%d peak_pids=%d\n", r, max[r], maxp[r]}' /tmp/cp-monitor.csv || true
          echo "===== restart-count timeline (rows where restarts changed since the previous sample for that role) ====="
          awk -F, 'NR==1{next} {if (($2 in prev) && prev[$2]!=$5) print; prev[$2]=$5}' /tmp/cp-monitor.csv || true
          echo "===== cp-monitor-allpods.log (all airflow-namespace pods, every poll) ====="
          tail -400 /tmp/cp-monitor-allpods.log || echo "no allpods log found"
          echo "===== final kubectl get pods -o wide ====="
          kubectl -n airflow get pods -o wide || true
          echo "===== final kubectl describe pod -l component=scheduler ====="
          kubectl -n airflow describe pod -l component=scheduler || true
          echo "===== final kubectl describe pod -l component=dag-processor ====="
          kubectl -n airflow describe pod -l component=dag-processor || true
          echo "===== kubectl get events -n airflow (last 150, sorted) ====="
          kubectl -n airflow get events --sort-by=.lastTimestamp | tail -150 || true
          echo "===== kubectl describe node ====="
          kubectl describe node || true

          # ROUND 10 (debug/ci-pipeline-ingestion-timeout): etl-namespace FailedScheduling
          # census -- the direct evidence root cause (14) never had. The rolling capture
          # (etl-monitor.log, written by the background monitor above) is authoritative
          # because events expire; the live queries below are the end-of-run snapshot.
          echo "===== ROUND 10: etl-monitor.log (rolling etl pods + scheduling events, full run) ====="
          cat /tmp/etl-monitor.log || echo "no etl monitor log found"
          echo "===== ROUND 10: FailedScheduling census (unique event lines seen across the whole run) ====="
          grep -h "FailedScheduling" /tmp/etl-monitor.log 2>/dev/null | sort -u | tail -80 || echo "ZERO FailedScheduling lines captured"
          echo "===== ROUND 10: final etl-namespace pods ====="
          kubectl -n etl get pods -o wide || true
          echo "===== ROUND 10: final etl-namespace events (last 100, sorted) ====="
          kubectl -n etl get events --sort-by=.lastTimestamp | tail -100 || true
          echo "===== ROUND 10: effective stage_cpu_request Airflow Variable ====="
          kubectl -n airflow exec deploy/airflow-api-server -- airflow variables get stage_cpu_request 2>/dev/null || echo "stage_cpu_request NOT SET (DAGs fall back to 500m default)"

          # ROUND 5 (debug/ci-pipeline-ingestion-timeout): THROWAWAY diagnostics, never to be
          # merged -- same scope discipline as everything above. Rounds 1-4 fixed 3 genuinely
          # real scheduler/dag-processor restart mechanisms plus a DAG-pause test-fixture bug,
          # each live-verified, yet the exact same 17-test failure signature (dominated by
          # "meta.files has no row ... discovery never registered it") recurred byte-for-byte
          # across 6 consecutive live runs. Every prior diagnostic step captured only
          # scheduler/dag-processor pod-level health -- never csv_ingest_customers' own DagRun/
          # TaskInstance DB state, never the triggerer (which wait_for_files' deferrable
          # S3KeySensor depends on to ever wake up), never the raw bucket's own contents. These
          # queries read persistent DB rows / bucket object metadata (not ephemeral pod stdout),
          # so a single end-of-run snapshot reconstructs the full session's timeline for free --
          # no periodic polling needed for this part.
          echo "===== ROUND 5: csv_ingest_customers DagRun history (this whole session, dag_id-scoped) ====="
          kubectl -n airflow exec -i airflow-scheduler-0 -c scheduler -- python - <<'PYEOF' 2>&1 | grep -v "DeprecatedImportWarning\|py.warnings" || echo "DagRun history query failed"
          from airflow.utils.session import create_session
          from airflow.models import DagRun
          with create_session() as session:
              rows = session.query(DagRun).filter(DagRun.dag_id == "csv_ingest_customers").order_by(DagRun.id).all()
              print("TOTAL DagRuns:", len(rows))
              for dr in rows:
                  print(dr.run_id, "| type=", dr.run_type, "| state=", dr.state, "| backfill_id=", dr.backfill_id, "| start=", dr.start_date, "| end=", dr.end_date, "| logical_date=", dr.logical_date)
          PYEOF

          echo "===== ROUND 5: csv_ingest_customers key TaskInstance history (wait_for_files/discover/stage/integrity_gate/dbt_build/publish) ====="
          kubectl -n airflow exec -i airflow-scheduler-0 -c scheduler -- python - <<'PYEOF' 2>&1 | grep -v "DeprecatedImportWarning\|py.warnings" || echo "TaskInstance history query failed"
          from airflow.utils.session import create_session
          from airflow.models import TaskInstance
          with create_session() as session:
              # integrity_gate added by ROUND 15 (rider): ROUND 14 observed two
              # isolated cron failures AT the mapped integrity_gate layer with the
              # task absent from this dump -- a named diagnostics gap.
              tasks = ["wait_for_files", "discover", "stage", "integrity_gate", "dbt_build", "publish"]
              rows = (
                  session.query(TaskInstance)
                  .filter(TaskInstance.dag_id == "csv_ingest_customers", TaskInstance.task_id.in_(tasks))
                  .order_by(TaskInstance.run_id, TaskInstance.task_id, TaskInstance.map_index)
                  .all()
              )
              print("TOTAL TaskInstances (6 key tasks):", len(rows))
              for ti in rows:
                  print(ti.run_id, "| task=", ti.task_id, "| map_index=", ti.map_index, "| state=", ti.state, "| try=", ti.try_number, "| start=", ti.start_date, "| end=", ti.end_date)
          PYEOF

          echo "===== ROUND 5: scheduler log (current+previous container), csv_ingest_customers lines mentioning contention/pause/backfill/concurrency ====="
          { kubectl -n airflow logs airflow-scheduler-0 -c scheduler --since=100m 2>/dev/null; kubectl -n airflow logs airflow-scheduler-0 -c scheduler -p --since=100m 2>/dev/null; } | grep -i "csv_ingest_customers" | grep -iE "constraint|concurrency|max_active|AlreadyRunning|is_paused|starv|Backfill|wait_for_files|deferred|exceeds_max" | tail -500 || echo "no matching scheduler log lines"

          echo "===== ROUND 5: triggerer pod status (never monitored by any prior round's diagnostics) ====="
          kubectl -n airflow get pod -l component=triggerer -o wide || true
          kubectl -n airflow describe pod -l component=triggerer || true

          echo "===== ROUND 5: triggerer log (current+previous container), filtered for S3Key/customers/trigger activity ====="
          { kubectl -n airflow logs airflow-triggerer-0 -c triggerer --since=100m 2>/dev/null; kubectl -n airflow logs airflow-triggerer-0 -c triggerer -p --since=100m 2>/dev/null; } | grep -iE "s3key|wait_for_files|customers|trigger" | tail -300 || echo "no matching triggerer log lines"

          echo "===== ROUND 5: MinIO raw/customers/ listing (object count + LastModified timestamps) -- via mc inside the minio pod itself, no external tooling/ingress dependency ====="
          ROUND5_MINIO_ROOT_USER=$(kubectl -n data get secret minio-root -o jsonpath='{.data.rootUser}' 2>/dev/null | base64 -d)
          ROUND5_MINIO_ROOT_PASS=$(kubectl -n data get secret minio-root -o jsonpath='{.data.rootPassword}' 2>/dev/null | base64 -d)
          kubectl -n data exec deploy/minio -- sh -c "mc alias set diag http://localhost:9000 '$ROUND5_MINIO_ROOT_USER' '$ROUND5_MINIO_ROOT_PASS' >/dev/null 2>&1 && mc ls diag/raw/customers/ --recursive" 2>&1 | tail -80 || echo "MinIO listing failed"

          # ROUND 12 (debug/ci-pipeline-ingestion-timeout): the run->file mapping evidence
          # gap named by ROUND 11 -- which files each ingestion run staged, each run's
          # status/replay lineage, the dataset's schema-version history (the D-18 replay
          # trigger), and silver's per-run_id row distribution (the dedup-tie split root
          # cause 16 hinged on). Read straight from the analytics DB's persistent rows via
          # psql inside the CNPG primary -- one end-of-run snapshot reconstructs the whole
          # session, same reasoning as the ROUND 5 DB dumps above.
          echo "===== ROUND 12: meta.ingestion_runs -> meta.files mapping (customers, full session) ====="
          ROUND12_PRIMARY=$(kubectl -n data get pod -l cnpg.io/cluster=analytics-db,cnpg.io/instanceRole=primary -o name 2>/dev/null | head -1)
          # Older CNPG releases label the primary `role=primary` instead -- fall back.
          [ -n "$ROUND12_PRIMARY" ] || ROUND12_PRIMARY=$(kubectl -n data get pod -l cnpg.io/cluster=analytics-db,role=primary -o name 2>/dev/null | head -1)
          echo "primary pod: ${ROUND12_PRIMARY:-NOT FOUND}"
          kubectl -n data exec "${ROUND12_PRIMARY#pod/}" -c postgres -- psql -U postgres -d analytics -P pager=off -c "
            SELECT r.run_id, r.status, r.replay_of_run_id, f.file_id, f.object_uri,
                   left(r.idempotency_key, 20) AS idem_prefix, r.schema_version_id
              FROM meta.ingestion_runs r JOIN meta.files f USING (file_id)
              ORDER BY r.run_id;" 2>&1 | tail -120 || echo "run->file mapping query failed"
          echo "===== ROUND 12: meta.schema_versions history (the discovery idempotency-key term) ====="
          kubectl -n data exec "${ROUND12_PRIMARY#pod/}" -c postgres -- psql -U postgres -d analytics -P pager=off -c "
            SELECT schema_version_id, dataset_id, version, left(schema_hash, 12) AS hash_prefix,
                   derived_from, compatibility, valid_from, valid_to
              FROM meta.schema_versions ORDER BY schema_version_id;" 2>&1 | tail -40 || echo "schema_versions query failed"
          echo "===== ROUND 12: silver.customers _run_id distribution (dedup-tie lineage census) ====="
          kubectl -n data exec "${ROUND12_PRIMARY#pod/}" -c postgres -- psql -U postgres -d analytics -P pager=off -c "
            SELECT _run_id, count(*) AS silver_rows FROM silver.customers GROUP BY _run_id ORDER BY _run_id;" 2>&1 | tail -40 || echo "silver distribution query failed"
          echo "===== ROUND 12: staging.customers per-run row counts (bronze deliveries per pass) ====="
          kubectl -n data exec "${ROUND12_PRIMARY#pod/}" -c postgres -- psql -U postgres -d analytics -P pager=off -c "
            SELECT _run_id, count(*) AS bronze_rows, count(DISTINCT customer_id) AS distinct_keys
              FROM staging.customers GROUP BY _run_id ORDER BY _run_id;" 2>&1 | tail -60 || echo "bronze per-run query failed"

      - name: Install trimmed monitoring, run tests/e2e/observability, tear down
        run: make observability-verify-ci

      # D-24/D-30: runs strictly after cluster-verify above, on the SAME
      # cluster, with no data-seeding step between them — reusing
      # cluster-verify's own already-populated multi-dataset history as the
      # pre-drop baseline.
      - name: Run rebuild-from-raw (D-24 capstone)
        run: make rebuild-from-raw

      # D-22: an idempotent, commit-tagged failure issue in addition to the
      # red status check — since main already has this commit by
      # definition. Distinct title prefix from e2e-chaos.yml's own step so
      # the two suites never collide into one tracked issue.
      - name: File or update failure issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TITLE_PREFIX="E2E full suite failure on main"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" \
            --search "in:title \"$TITLE_PREFIX\"" --state open \
            --json number --jq '.[0].number // empty')
          BODY="Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          Commit: ${{ github.sha }}"
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" \
              --title "$TITLE_PREFIX: ${{ github.sha }}" --body "$BODY"
          fi
